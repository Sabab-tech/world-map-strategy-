<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 220" role="img" aria-labelledby="title desc">
<title id="title">OMEGA global trade port</title>
<desc id="desc">A dimensional container port with cargo vessel, cranes, stacked freight containers and an illuminated global trade network.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#06162f"/><stop offset=".58" stop-color="#123b59"/><stop offset="1" stop-color="#d38a59"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#174b68"/><stop offset=".36" stop-color="#0c344f"/><stop offset="1" stop-color="#04182e"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9f5ff"/><stop offset=".42" stop-color="#6aa4c5"/><stop offset="1" stop-color="#23486b"/></linearGradient>
 <linearGradient id="crane" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe5a1"/><stop offset=".44" stop-color="#cf9149"/><stop offset="1" stop-color="#704425"/></linearGradient>
 <linearGradient id="redBox" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffbf8a"/><stop offset=".4" stop-color="#c65d49"/><stop offset="1" stop-color="#713b3e"/></linearGradient>
 <linearGradient id="blueBox" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bceeff"/><stop offset=".38" stop-color="#338bb4"/><stop offset="1" stop-color="#123b63"/></linearGradient>
 <linearGradient id="goldBox" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b5"/><stop offset=".4" stop-color="#d3a24f"/><stop offset="1" stop-color="#77502e"/></linearGradient>
 <linearGradient id="shipHull" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8fb8ce"/><stop offset=".25" stop-color="#284f6e"/><stop offset="1" stop-color="#061b32"/></linearGradient>
 <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop stop-color="#ffe6b2" stop-opacity=".85"/><stop offset="1" stop-color="#ffbd78" stop-opacity="0"/></radialGradient>
 <pattern id="waterLines" width="86" height="15" patternUnits="userSpaceOnUse"><path d="M0 8h43m20 4h23" stroke="#8ddcf4" stroke-opacity=".23" stroke-width="1.4"/></pattern>
 <filter id="shadow" x="-20%" y="-30%" width="150%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
