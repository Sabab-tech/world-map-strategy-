<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="warehouse-title warehouse-desc" data-omega-icon-kind="logistics-node" data-omega-icon-id="warehouse-node">
<title id="warehouse-title">Raw resource warehouse</title>
<desc id="warehouse-desc">Layered metallic warehouse with a reinforced roof, illuminated loading door, stock crates and cyan edge lighting.</desc>
