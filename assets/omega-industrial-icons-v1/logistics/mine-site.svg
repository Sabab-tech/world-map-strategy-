<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="mine-title mine-desc" data-omega-icon-kind="logistics-node" data-omega-icon-id="mine-site">
<title id="mine-title">Resource mine site</title>
<desc id="mine-desc">Layered metallic mine badge with a mineral cut, headframe, ore seam and cyan edge lighting.</desc>
<defs>
 <linearGradient id="mine-plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1f7fb"/><stop offset=".48" stop-color="#8ca7b9"/><stop offset="1" stop-color="#304b60"/></linearGradient>
 <linearGradient id="mine-rock" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#526d80"/><stop offset="1" stop-color="#172d40"/></linearGradient>
 <linearGradient id="mine-ore" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8bf1ff"/><stop offset=".5" stop-color="#12a9db"/><stop offset="1" stop-color="#145a83"/></linearGradient>
 <linearGradient id="mine-steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecf6fc"/><stop offset=".45" stop-color="#7897aa"/><stop offset="1" stop-color="#2d4659"/></linearGradient>
 <filter id="mine-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#020b14" flood-opacity=".65"/></filter>
 <filter id="mine-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
