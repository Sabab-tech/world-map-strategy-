<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="mine-title mine-desc" data-omega-icon-kind="logistics-origin" data-omega-icon-id="mine-origin">
<title id="mine-title">Mine logistics origin</title>
<desc id="mine-desc">A layered metallic mine portal with ore hillside, headframe, tunnel entrance and glowing logistics route marker.</desc>
<defs>
  <linearGradient id="mine-plate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fcff"/><stop offset=".45" stop-color="#c5d4dc"/><stop offset="1" stop-color="#6e899b"/></linearGradient>
  <linearGradient id="mine-face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#314b5e"/><stop offset="1" stop-color="#0a1c2b"/></linearGradient>
  <linearGradient id="mine-rock" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#aab9c2"/><stop offset=".45" stop-color="#596f80"/><stop offset="1" stop-color="#273e50"/></linearGradient>
  <linearGradient id="mine-cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8f7ff"/><stop offset=".5" stop-color="#2fd7ff"/><stop offset="1" stop-color="#0873a6"/></linearGradient>
  <filter id="mine-shadow" x="-20%" y="-20%" width="140%" height="145%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#020b13" flood-opacity=".55"/></filter>
  <filter id="mine-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
