<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title-train-bulk-hopper desc-train-bulk-hopper" data-omega-icon-kind="transport" data-omega-icon-id="train-bulk-hopper">
<title id="title-train-bulk-hopper">Open bulk-hopper freight train</title>
<desc id="desc-train-bulk-hopper">Aggregate rail transport for dry bulk cargo. No individual vehicle registration identifier is stored.</desc>
<defs>
 <linearGradient id="plate-train-bulk-hopper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f8fb"/><stop offset=".5" stop-color="#bdcbd5"/><stop offset="1" stop-color="#71899b"/></linearGradient>
 <linearGradient id="metal-train-bulk-hopper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5fafc"/><stop offset=".35" stop-color="#becbd4"/><stop offset=".72" stop-color="#71889a"/><stop offset="1" stop-color="#344c60"/></linearGradient>
 <linearGradient id="blue-train-bulk-hopper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9be7f4"/><stop offset=".4" stop-color="#287fa9"/><stop offset="1" stop-color="#153e5e"/></linearGradient>
 <filter id="shadow-train-bulk-hopper" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#091725" flood-opacity=".48"/></filter>
</defs>
<rect x="4.5" y="4.5" width="119" height="119" rx="21" fill="url(#plate-train-bulk-hopper)" stroke="#627b8f" stroke-opacity=".8"/>
