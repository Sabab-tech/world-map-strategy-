<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title-train-container-freight desc-train-container-freight" data-omega-icon-kind="transport" data-omega-icon-id="train-container-freight">
<title id="title-train-container-freight">Container freight train</title>
<desc id="desc-train-container-freight">Aggregate rail transport for general cargo cargo. No individual vehicle registration identifier is stored.</desc>
