<!DOCTYPE html>
<html lang="en" 
      data-omega-engine-spec="INDUSTRIAL-ENTERPRISE-CORE"
      data-omega-contract-version="8.0.0-ULTIMATE"
      data-omega-html-version="10.0.0-ENTERPRISE-FINAL"
      data-boot-state="INITIALIZING">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Global Geopolitical Strategy Simulator | OMEGA CORE</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="leaflet.css">
    <link rel="stylesheet" href="style.css">

    <style>
        :root {
            --omega-neon: #00ffcc;
            --omega-danger: #ff4444;
            --omega-bg: #000000;
            --omega-glass: rgba(0, 20, 20, 0.85);
            --omega-border: rgba(0, 255, 204, 0.3);
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --font-mono: 'Share Tech Mono', monospace;
            --font-title: 'Orbitron', sans-serif;
        }

        html, body, #app {
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden; background: var(--omega-bg);
            font-family: 'Inter', sans-serif; color: #eee;
        }

        @keyframes resMarkerPulse {
            0% { transform: scale(1); opacity: 0.85; box-shadow: 0 0 8px currentColor; }
            50% { transform: scale(1.35); opacity: 0.35; box-shadow: 0 0 20px currentColor; }
            100% { transform: scale(1); opacity: 0.85; box-shadow: 0 0 8px currentColor; }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <!-- OMEGA runtime dependencies. The minister query router MUST load in the browser,
         because the interrogation controls are created dynamically by ministry_engine.js. -->
    <script src="offline_semantic_brain.js"></script>
    <script src="offline_query_engine.js"></script>
    <script src="minister_query_router.js"></script>
    <script src="ministry_engine.js"></script>
</body>
</html>
