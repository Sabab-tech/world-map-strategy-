<script>

<script>
(function(){
var start=function(){
  if(!window.Omega||!window.Omega.Kernel)return setTimeout(start,100);
  try{
    var kernel=window.Omega.Kernel,bridge=typeof kernel.createBridge==='function'?kernel.createBridge():null;
    var PE=window.PresentationEngine,presentation=typeof PE==='function'?new PE(kernel):null;
    if(presentation&&bridge)presentation.bridge=bridge;
    ['economy','defense'].forEach(function(id){if(typeof kernel.registerMinistry==='function')kernel.registerMinistry(id)});
    window.Omega.App={kernel:kernel,presentation:presentation,bridge:bridge,state:'READY'};
    if(window.OmegaMinistry&&typeof window.OmegaMinistry.createRuntime==='function'){
      var mr=window.OmegaMinistry.createRuntime();if(mr&&typeof mr.init==='function')mr.init(bridge);
      if(window.OMEGA_UI_ADAPTER&&typeof window.OMEGA_UI_ADAPTER.init==='function')window.OMEGA_UI_ADAPTER.init(mr,bridge,presentation);
    }
    if(window.OmegaProductionSemanticRuntime&&typeof window.OmegaProductionSemanticRuntime.init==='function')window.OmegaProductionSemanticRuntime.init();
    window.__OMEGA_DIAG__.state='RUNNING';window.dispatchEvent(new CustomEvent('OMEGA_READY',{detail:window.Omega.App}));
  }catch(e){window.__OMEGA_DIAG__.state='FAILED';window.__OMEGA_DIAG__.errors.push({msg:e.message,type:'BOOT'});console.error('[OMEGA BOOT]',e)}
};
window.addEventListener('load',start);
})();
</script>
