name: OMEGA PR CI Queue Coalescer
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  actions: write
  contents: read
concurrency:
  group: omega-pr-ci-coalescer-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  cancel-superseded-runs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel obsolete runs for this PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t stale_run_ids < <(
            gh run list --repo "$GITHUB_REPOSITORY" --branch "$HEAD_REF" --limit 1000 --json databaseId,status,headSha,workflowName |
              jq -r --arg current "$HEAD_SHA" '.[] | select(.headSha != $current and .status != "completed" and (.workflowName != "OMEGA Private Enterprise Real Browser E2E" or .status == "queued" or .status == "pending")) | .databaseId'
          )
          for run_id in "${stale_run_ids[@]}"; do
            # Cancellation can race with GitHub entering its cancelling state.
            # Cleanup is best-effort and must not fail the current head CI.
            cancelled=false
            for attempt in {1..6}; do
              if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null 2>&1; then
                cancelled=true
              fi
              run_status="$(gh run view "${run_id}" --repo "${GITHUB_REPOSITORY}" --json status --jq '.status' 2>/dev/null || printf 'unknown')"
              if [[ "${run_status}" == "completed" ]]; then
                if [[ "${cancelled}" == "true" ]]; then
                  echo "Cancelled obsolete PR run ${run_id}"
                else
                  echo "Obsolete PR run ${run_id} completed before cancellation; nothing left to cancel"
                fi
                break
              fi
              if [[ "${attempt}" -lt 6 ]]; then sleep 5; fi
            done
            if [[ "${run_status}" != "completed" ]]; then
              echo "::warning::Obsolete PR run ${run_id} remains ${run_status}; continuing current-head CI"
            fi
          done
          echo "Preserved all workflow runs for current PR head ${HEAD_SHA}"
