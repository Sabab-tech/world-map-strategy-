name: OMEGA Daily Game Clock
concurrency:
  group: omega-pr-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  push:
    branches:
      - main
      - feat/unified-daily-game-clock-autosave-hud-20261020
  pull_request:
    branches:
      - main
    paths:
      - 'omega_simulation_runtime.js'
      - 'omega_boot_performance_monitor_v1.js'
      - 'omega_world_simulation_scheduler_v1.js'
      - 'test/omega_daily_simulation_performance_telemetry.test.mjs'
      - 'omega_daily_workload_scheduler_v1.js'
      - 'test/omega_daily_workload_scheduler_v1.test.mjs'
      - 'docs/OMEGA_UNIVERSAL_DAILY_WORKLOAD_SCHEDULER_V1.md'
      - 'opponent_country_rules.js'
      - 'omega_opponent_autonomy_system.js'
      - 'test/omega_world_simulation_scheduler_v1.test.mjs'
      - 'test/opponent_country_rules_runtime.test.js'
      - 'world_ecosystem_engine.js'
      - 'omega_enterprise_composition_root_v10.js'
      - 'omega_game_lifecycle_runtime_v1.js'
      - 'omega_game_lifecycle_runtime_v1.css'
      - 'omega_ui_v2/app.js'
      - 'test/omega_active_ministry_tick_gate.test.mjs'
      - 'omega_finance_ministry_runtime_v1.js'
      - 'finance_runtime_rules_v1.json'
      - 'financial_transmission_rules_v1.json'
      - 'finance_macro_stability_rules_v1.json'
      - 'omega_government_banking_runtime_v1.js'
      - 'omega_economic_transmission_runtime_v1.js'
      - 'omega_forex_monetary_engine_v1.js'
      - 'omega_macro_stability_runtime_v1.js'
      - 'omega_home_ministry_engine_v1.js'
      - 'omega_battlefield_command_runtime_v1.js'
      - 'omega_resource_endowment_runtime.js'
      - 'omega_resource_economy_runtime_v2.js'
      - 'omega_global_market_system.js'
      - 'test/omega_global_market_system.test.mjs'
      - 'omega_resource_strategic_policy_runtime_v1.js'
      - 'omega_resource_system_hardening_v1.js'
      - 'SIMULATION_PIPELINE.md'
      - 'omega_resource_industrial_network_v1.js'
      - 'ministry_engine.js'
      - 'omega_minister_integration.js'
      - 'omega_live_operations_observability_v1.js'
      - 'resource_industrial_catalog_v1.json'
      - 'test/omega_resource_industrial_network_v1.test.mjs'
      - 'test/omega_simulation_runtime.test.js'
      - 'omega-offline-map-sw.js'
      - 'server.js'
      - 'omega_country_runtime_data_v1.js'
      - 'omega_country_general_data_runtime_v1.js'
      - 'test/omega_offline_data_cache.test.mjs'
      - 'test/omega_country_general_data_runtime_v1.test.mjs'
      - 'test/omega_resource_economy_runtime_v2.test.mjs'
      - 'test/omega_selected_country_background_scope.test.mjs'
      - 'index.html'
      - 'test/omega_simulation_daily_clock.test.mjs'
      - 'docs/OMEGA_ECONOMY_PHASE_ARCHITECTURE_AUDIT_V1.md'
      - 'test/omega_economy_phase_architecture_audit_v1.test.mjs'
      - '.github/workflows/omega-game-clock.yml'

permissions:
  contents: read

jobs:
  daily-clock-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify JavaScript syntax
        run: |
          node --check omega_simulation_runtime.js
          node --check omega_boot_performance_monitor_v1.js
          node --check omega_world_simulation_scheduler_v1.js
          node --check omega_daily_workload_scheduler_v1.js
          node --check test/omega_daily_workload_scheduler_v1.test.mjs
          node --check test/omega_daily_simulation_performance_telemetry.test.mjs
          node --check world_ecosystem_engine.js
          node --check omega_enterprise_composition_root_v10.js
          node --check omega_game_lifecycle_runtime_v1.js
          node --check omega_finance_ministry_runtime_v1.js
          node --check omega_government_banking_runtime_v1.js
          node --check omega_economic_transmission_runtime_v1.js
          node --check omega_forex_monetary_engine_v1.js
          node --check omega_macro_stability_runtime_v1.js
          node --check omega_home_ministry_engine_v1.js
          node --check omega_battlefield_command_runtime_v1.js
          node --check omega_resource_endowment_runtime.js
          node --check omega_resource_economy_runtime_v2.js
          node --check omega_global_market_system.js
          node --check test/omega_global_market_system.test.mjs
          node --check omega_resource_strategic_policy_runtime_v1.js
          node --check omega_resource_system_hardening_v1.js
          node --check omega_resource_industrial_network_v1.js
          node --check ministry_engine.js
          node --check omega_minister_integration.js
          node --check omega_live_operations_observability_v1.js
          node --check omega-offline-map-sw.js
          node --check server.js
          node --check omega_country_runtime_data_v1.js
          node --check omega_country_general_data_runtime_v1.js
          node --check test/omega_offline_data_cache.test.mjs
          node --check test/omega_country_general_data_runtime_v1.test.mjs
          node --check test/omega_resource_economy_runtime_v2.test.mjs
          node --check test/omega_selected_country_background_scope.test.mjs
          node --check test/omega_economy_phase_architecture_audit_v1.test.mjs test/omega_daily_workload_scheduler_v1.test.mjs test/omega_industrial_phase_checkpoint.test.mjs test/offline_hybrid_map.test.mjs
      - name: Test shared daily clock, saves and lifecycle wiring
        run: node --test test/omega_active_ministry_tick_gate.test.mjs test/omega_simulation_daily_clock.test.mjs test/omega_simulation_runtime.test.js test/omega_resource_industrial_network_v1.test.mjs test/omega_world_simulation_scheduler_v1.test.mjs test/opponent_country_rules_runtime.test.js test/omega_offline_data_cache.test.mjs test/omega_country_general_data_runtime_v1.test.mjs test/omega_resource_economy_runtime_v2.test.mjs test/omega_global_market_system.test.mjs test/omega_daily_workload_scheduler_v1.test.mjs test/omega_selected_country_background_scope.test.mjs test/omega_economy_phase_architecture_audit_v1.test.mjs test/omega_daily_simulation_performance_telemetry.test.mjs
