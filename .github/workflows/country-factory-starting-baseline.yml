      - 'resource_industrial_catalog_v1.json'
      - 'resource_country_resource_context_index.json'
      - 'economy_global_profiles_v1.json'
      - 'test/omega_country_factory_starting_baseline_v1.test.mjs'
      - 'scripts/rebalance_country_factory_starting_baseline_v1.mjs'
      - 'test/omega_country_factory_allocation_v2.test.mjs'
      - 'scripts/scale_country_factory_counts_v1.mjs'
      - 'test/omega_country_factory_count_scaling_v1.test.mjs'
      - 'test/omega_private_enterprise_baseline_v1.test.mjs'
      - 'docs/OMEGA_COUNTRY_FACTORY_COUNT_SCALING_V1.md'
      - 'docs/OMEGA_COUNTRY_FACTORY_ALLOCATION_V2.md'
      - 'factory_isic_mapping_v1.json'
      - 'scripts/build_country_factory_establishment_data_v1.mjs'
      - 'test/omega_country_factory_establishment_data_v1.test.mjs'
      - 'factory_isic_mapping_v1.json'
      - 'scripts/build_country_factory_establishment_data_v1.mjs'
      - 'test/omega_country_factory_establishment_data_v1.test.mjs'
      - 'country_private_factory_starting_baseline_v1.json'
      - 'omega_private_enterprise_registry_v1.js'
      - 'omega_ui_v2/screens/industry.js'
      - 'omega_private_enterprise_lifecycle_v1.js'
      - 'test/omega_private_enterprise_lifecycle_v1.test.mjs'
      - 'omega_simulation_runtime.js'
      - 'test/omega_private_enterprise_long_horizon_v1.test.mjs'
      - 'package.json'
      - 'omega_ui_v2/factory-production-command.css'
      - 'scripts/build_country_private_factory_starting_baseline_v1.mjs'
      - 'test/omega_private_enterprise_baseline_v1.test.mjs'
      - 'docs/OMEGA_PRIVATE_ENTERPRISE_BASELINE_V1.md'
      - 'index.html'
      - '.github/workflows/country-factory-starting-baseline.yml'
  push:
    branches: [main]
    paths:
      - 'country_factory_starting_baseline_v1.json'
      - 'country_factory_input_inventory_baseline_v1.json'
      - 'resource_startup_baseline_rules_v1.json'
      - 'country_primary_resource_opening_baseline_v1.json'
      - 'omega_ui_v2/screens/resource-ministry.js'
      - 'omega_resource_command_center_ui_v1.js'
      - 'test/omega_resource_ministry_premium_ui.test.mjs'
      - 'test/omega_resource_command_center_ui_v1.test.mjs'
      - 'scripts/build_country_factory_input_inventory_baseline_v1.mjs'
      - 'omega_resource_startup_baseline_v1.js'
      - 'test/omega_resource_startup_baseline_v1.test.mjs'
      - 'omega-offline-map-sw.js'
      - 'country_general_data_registry_v1.json'
      - 'scripts/enrich_country_factory_starting_baseline_v1.mjs'
      - 'test/country_factory_starting_baseline_alignment_v1.test.mjs'
      - 'test/omega_factory_country_simulation_integrity_v1.test.mjs'
      - 'omega_country_factory_starting_baseline_v1.js'
      - 'omega_resource_industrial_network_v1.js'
      - 'test/omega_resource_industrial_network_v1.test.mjs'
      - 'test/omega_factory_production_baseline.test.mjs'
      - 'resource_industrial_catalog_v1.json'
      - 'resource_country_resource_context_index.json'
      - 'economy_global_profiles_v1.json'
      - 'test/omega_country_factory_starting_baseline_v1.test.mjs'
      - 'scripts/rebalance_country_factory_starting_baseline_v1.mjs'
      - 'test/omega_country_factory_allocation_v2.test.mjs'
      - 'docs/OMEGA_COUNTRY_FACTORY_ALLOCATION_V2.md'
      - 'country_private_factory_starting_baseline_v1.json'
      - 'omega_private_enterprise_registry_v1.js'
      - 'omega_ui_v2/screens/industry.js'
      - 'omega_private_enterprise_lifecycle_v1.js'
      - 'test/omega_private_enterprise_lifecycle_v1.test.mjs'
      - 'omega_simulation_runtime.js'
      - 'test/omega_private_enterprise_long_horizon_v1.test.mjs'
      - 'package.json'
      - 'omega_ui_v2/factory-production-command.css'
      - 'scripts/build_country_private_factory_starting_baseline_v1.mjs'
      - 'test/omega_private_enterprise_baseline_v1.test.mjs'
      - 'docs/OMEGA_PRIVATE_ENTERPRISE_BASELINE_V1.md'
      - 'index.html'
      - '.github/workflows/country-factory-starting-baseline.yml'

permissions:
  contents: read

jobs:
  baseline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate 197-country, 21-factory starting matrix and sector alignment
        run: |
          node --test test/omega_resource_startup_baseline_v1.test.mjs test/omega_resource_ministry_premium_ui.test.mjs test/omega_resource_command_center_ui_v1.test.mjs test/omega_country_factory_starting_baseline_v1.test.mjs test/omega_resource_industrial_network_v1.test.mjs test/omega_factory_production_baseline.test.mjs test/omega_country_factory_establishment_data_v1.test.mjs test/country_factory_starting_baseline_alignment_v1.test.mjs test/omega_factory_country_simulation_integrity_v1.test.mjs test/omega_country_factory_allocation_v2.test.mjs test/omega_country_factory_count_scaling_v1.test.mjs test/omega_private_enterprise_baseline_v1.test.mjs test/omega_private_enterprise_lifecycle_v1.test.mjs test/omega_private_enterprise_long_horizon_v1.test.mjs
          node scripts/enrich_country_factory_starting_baseline_v1.mjs --check
          node scripts/rebalance_country_factory_starting_baseline_v1.mjs --check
          node scripts/scale_country_factory_counts_v1.mjs --check
          node scripts/build_country_private_factory_starting_baseline_v1.mjs --check
          node scripts/build_country_factory_input_inventory_baseline_v1.mjs --check
          node --check omega_resource_startup_baseline_v1.js
          node --check omega_resource_command_center_ui_v1.js
          node --check omega_ui_v2/screens/resource-ministry.js
          node --check scripts/build_country_factory_input_inventory_baseline_v1.mjs
      - name: Check establishment data importer and industry runtime
        run: |
          node --check scripts/build_country_factory_establishment_data_v1.mjs
          node --check scripts/rebalance_country_factory_starting_baseline_v1.mjs
          node --check scripts/scale_country_factory_counts_v1.mjs
          node --check omega_country_factory_starting_baseline_v1.js
          node --check omega_private_enterprise_registry_v1.js
          node --check omega_private_enterprise_lifecycle_v1.js
          node --check test/omega_private_enterprise_long_horizon_v1.test.mjs
          node --check scripts/build_country_private_factory_starting_baseline_v1.mjs
          node --check omega_resource_industrial_network_v1.js
          node --check omega_ui_v2/screens/industry.js
