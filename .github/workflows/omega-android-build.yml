name: OMEGA Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Download and package global mineral, oil/gas and coal sites for offline play
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache
          python -m pip install --disable-pip-version-check openpyxl==3.1.5
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            https://raw.githubusercontent.com/Alexander-ai/global-deposit-globe/main/public/deposits.json \
            -o .cache/global-deposits-source.json
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            https://web.archive.org/web/20260305063452id_/https://globalenergymonitor.org/wp-content/uploads/2026/03/Global-Oil-and-Gas-Extraction-Tracker-March-2026.xlsx \
            -o .cache/Global-Oil-and-Gas-Extraction-Tracker-March-2026.xlsx
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            https://raw.githubusercontent.com/1ways/coal-mine-tracker/main/non_closed_mines.csv \
            -o .cache/non_closed_mines.csv
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            https://raw.githubusercontent.com/1ways/coal-mine-tracker/main/closed_mines.csv \
            -o .cache/closed_mines.csv
          node scripts/omega_import_global_mineral_deposits.mjs .cache/global-deposits-source.json resource_site_global_deposit_catalog_v1.json
          python scripts/omega_import_global_energy_sites.py .cache/Global-Oil-and-Gas-Extraction-Tracker-March-2026.xlsx .cache/non_closed_mines.csv .cache/closed_mines.csv resource_site_global_energy_catalog_v1.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Verify global catalogs are packaged in the offline APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'assets/resource_site_global_deposit_catalog_v1.json'
          unzip -l "$APK" | grep -q 'assets/resource_site_global_energy_catalog_v1.json'
          echo "Verified both global catalogs are bundled under Android assets."
      - name: Report APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/*.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: omega-global-resource-app-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
