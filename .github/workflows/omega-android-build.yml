name: OMEGA Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download and package global mineral occurrences for offline play
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            https://raw.githubusercontent.com/Alexander-ai/global-deposit-globe/main/public/deposits.json \
            -o .cache/global-deposits-source.json
          node scripts/omega_import_global_mineral_deposits.mjs .cache/global-deposits-source.json resource_site_global_deposit_catalog_v1.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Report APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/*.apk
