name: OMEGA UI Visual System

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'map-engine-2.js'
      - 'map-engine-1.js'
      - 'offline-hybrid-map.js'
      - 'offline-hybrid-map.css'
      - 'test/offline_hybrid_map.test.mjs'
      - 'android/app/src/main/java/com/omega/globalsupremecommander/MainActivity.java'
      - 'omega_ui_visual_system_v1.css'
      - 'omega_icon_system_v1.js'
      - 'omega_icon_system_v1.css'
      - 'test/omega_icon_system.test.mjs'
      - 'test/omega_ui_visual_system.test.mjs'
      - 'package.json'
      - '.github/workflows/omega-ui-visual-system.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'map-engine-1.js'
      - 'map-engine-2.js'
      - 'offline-hybrid-map.js'
      - 'offline-hybrid-map.css'
      - 'test/offline_hybrid_map.test.mjs'
      - 'android/app/src/main/java/com/omega/globalsupremecommander/MainActivity.java'
      - 'omega_ui_visual_system_v1.css'
      - 'omega_icon_system_v1.js'
      - 'omega_icon_system_v1.css'
      - 'test/omega_icon_system.test.mjs'
      - 'test/omega_ui_visual_system.test.mjs'
      - 'package.json'
      - '.github/workflows/omega-ui-visual-system.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax-check map UI
        run: |
          node --check map-engine-1.js
          node --check map-engine-2.js
          node --check omega_ui_system_redesign_v1.js
          node --check offline-hybrid-map.js
      - name: Run UI visual and map-layer regression tests
        run: npm run test:ui-visual
