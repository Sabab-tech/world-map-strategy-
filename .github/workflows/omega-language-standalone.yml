name: OMEGA Language Standalone Migration

on:
  push:
    branches: [omega-language-consolidation-v1]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build exact standalone bundle
        run: node scripts/finalize_omega_language_standalone.cjs
      - name: Syntax gate
        run: |
          node --check omega_language_system.js
          node --check omega_universal_ai_runtime.js
          node --check omega_cognitive_engine.js
          node --check omega_ai_integrity_layer.js
          node --check server_bootstrap.js
      - name: Remove cognitive legacy lexicon dependency
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='omega_cognitive_engine.js';
          let s=fs.readFileSync(p,'utf8');
          const re=/const\s+lexPath\s*=\s*path\.resolve\(cwd,\s*['"]offline_lexicon\.json['"]\s*\);/;
          if(re.test(s)) s=s.replace(re,"const lexPath='';");
          if(/offline_lexicon\.json|offline_language_vocabulary\.json|offline_semantic_knowledge\.json|omega_game_language_ontology\.json|omega_game_language_source_inventory\.json|offline_semantic_brain\.js|offline_query_engine\.js|omega_game_language_bridge\.js|omega_reasoning_dispatcher\.js/.test(s)) throw new Error('COGNITIVE_LEGACY_LANGUAGE_REFERENCE_REMAINS');
          fs.writeFileSync(p,s);
          console.log('COGNITIVE_LEGACY_LANGUAGE_DEPENDENCY_REMOVED');
          NODE
      - name: Standalone dependency gate
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const s=fs.readFileSync('omega_language_system.js','utf8');
          const body=s.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\/\/.*$/gm,'');
          for(const r of [/\bfetch\s*\(/,/document\.createElement\(['"]script['"]\)/,/\bloadScript\s*\(/,/\bfetchJSON\s*\(/,/\beval\s*\(/,/new\s+Function\s*\(/]) if(r.test(body)) throw Error('LEGACY_OR_UNSAFE_RUNTIME_CONSTRUCT:'+r);
          if(!s.includes('SOURCE_DATA')||!s.includes('STANDALONE_READY')) throw Error('STANDALONE_API_MISSING');
          console.log('STANDALONE_DEPENDENCY_GATE_OK');
          NODE
      - name: Standalone runtime smoke test
        run: OMEGA_POST_MIGRATION=0 node scripts/test_omega_language_system.cjs
      - name: Remove legacy language sources and obsolete language-only tests
        run: |
          git rm -f \
            offline_language_vocabulary.json \
            offline_lexicon.json \
            offline_semantic_knowledge.json \
            omega_game_language_ontology.json \
            omega_game_language_source_inventory.json \
            offline_semantic_brain.js \
            offline_query_engine.js \
            omega_game_language_bridge.js \
            omega_reasoning_dispatcher.js \
            scripts/test_runtime_semantic_all_countries.mjs \
            scripts/validate_game_language_ontology.cjs \
            scripts/build_offline_lexicon.cjs
      - name: Verify legacy source absence
        run: OMEGA_POST_MIGRATION=1 node scripts/test_omega_language_system.cjs
      - name: Remove deleted-language commands from package scripts
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const blocked=['offline_language_vocabulary.json','offline_lexicon.json','offline_semantic_knowledge.json','omega_game_language_ontology.json','omega_game_language_source_inventory.json','offline_semantic_brain.js','offline_query_engine.js','omega_game_language_bridge.js','omega_reasoning_dispatcher.js','test_deep_semantic_brain.cjs','test_runtime_semantic_all_countries.mjs','validate_game_language_ontology.cjs','build_offline_lexicon.cjs','test_semantic_runtime_v4.cjs','test_semantic_runtime_v32.mjs','test_production_semantic_runtime_v3.mjs'];
          for(const [name,cmd] of Object.entries(p.scripts||{})) p.scripts[name]=String(cmd).split(' && ').filter(part=>!blocked.some(x=>part.includes(x))).join(' && ');
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          for(const [name,cmd] of Object.entries(p.scripts||{})) for(const x of blocked) if(String(cmd).includes(x)) throw Error(`package script ${name} still references ${x}`);
          console.log('PACKAGE_LANGUAGE_DEPENDENCIES_CLEAN');
          NODE
      - name: Final package and syntax gate
        run: |
          node --check omega_language_system.js
          node --check omega_universal_ai_runtime.js
          node --check omega_cognitive_engine.js
          node --check omega_ai_integrity_layer.js
          node --check server_bootstrap.js
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); const bad=['offline_language_vocabulary','offline_lexicon','offline_semantic_knowledge','omega_game_language_ontology','omega_game_language_source_inventory','offline_semantic_brain','offline_query_engine','omega_game_language_bridge','omega_reasoning_dispatcher']; for(const v of Object.values(p.scripts)) for(const x of bad) if(String(v).includes(x)) process.exit(1); console.log('PACKAGE_GATE_OK')"
      - name: Commit finalized migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: make OMEGA language system fully standalone [skip ci]"
          git push
