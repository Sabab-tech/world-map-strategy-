name: OMEGA Language Standalone Migration

on:
  push:
    branches: [omega-language-consolidation-v1]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build exact standalone bundle when migration sources exist
        run: |
          if [ -f scripts/finalize_omega_language_standalone.cjs ] && [ -f scripts/omega_language_system.runtime.template.js ]; then
            node scripts/finalize_omega_language_standalone.cjs
          else
            echo 'CANONICAL_BUNDLE_ALREADY_FINALIZED'
          fi
      - name: Syntax gate for canonical and stable server layers
        run: |
          node --check omega_language_system.js
          node --check omega_universal_ai_runtime.js
          node --check omega_cognitive_engine.js
          node --check omega_ai_integrity_layer.js
          node --check server_bootstrap.js
          node --check server.js
      - name: Repair surviving router and migrate server to canonical language boundary
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const retired=['offline_language_vocabulary.json','offline_lexicon.json','offline_semantic_knowledge.json','omega_game_language_ontology.json','omega_game_language_source_inventory.json','offline_semantic_brain.js','offline_query_engine.js','omega_game_language_bridge.js','omega_reasoning_dispatcher.js'];
          const router='minister_query_router.js';
          let r=fs.readFileSync(router,'utf8');
          const lines=r.split(/\r?\n/), i=lines.findIndex(x=>x.includes('function classify(q){'));
          if(i>=0)lines[i]="function classify(q){const w=new Set(words(q));const has=a=>a.some(x=>w.has(x));const trade=['import','imports','importing','export','exports','exporting','supplier','suppliers','buy','buying','purchase','sell','selling','trade','trading','shipment','shipping','freight','tariff','tariffs'];const sec=['secure','security','safe','safety','stockpile','stockpiles','reserve','reserves','shortage','depletion','runway','buffer','vulnerable','risk'];const cmp=['compare','versus','vs','higher','lower','more','less','best','better','largest','smallest'];const loc=['where','location','located','based','situated'];const cnt=['how','many','number','count','total','quantity','amount'];let operation='LOOKUP';if(has(sec))operation='SECURITY';else if(has(trade))operation=has(['import','imports','buy','purchase','supplier','suppliers'])?'IMPORT':'EXPORT';else if(has(cmp))operation='COMPARE';else if(has(loc))operation='LOCATION';else if(has(cnt))operation='COUNT';const speech=/^(hi|hello|hey|হ্যালো|হাই)/i.test(norm(q))?'CONVERSATION':(/[?]$/.test(q)||/\\b(who|what|which|where|when|why|how)\\b/i.test(q)||/কি|কী|কেন|কোথায়|কোথায়|কত|কে/.test(q)?'QUESTION':'STATEMENT');return{operation,speech,subject:/\\b(i|me|my|our|we)\\b|\\b(আমার|আমরা|আমি)/i.test(q)?'PLAYER'}}";
          else throw new Error('MINISTER_ROUTER_CLASSIFY_FUNCTION_NOT_FOUND');
          r=lines.join('\n').replace(/,?\s*['"]offline_semantic_knowledge\.json['"]/g,'');
          fs.writeFileSync(router,r);
          const strip=x=>x.replace(/\/\*[\s\S]*?\*\//g,'').replace(/(^|[^:])\/\/.*$/gm,'$1');
          for(const f of retired)if(strip(r).includes(f))throw new Error(`MINISTER_ROUTER_RETAINS_LEGACY_LANGUAGE_DEPENDENCY:${f}`);

          const p='server.js'; let s=fs.readFileSync(p,'utf8');
          s=s.replace(/import ['"]\.\/offline_semantic_brain\.js['"];\s*/g,'').replace(/import ['"]\.\/offline_query_engine\.js['"];\s*/g,'');
          s=s.replace(/const OfflineSemanticBrain = globalThis\.OfflineSemanticBrain;\s*/g,'').replace(/const OfflineQueryEngine = globalThis\.OfflineQueryEngine;\s*/g,'');
          s=s.replace(/let languageVocabulary = \{\};[\s\S]*?const semanticRuntime = OfflineSemanticBrain\.configure\(\{ datasets: semanticDatasets, vocabulary: languageVocabulary \}\);/,
`const __languageSandbox = { console, Date, JSON, Object, Array, Map, Set, Math, RegExp, String, Number, Promise, Intl, localStorage: { getItem(){return null}, setItem(){} } };\n__languageSandbox.globalThis=__languageSandbox;\n__languageSandbox.window=__languageSandbox;\nconst __languageSource = fs.readFileSync(path.join(__dirname,'omega_language_system.js'),'utf8');\nawaitLoadCanonical(__languageSource);\nconst OmegaLanguageSystem = __languageSandbox.OmegaLanguageSystem;\nif(!OmegaLanguageSystem || OmegaLanguageSystem.STATUS !== 'STANDALONE_READY') throw new Error('OMEGA_LANGUAGE_SYSTEM_STANDALONE_UNAVAILABLE');\nfunction awaitLoadCanonical(source){ vm.runInNewContext(source,__languageSandbox,{filename:'omega_language_system.js'}); }\nfunction canonicalRun(prompt,ctx={}){ OmegaLanguageSystem.configure({datasets:semanticDatasets,context:ctx}); return OmegaLanguageSystem.run(prompt,ctx); }\nconst semanticRuntime = OmegaLanguageSystem.diagnostics();`);
          s=s.replace(/import \{ GoogleGenAI \} from '@google\/genai';/,"import { GoogleGenAI } from '@google/genai';\nimport vm from 'node:vm';");
          s=s.replace(/OfflineSemanticBrain\.parse\(prompt, \{ countryId, resourceId, ministerId, timeHorizon \}\)/g,"(OmegaLanguageSystem.configure({datasets:semanticDatasets,context:{countryId,resourceId,ministerId,timeHorizon}}), OmegaLanguageSystem.parse(prompt,{countryId,resourceId,ministerId,timeHorizon}))");
          s=s.replace(/OfflineSemanticBrain\.parse\(prompt, \{ countryId: identity\.countryCode, ministerId: identity\.ministerId, timeHorizon \}\)/g,"(OmegaLanguageSystem.configure({datasets:semanticDatasets,context:{countryId:identity.countryCode,ministerId:identity.ministerId,timeHorizon}}), OmegaLanguageSystem.parse(prompt,{countryId:identity.countryCode,ministerId:identity.ministerId,timeHorizon}))");
          s=s.replace(/OfflineSemanticBrain\.explain\(parsed\)/g,'parsed').replace(/OfflineSemanticBrain\.explain\(semantic\)/g,'semantic');
          s=s.replace(/OfflineQueryEngine\.execute\(parsed, semanticDatasets, language === 'bn' \|\| parsed\.language === 'bn' \? 'bn' : 'en', \{ countryId, resourceId, ministerId, timeHorizon \}\)/g,"canonicalRun(prompt,{countryId,resourceId,ministerId,timeHorizon})");
          s=s.replace(/OfflineQueryEngine\.execute\(semantic, semanticDatasets, language === 'bn' \|\| semantic\.language === 'bn' \? 'bn' : 'en', \{ countryId: identity\.countryCode, ministerId: identity\.ministerId, ministerProfile: profile, timeHorizon \}\)/g,"canonicalRun(prompt,{countryId:identity.countryCode,ministerId:identity.ministerId,timeHorizon})");
          s=s.replace(/const answer = data\?\.result\?\.text \|\| data\?\.text \|\| getLanguage\(\)\.realize\(data\?\.result \|\| \{\}, language\);/g,"const answer = data?.result?.text || data?.text || OmegaLanguageSystem.realize(data?.result || {}, language);");
          fs.writeFileSync(p,s);
          const sb=strip(s); for(const f of retired)if(sb.includes(f))throw new Error(`SERVER_RETAINS_LEGACY_LANGUAGE_DEPENDENCY:${f}`);
          NODE
          node --check minister_query_router.js
          node --check server.js
      - name: Remove cognitive legacy lexicon dependency
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='omega_cognitive_engine.js';
          let s=fs.readFileSync(p,'utf8');
          const re=/const\s+lexPath\s*=\s*path\.resolve\(cwd,\s*['"]offline_lexicon\.json['"]\s*\);/;
          if(re.test(s)) s=s.replace(re,"const lexPath='';");
          if(/offline_lexicon\.json|offline_language_vocabulary\.json|offline_semantic_knowledge\.json|omega_game_language_ontology\.json|omega_game_language_source_inventory\.json|offline_semantic_brain\.js|offline_query_engine\.js|omega_game_language_bridge\.js|omega_reasoning_dispatcher\.js/.test(s)) throw new Error('COGNITIVE_LEGACY_LANGUAGE_REFERENCE_REMAINS');
          fs.writeFileSync(p,s);
          NODE
      - name: Standalone dependency and security gate
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const s=fs.readFileSync('omega_language_system.js','utf8');
          const body=s.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\/\/.*$/gm,'');
          for(const r of [/\bfetch\s*\(/,/document\.createElement\(['"]script['"]\)/,/\bloadScript\s*\(/,/\bfetchJSON\s*\(/,/\beval\s*\(/,/new\s+Function\s*\(/]) if(r.test(body)) throw Error('LEGACY_OR_UNSAFE_RUNTIME_CONSTRUCT:'+r);
          if(!s.includes('SOURCE_DATA')||!s.includes('SOURCE_ARCHIVE')||!s.includes('STANDALONE_READY')) throw Error('STANDALONE_API_MISSING');
          console.log('STANDALONE_SECURITY_GATE_OK');
          NODE
      - name: Standalone runtime smoke test
        run: OMEGA_POST_MIGRATION=0 node scripts/test_omega_language_system.cjs
      - name: Behavioral offline execution regression
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const sandbox={console,Date,JSON,Object,Array,Map,Set,Math,RegExp,String,Number,Promise,Intl,setTimeout,clearTimeout,localStorage:{d:new Map(),getItem(k){return this.d.get(k)||null},setItem(k,v){this.d.set(k,String(v))}},Game:{state:{}}};
          sandbox.globalThis=sandbox;sandbox.window=sandbox;
          vm.runInNewContext(fs.readFileSync('omega_language_system.js','utf8'),sandbox,{filename:'omega_language_system.js'});
          const L=sandbox.OmegaLanguageSystem;
          const ds=[{countries:[{id:'BGD',name:'Bangladesh',resources:{iron:{name:'Iron',production:120,stockpile:900,reserves:5000}}},{id:'AUS',name:'Australia',resources:{iron:{name:'Iron',production:900,exports:600,reserves:20000}}}]}];
          L.configure({datasets:ds,context:{countryId:'BGD',countryName:'Bangladesh'}});
          const p=L.parse('How many iron mines are in Bangladesh?');
          assert.equal(p.operation,'COUNT');
          const q=L.run('How much iron production is in Bangladesh?',{countryId:'BGD',countryName:'Bangladesh'});
          assert.ok(q&&q.result&&q.result.available,'offline executor did not execute a quantity query');
          const sup=L.run('Which country can I import iron from?',{countryId:'BGD',countryName:'Bangladesh'});
          assert.equal(sup.analysis.operation,'RECOMMEND');
          assert.ok(sup.result&&sup.result.available,'offline supplier execution did not run');
          console.log('OMEGA_OFFLINE_EXECUTION_REGRESSION_OK');
          NODE
      - name: Remove legacy language sources, obsolete runtimes, build-only inputs, and obsolete language-only tests
        run: |
          for f in \
            offline_language_vocabulary.json offline_lexicon.json offline_semantic_knowledge.json \
            omega_game_language_ontology.json omega_game_language_source_inventory.json \
            offline_semantic_brain.js offline_query_engine.js omega_game_language_bridge.js omega_reasoning_dispatcher.js \
            omega_country_semantic_bridge.js omega_semantic_runtime_v31.js omega_semantic_runtime_v32.js \
            omega_production_semantic_runtime_v3.js \
            scripts/test_runtime_semantic_all_countries.mjs scripts/validate_game_language_ontology.cjs \
            scripts/test_semantic_runtime_v4.cjs scripts/test_semantic_runtime_v32.mjs scripts/test_production_semantic_runtime_v3.mjs \
            scripts/test_minister_cognition.cjs scripts/test_reasoning_dispatcher.cjs \
            scripts/build_offline_lexicon.cjs scripts/omega_language_execution_module.js \
            scripts/omega_language_execution_module_v2.js scripts/omega_language_system.runtime.template.js; do
            [ -e "$f" ] && git rm -f "$f" || true
          done
          node - <<'NODE'
          const fs=require('node:fs');
          if(fs.existsSync('index.html')){let s=fs.readFileSync('index.html','utf8');s=s.replace(/\s*<script\s+src=["']omega_production_semantic_runtime_v3\.js["'][^>]*><\/script>\s*/g,'\n');fs.writeFileSync('index.html',s)}
          NODE
      - name: Verify legacy source absence
        run: OMEGA_POST_MIGRATION=1 node scripts/test_omega_language_system.cjs
      - name: Repository-wide retired-language reference gate
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const retired=['offline_language_vocabulary.json','offline_lexicon.json','offline_semantic_knowledge.json','omega_game_language_ontology.json','omega_game_language_source_inventory.json','offline_semantic_brain.js','offline_query_engine.js','omega_game_language_bridge.js','omega_reasoning_dispatcher.js'];
          const allowed=new Set(['omega_language_system.js','.github/workflows/omega-language-standalone.yml','scripts/test_omega_language_system.cjs','package.json']);
          const strip=s=>s.replace(/\/\*[\s\S]*?\*\//g,'').replace(/(^|[^:])\/\/.*$/gm,'$1');
          const files=[];(function walk(d){for(const n of fs.readdirSync(d)){if(n==='.git'||n==='node_modules')continue;const p=path.join(d,n),st=fs.statSync(p);if(st.isDirectory())walk(p);else if(/\.(?:js|cjs|mjs|json)$/.test(p))files.push(p)}})('.');
          const bad=[];for(const f of files){const rel=f.replaceAll('\\','/');if(allowed.has(rel))continue;if(retired.some(x=>strip(fs.readFileSync(f,'utf8')).includes(x)))bad.push(rel)}
          if(bad.length)throw new Error('RETIRED_LANGUAGE_REFERENCES:'+bad.join(','));
          console.log('REPOSITORY_RETIRED_LANGUAGE_REFERENCE_GATE_OK');
          NODE
      - name: Remove deleted-language commands from package scripts
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const blocked=['offline_language_vocabulary.json','offline_lexicon.json','offline_semantic_knowledge.json','omega_game_language_ontology.json','omega_game_language_source_inventory.json','offline_semantic_brain.js','offline_query_engine.js','omega_game_language_bridge.js','omega_reasoning_dispatcher.js','test_deep_semantic_brain.cjs','test_runtime_semantic_all_countries.mjs','validate_game_language_ontology.cjs','build_offline_lexicon.cjs','test_semantic_runtime_v4.cjs','test_semantic_runtime_v32.mjs','test_production_semantic_runtime_v3.mjs','test_minister_cognition.cjs','test_reasoning_dispatcher.cjs','omega_country_semantic_bridge.js','omega_semantic_runtime_v31.js','omega_semantic_runtime_v32.js','omega_production_semantic_runtime_v3.js','omega_language_system.runtime.template.js','omega_language_execution_module.js','omega_language_execution_module_v2.js'];
          for(const [name,cmd] of Object.entries(p.scripts||{})) p.scripts[name]=String(cmd).split(' && ').filter(part=>!blocked.some(x=>part.includes(x))).join(' && ');
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          for(const [name,cmd] of Object.entries(p.scripts||{})) for(const x of blocked) if(String(cmd).includes(x)) throw Error(`package script ${name} still references ${x}`);
          NODE
      - name: Final package, syntax, and post-migration runtime gate
        run: |
          node --check omega_language_system.js
          node --check omega_universal_ai_runtime.js
          node --check omega_cognitive_engine.js
          node --check omega_ai_integrity_layer.js
          node --check server_bootstrap.js
          node --check server.js
          node --check minister_query_router.js
          OMEGA_POST_MIGRATION=1 node scripts/test_omega_language_system.cjs
          node -e "const p=require('./package.json'); for(const v of Object.values(p.scripts)) if(/offline_(language_vocabulary|lexicon|semantic_knowledge)|omega_game_language_(ontology|source_inventory|bridge)|offline_semantic_(brain)|offline_query_engine|omega_reasoning_dispatcher|validate_game_language_ontology|test_runtime_semantic_all_countries|build_offline_lexicon|test_semantic_runtime_|test_production_semantic_runtime_|test_minister_cognition|test_reasoning_dispatcher|omega_country_semantic_bridge|omega_semantic_runtime_v3|omega_production_semantic_runtime_v3|omega_language_system\.runtime\.template|omega_language_execution_module/.test(v)) process.exit(1); console.log('PACKAGE_GATE_OK')"
      - name: Commit finalized migration
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: finalize standalone OMEGA language system [skip ci]"
          git push
