name: OMEGA NPC National Macro-Economy Runtime

on:
  pull_request:
    paths:
      - "omega_npc_national_macro_economy_runtime_v1.js"
      - "docs/OMEGA_PHASE3C_MACRO_EVIDENCE_MATRIX_V1.md"
      - "test/omega_npc_macro_evidence_contract_v1.test.mjs"
      - "omega_national_accounts_runtime_v1.js"
      - "national_accounts_rules_v1.json"
      - "test/omega_national_accounts_runtime_v1.test.mjs"
      - "docs/OMEGA_PHASE4A_NATIONAL_ACCOUNTS_FOUNDATION.md"
      - "npc_national_macro_economy_rules_v1.json"
      - "test/omega_npc_national_macro_economy_runtime_v1.test.mjs"
      - "omega_global_trade_system.js"
      - "test/omega_global_trade_system.test.mjs"
      - "omega_opponent_treaty_lifecycle_system.js"
      - "test/omega_opponent_treaty_lifecycle_system.test.mjs"
      - "omega_resource_command_center_ui_v1.js"
      - "test/omega_resource_command_center_ui_v1.test.mjs"
      - "omega_finance_ministry_runtime_v1.js"
      - "test/omega_finance_ministry_runtime_v1.test.mjs"
      - "omega_macro_stability_runtime_v1.js"
      - "test/omega_macro_stability_runtime_v1.test.mjs"
      - "omega_economic_transmission_runtime_v1.js"
      - "test/omega_economic_transmission_runtime_v1.test.mjs"
      - "omega_world_simulation_scheduler_v1.js"
      - "test/omega_world_simulation_scheduler_v1.test.mjs"
      - "test/omega_simulation_daily_clock.test.mjs"
      - "omega_simulation_runtime.js"
      - "package.json"
      - "omega_ministry_state_transaction.js"
      - ".github/workflows/omega-npc-national-economy.yml"
  push:
    branches: [main]
    paths:
      - "omega_npc_national_macro_economy_runtime_v1.js"
      - "omega_national_accounts_runtime_v1.js"
      - "national_accounts_rules_v1.json"
      - "test/omega_national_accounts_runtime_v1.test.mjs"
      - "docs/OMEGA_PHASE4A_NATIONAL_ACCOUNTS_FOUNDATION.md"
      - "npc_national_macro_economy_rules_v1.json"
      - "test/omega_npc_national_macro_economy_runtime_v1.test.mjs"
      - "omega_global_trade_system.js"
      - "test/omega_global_trade_system.test.mjs"
      - "omega_opponent_treaty_lifecycle_system.js"
      - "test/omega_opponent_treaty_lifecycle_system.test.mjs"
      - "omega_resource_command_center_ui_v1.js"
      - "test/omega_resource_command_center_ui_v1.test.mjs"
      - "omega_finance_ministry_runtime_v1.js"
      - "test/omega_finance_ministry_runtime_v1.test.mjs"
      - "omega_macro_stability_runtime_v1.js"
      - "test/omega_macro_stability_runtime_v1.test.mjs"
      - "omega_economic_transmission_runtime_v1.js"
      - "test/omega_economic_transmission_runtime_v1.test.mjs"
      - "omega_world_simulation_scheduler_v1.js"
      - "test/omega_world_simulation_scheduler_v1.test.mjs"
      - "test/omega_simulation_daily_clock.test.mjs"
      - "omega_simulation_runtime.js"
      - "package.json"
      - "omega_ministry_state_transaction.js"
      - ".github/workflows/omega-npc-national-economy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify NPC macro-economy runtime
        run: npm run test:npc-macro-economy && node --test test/omega_npc_macro_evidence_contract_v1.test.mjs
      - name: Verify world trade and bounded treaty autonomy
        run: npm run test:global-trade && npm run test:treaty-lifecycle
      - name: Verify world market activity UI
        run: node --test test/omega_resource_command_center_ui_v1.test.mjs
      - name: Verify bounded macro country execution
        run: npm run test:bounded-macro-runtime
      - name: Verify bounded national-economy Finance integration
        run: npm run test:bounded-national-economy
