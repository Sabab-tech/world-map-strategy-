name: OMEGA Android 9 WebView Performance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-nine-webview-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Run packaged APK in Android 9 WebView emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle -p android connectedDebugAndroidTest --no-daemon

      - name: Export Android 9 WebView diagnostics
        if: always()
        run: |
          mkdir -p android-performance-artifacts
          adb devices -l > android-performance-artifacts/adb-devices.txt 2>&1 || true
          timeout 20s adb logcat -d -t 5000 > android-performance-artifacts/android9-logcat-raw.log 2>&1 || true
          grep -E 'OMEGA_ANDROID_PERFORMANCE|OMEGA_WEB_DIAGNOSTICS|AndroidRuntime|TestRunner|INSTRUMENTATION_STATUS|INSTRUMENTATION_RESULT' android-performance-artifacts/android9-logcat-raw.log > android-performance-artifacts/android9-webview.log || true

      - name: Upload Android WebView benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-android-9-webview-performance-${{ github.sha }}
          path: |
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/androidTests/connected/**
            android-performance-artifacts/**
          if-no-files-found: warn
          retention-days: 14
