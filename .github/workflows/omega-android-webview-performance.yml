name: OMEGA Android 9 WebView Performance

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'omega_national_accounts_runtime_v1.js'
      - 'omega_resource_research_runtime_v1.js'
      - 'scripts/transpile_android_web_assets.mjs'
      - 'scripts/android_web_asset_scope.mjs'
      - 'test/omega_android_web_asset_scope.test.mjs'
      - 'national_accounts_rules_v1.json'
      - 'omega_finance_ministry_runtime_v1.js'
      - 'omega_world_simulation_scheduler_v1.js'
      - 'omega_resource_economy_runtime_v2.js'
      - 'omega_resource_industrial_network_v1.js'
      - 'omega_global_trade_system.js'
      - 'index.html'
      - '.github/workflows/omega-android-webview-performance.yml'
      - 'scripts/run_android_webview_performance.py'
  pull_request:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'omega_national_accounts_runtime_v1.js'
      - 'omega_resource_research_runtime_v1.js'
      - 'scripts/transpile_android_web_assets.mjs'
      - 'scripts/android_web_asset_scope.mjs'
      - 'test/omega_android_web_asset_scope.test.mjs'
      - 'national_accounts_rules_v1.json'
      - 'omega_finance_ministry_runtime_v1.js'
      - 'omega_world_simulation_scheduler_v1.js'
      - 'omega_resource_economy_runtime_v2.js'
      - 'omega_resource_industrial_network_v1.js'
      - 'omega_global_trade_system.js'
      - 'index.html'
      - '.github/workflows/omega-android-webview-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-nine-webview-performance:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Verify Android asset helper scoping
        run: node --test test/omega_android_web_asset_scope.test.mjs

      - name: Test Android 9 WebView instrumentation gate
        run: python3 scripts/test_android_webview_performance.py

      - name: Run packaged APK in Android 9 WebView emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            mkdir -p android-performance-artifacts
            python3 scripts/run_android_webview_performance.py

      - name: Verify Android 9 WebView diagnostics bundle
        if: always()
        run: |
          mkdir -p android-performance-artifacts
          if [ ! -f android-performance-artifacts/gradle-android9.log ]; then
            printf 'Emulator action did not reach the Gradle instrumentation script.\n' > android-performance-artifacts/gradle-android9.log
          fi
          find android-performance-artifacts -maxdepth 1 -type f -print

      - name: Upload Android WebView benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-android-9-webview-performance-${{ github.sha }}
          path: |
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/androidTests/connected/**
            android-performance-artifacts/**
          if-no-files-found: warn
          retention-days: 14
