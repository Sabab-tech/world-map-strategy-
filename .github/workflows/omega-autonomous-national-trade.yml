name: OMEGA Autonomous National Trade

on:
  pull_request:
    paths:
      - "omega_autonomous_national_trade_decision_engine_v1.js"
      - "omega_autonomous_national_trade_decision_rules_v1.json"
      - "omega_bilateral_trade_agreement_system_v1.js"
      - "omega_global_market_system.js"
      - "omega_global_trade_system.js"
      - "omega_world_simulation_scheduler_v1.js"
      - "omega_resource_national_demand_runtime_v1.js"
      - "test/omega_resource_national_demand_runtime_v1.test.mjs"
      - "omega_resource_economy_runtime_v2.js"
      - "test/omega_resource_economy_runtime_v2.test.mjs"
      - "test/omega_simulation_daily_clock.test.mjs"
      - "test/omega_resource_true_e2e_pipeline.test.mjs"
      - "test/omega_resource_mine_management_v1.test.mjs"
      - "omega_ministry_interoperability_system.js"
      - "index.html"
      - "server_bootstrap.js"
      - "omega-offline-map-sw.js"
      - "package.json"
      - "test/omega_autonomous_national_trade_decision_engine_v1.test.mjs"
      - "test/omega_npc_national_macro_economy_runtime_v1.test.mjs"
      - "test/omega_world_economy_game_day_integration.test.mjs"
      - "minister_country_roster_manifest_v1.json"
      - "test/omega_bilateral_trade_agreement_system_v1.test.mjs"
      - ".github/workflows/omega-autonomous-national-trade.yml"
  push:
    branches: [main]
    paths:
      - "omega_autonomous_national_trade_decision_engine_v1.js"
      - "omega_autonomous_national_trade_decision_rules_v1.json"
      - "omega_bilateral_trade_agreement_system_v1.js"
      - "omega_global_market_system.js"
      - "omega_global_trade_system.js"
      - "omega_world_simulation_scheduler_v1.js"
      - "omega_resource_national_demand_runtime_v1.js"
      - "omega_resource_economy_runtime_v2.js"
      - "test/omega_resource_economy_runtime_v2.test.mjs"
      - "test/omega_simulation_daily_clock.test.mjs"
      - "test/omega_resource_true_e2e_pipeline.test.mjs"
      - "test/omega_resource_mine_management_v1.test.mjs"
      - "omega_ministry_interoperability_system.js"
      - "index.html"
      - "server_bootstrap.js"
      - "omega-offline-map-sw.js"
      - "package.json"
      - "test/omega_autonomous_national_trade_decision_engine_v1.test.mjs"
      - "test/omega_npc_national_macro_economy_runtime_v1.test.mjs"
      - "test/omega_bilateral_trade_agreement_system_v1.test.mjs"
      - "test/omega_world_economy_game_day_integration.test.mjs"
      - "minister_country_roster_manifest_v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-national-trade:
    name: Planner, bilateral integration and offline boot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check omega_autonomous_national_trade_decision_engine_v1.js
          node --check omega_resource_national_demand_runtime_v1.js
          node --check omega_resource_economy_runtime_v2.js
          node --check test/omega_resource_economy_runtime_v2.test.mjs
          node --check test/omega_simulation_daily_clock.test.mjs
          node --check test/omega_resource_national_demand_runtime_v1.test.mjs
          node --check test/omega_autonomous_national_trade_decision_engine_v1.test.mjs
          node --check server_bootstrap.js
          node --check test/omega_npc_national_macro_economy_runtime_v1.test.mjs
          node --check test/omega_resource_command_center_ui_v1.test.mjs
      - name: Read-only national resource-demand evidence tests
        run: npm run test:resource-demand
      - name: Physical stock-flow, write-off, shipment-loss and production-loss regression
        run: npm run test:resource-endowment
      - name: Daily clock opening/closing stock-flow regression
        run: node --test test/omega_simulation_daily_clock.test.mjs
      - name: Existing real resource gameplay pipeline
        run: npm run test:resource-e2e
      - name: Existing mine management and inventory pipeline
        run: npm run test:resource-mine-management
      - name: Autonomous national trade tests
        run: npm run test:autonomous-national-trade
      - name: Bilateral trade regression tests
        run: npm run test:bilateral-trade
      - name: Scheduler, ministry boot and offline asset-order regression
        run: node --test test/omega_npc_national_macro_economy_runtime_v1.test.mjs
      - name: Offline asset cache regression
        run: node --test test/omega_resource_command_center_ui_v1.test.mjs
      - name: Full 100-day game run on the canonical 197-country roster
        run: |
          node --check omega_world_simulation_scheduler_v1.js
          node --check test/omega_world_economy_game_day_integration.test.mjs
          node --test test/omega_world_economy_game_day_integration.test.mjs
          node --test --test-name-pattern='^(?!.*constrained Android devices).* test/omega_world_simulation_scheduler_v1.test.mjs
      - name: War, conflict, sanctions, crisis and relationship decision regressions
        run: |
          npm run test:opponent-autonomy
          npm run test:opponent-multi-country
          npm run test:treaty-lifecycle
          npm run test:country-behavior
          npm run test:black-market
      - name: Global market, bilateral business and NPC macro economy
        run: |
          npm run test:global-trade
          npm run test:global-market
          npm run test:npc-macro-economy
          npm run test:finance-transmission
      - name: Full economy audit and national accounts reconciliation
        run: node --test test/omega_economy_audit_e2e_v1.test.mjs
