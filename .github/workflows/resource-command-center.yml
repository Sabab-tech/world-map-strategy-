name: Resource Command Center
on:
  pull_request:
    branches: [main]
    paths:
      - 'server.js'
      - 'omega_resource_ai_decision_service.js'
      - 'test/omega_resource_ai_decision_service.test.mjs'
      - 'index.html'
      - 'omega_resource_command_center_ui_v1.js'
      - 'omega_global_trade_system.js'
      - 'omega_global_market_system.js'
      - 'test/omega_global_market_system.test.mjs'
      - 'package.json'
      - 'test/omega_resource_command_center_ui_v1.test.mjs'
      - 'test/omega_resource_command_center_ui_runtime.test.mjs'
      - 'test/omega_global_trade_system.test.mjs'
      - '.github/workflows/resource-command-center.yml'
  push:
    branches:
      - main
      - fix/resource-command-center-ui-routing-v2
    paths:
      - 'server.js'
      - 'omega_resource_ai_decision_service.js'
      - 'test/omega_resource_ai_decision_service.test.mjs'
      - 'index.html'
      - 'omega_resource_command_center_ui_v1.js'
      - 'omega_global_trade_system.js'
      - 'omega_global_market_system.js'
      - 'test/omega_global_market_system.test.mjs'
      - 'package.json'
      - 'test/omega_resource_command_center_ui_v1.test.mjs'
      - 'test/omega_resource_command_center_ui_runtime.test.mjs'
      - 'test/omega_global_trade_system.test.mjs'
      - '.github/workflows/resource-command-center.yml'

permissions:
  contents: read

jobs:
  resource-command-center:
    name: Resource UI and runtime regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Check edited JavaScript syntax
        run: |
          node --check server.js
          node --check omega_resource_ai_decision_service.js
          node --check test/omega_resource_ai_decision_service.test.mjs
          node --check omega_resource_command_center_ui_v1.js
          node --check omega_global_trade_system.js
      - name: Test server resource decision AI contract
        run: npm run test:resource-ai-decision
      - name: Test all sixteen panel routes and metrology
        run: npm run test:ui-visual
      - name: Test bilateral trade request and settlement
        run: npm run test:global-trade
      - name: Test market price discovery
        run: npm run test:global-market
      - name: Test authoritative resource actions
        run: npm run test:resource-actions
      - name: Test authoritative state adapter
        run: npm run test:resource-authoritative
      # Extraction, logistics, industrial-network and resource E2E checks run in
      # the repository's dedicated OMEGA Resource Gameplay Pipeline workflow.
