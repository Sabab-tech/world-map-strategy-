name: OMEGA UI Licensed Photo Assets

on:
  push:
    branches:
      - feat/omega-ui-licensed-photo-assets-v1
    paths:
      - .github/workflows/omega-ui-photo-assets.yml
      - scripts/download_omega_ui_photo_assets.py
      - omega_ui_photo_asset_sources_v1.json
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/omega-ui-photo-assets.yml
      - scripts/download_omega_ui_photo_assets.py
      - omega_ui_photo_asset_sources_v1.json
      - omega_ui_photo_asset_catalog_v1.json
      - assets/ui-photos/**
      - omega_ui_photo_asset_system_v1.js
      - omega_ui_photo_asset_system_v1.css
      - omega_country_overview_ministry_ui_v1.js
      - omega-offline-map-sw.js
      - index.html
      - test/omega_ui_photo_assets.test.mjs
      - docs/UI_PHOTO_ASSET_ATTRIBUTION.md

permissions:
  contents: read

concurrency:
  group: omega-ui-photo-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-licensed-photos:
    if: >-
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/feat/omega-ui-licensed-photo-assets-v1') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'feat/omega-ui-licensed-photo-assets-v1')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebP encoder
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Check whether imported photo files already exist
        id: photos
        shell: bash
        run: |
          if [ ! -f omega_ui_photo_asset_catalog_v1.json ] || [ ! -f assets/ui-photos/bangladesh-parliament.webp ]; then
            echo "needs_import=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_import=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Commons licenses, download and optimize photo assets
        if: steps.photos.outputs.needs_import == 'true'
        run: python scripts/download_omega_ui_photo_assets.py --download
      - name: Test generated photo catalog and local WebP assets
        run: node --test test/omega_ui_photo_assets.test.mjs
      - name: Commit optimized photos and generated catalog
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ui-photos omega_ui_photo_asset_catalog_v1.json
          if git diff --cached --quiet; then
            echo 'Photo assets and generated catalog already match the source registry.'
          else
            git commit -m 'chore(ui): import licensed Wikimedia photo assets'
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

  verify-pull-request:
    needs: import-licensed-photos
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the updated pull-request branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebP encoder
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Re-verify current Commons license metadata and committed photo files
        run: python scripts/download_omega_ui_photo_assets.py --verify-existing
      - name: Run photo, attribution and offline-cache regression tests
        run: node --test test/omega_ui_photo_assets.test.mjs
      - name: Run existing UI visual regression suite
        run: npm run test:ui-visual
