name: OMEGA Private Enterprise Real Browser E2E
concurrency:
  group: omega-pr-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false


on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/omega-private-enterprise-browser-e2e.yml"
      - "index.html"
      - "omega_private_enterprise_registry_v1.js"
      - "omega_private_enterprise_lifecycle_v1.js"
      - "omega_sab34_live_browser_proof_v1.js"
      - "country_private_factory_starting_baseline_v1.json"
      - "omega_ui_v2/**"
      - "omega_resource_industrial_network_v1.js"
      - "omega_resource_economy_runtime_v2.js"
      - "omega_simulation_runtime.js"
      - "test/omega_private_enterprise_browser_e2e.test.mjs"
      - "package.json"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/omega-private-enterprise-browser-e2e.yml"
      - "index.html"
      - "omega_private_enterprise_registry_v1.js"
      - "omega_private_enterprise_lifecycle_v1.js"
      - "omega_sab34_live_browser_proof_v1.js"
      - "country_private_factory_starting_baseline_v1.json"
      - "omega_ui_v2/**"
      - "omega_resource_industrial_network_v1.js"
      - "omega_resource_economy_runtime_v2.js"
      - "omega_simulation_runtime.js"
      - "test/omega_private_enterprise_browser_e2e.test.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  chromium-browser-e2e:
    name: chromium-${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: proposal-ui
            test_name_pattern: "real Chromium browser boots OMEGA"
          - scenario: site-factory-save-load
            test_name_pattern: "real Chromium map marker"
          - scenario: cash-settlement
            test_name_pattern: "real Chromium reconciles"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Playwright browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/omega-browser-deps" --no-save --package-lock=false --ignore-scripts playwright@1.65.0
          "$RUNNER_TEMP/omega-browser-deps/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run isolated Chromium scenario
        env:
          NODE_PATH: ${{ runner.temp }}/omega-browser-deps/node_modules
          OMEGA_BROWSER_TEST_ARTIFACT_DIR: ${{ runner.temp }}/omega-private-enterprise-browser
        run: |
          mkdir -p "$OMEGA_BROWSER_TEST_ARTIFACT_DIR"
          echo "Running Chromium scenario: ${{ matrix.scenario }}"
          timeout --signal=TERM --kill-after=15s 12m node --test --test-name-pattern="${{ matrix.test_name_pattern }}" test/omega_private_enterprise_browser_e2e.test.mjs

      - name: Upload real browser E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-private-enterprise-real-browser-e2e-${{ matrix.scenario }}
          path: ${{ runner.temp }}/omega-private-enterprise-browser/**
          if-no-files-found: warn
          retention-days: 7
