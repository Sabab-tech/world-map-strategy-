name: OMEGA Remove Bengali Canned Fallback

on:
  push:
    paths:
      - '.github/workflows/omega_surgical_remove_bengali_fallback.yml'

permissions:
  contents: write

jobs:
  surgical:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Remove Bengali fallback only
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p=Path('ministry_engine.js')
          s=p.read_text(encoding='utf-8')
          marker='if (!replyText)'
          pos=s.find(marker)
          if pos<0: raise SystemExit('Expected legacy replyText fallback was not found; refusing mutation.')
          if 'মাননীয় এক্সিকিউটিভ কমান্ডার' not in s[pos:pos+5000]: raise SystemExit('Expected Bengali canned response marker was not found near replyText fallback.')
          brace=s.find('{',pos)
          if brace<0: raise SystemExit('Fallback opening brace not found.')
          depth=0; end=None
          for i in range(brace,len(s)):
              if s[i]=='{': depth+=1
              elif s[i]=='}':
                  depth-=1
                  if depth==0: end=i+1; break
          if end is None: raise SystemExit('Fallback braces are unbalanced.')
          s=s[:pos]+s[end:]
          p.write_text(s,encoding='utf-8')
          subprocess.run(['git','diff','--exit-code','--','index.html'],check=True)
          subprocess.run(['node','--check','ministry_engine.js'],check=True)
          if 'মাননীয় এক্সিকিউটিভ কমান্ডার' in s: raise SystemExit('Bengali canned fallback still exists.')
      - name: Commit and self-delete
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/omega_surgical_remove_bengali_fallback.yml
          git add ministry_engine.js .github/workflows/omega_surgical_remove_bengali_fallback.yml
          test -z "$(git diff --cached -- index.html)"
          # The legacy block removal can expose one blank line containing spaces. Normalize only that file.
          sed -i 's/[[:space:]]*$//' ministry_engine.js
          git add ministry_engine.js
          git diff --cached --check
          git commit -m 'Remove remaining Bengali canned interrogation fallback'
          git push origin HEAD:main