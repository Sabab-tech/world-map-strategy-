name: OMEGA Exhaustive Every-Site Production Pipeline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omega-resource-exhaustive-site-pipeline.yml'
      - 'test/omega_resource_exhaustive_site_pipeline.test.mjs'
      - 'test/omega_resource_endowment_runtime.test.mjs'
      - 'omega_resource_endowment_runtime.js'
      - 'omega_resource_industrial_network_v1.js'
      - 'omega_resource_part04_identity_runtime.js'
      - 'omega_resource_part05_reserve_extraction_runtime.js'
      - 'omega_resource_production_model_v2.js'
      - 'omega_resource_site_integrity_v1.js'
      - 'omega_resource_realism_runtime_v1.js'
      - 'omega_resource_economy_runtime_v2.js'
      - 'resource*.json'
      - 'resources*.json'
  pull_request:
    paths:
      - '.github/workflows/omega-resource-exhaustive-site-pipeline.yml'
      - 'test/omega_resource_exhaustive_site_pipeline.test.mjs'
      - 'test/omega_resource_endowment_runtime.test.mjs'
      - 'omega_resource_endowment_runtime.js'
      - 'omega_resource_industrial_network_v1.js'
      - 'omega_resource_part04_identity_runtime.js'
      - 'omega_resource_part05_reserve_extraction_runtime.js'
      - 'omega_resource_production_model_v2.js'
      - 'omega_resource_site_integrity_v1.js'
      - 'omega_resource_realism_runtime_v1.js'
      - 'omega_resource_economy_runtime_v2.js'
      - 'resource*.json'
      - 'resources*.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exhaustive-site-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute every eligible mine through extraction, sovereign storage, transport, factory and finished goods (shard ${{ matrix.shard }})
        env:
          OMEGA_EXHAUSTIVE_SITE_SHARD_INDEX: ${{ matrix.shard }}
          OMEGA_EXHAUSTIVE_SITE_SHARD_COUNT: 6
        run: node test/omega_resource_exhaustive_site_pipeline.test.mjs
