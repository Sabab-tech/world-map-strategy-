name: OMEGA Resource Economy Reconciliation Regression
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'omega_resource_economy_runtime_v2.js'
      - 'test/omega_resource_economy_runtime_v2.test.mjs'
      - '.github/workflows/omega-resource-economy-reconciliation.yml'
permissions:
  contents: read
jobs:
  normalized-inventory-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run resource economy runtime regression suite
        run: node --test test/omega_resource_economy_runtime_v2.test.mjs
