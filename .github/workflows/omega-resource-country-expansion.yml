name: OMEGA Country Resource Expansion Certificate

on:
  pull_request:
    branches: [main]
    paths:
      - 'resource_site_country_expansion_v1.json'
      - 'omega_resource_endowment_runtime.js'
      - 'omega_resource_gameplay_binding_v1.js'
      - 'test/omega_resource_site_country_expansion.test.mjs'
      - '.github/workflows/omega-resource-country-expansion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  country-resource-expansion:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Runtime syntax gates
        run: |
          node --check omega_resource_endowment_runtime.js
          node --check omega_resource_gameplay_binding_v1.js
          node --check omega_resource_industrial_network_v1.js
          node --check test/omega_resource_site_country_expansion.test.mjs
          node --check test/omega_resource_gameplay_binding.test.mjs
      - name: Country site expansion certificate
        run: |
          node --test test/omega_resource_site_country_expansion.test.mjs
          node test/omega_resource_gameplay_binding.test.mjs
