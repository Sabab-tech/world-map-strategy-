name: OMEGA Country Factory Establishment Data

on:
  pull_request:
    branches: [main]
    paths:
      - 'factory_isic_mapping_v1.json'
      - 'country_factory_establishment_data_v1.json'
      - 'scripts/build_country_factory_establishment_data_v1.mjs'
      - 'scripts/export_unido_indstat_establishments.py'
      - 'omega_country_factory_starting_baseline_v1.js'
      - 'omega_ui_v2/screens/industry.js'
      - 'omega-offline-map-sw.js'
      - 'test/omega_country_factory_starting_baseline_v1.test.mjs'
      - 'test/omega_country_factory_establishment_data_v1.test.mjs'
      - '.github/workflows/country-factory-establishment-data-v1.yml'
  push:
    branches: [main]
    paths:
      - 'factory_isic_mapping_v1.json'
      - 'scripts/build_country_factory_establishment_data_v1.mjs'
      - 'scripts/export_unido_indstat_establishments.py'
      - 'omega_country_factory_starting_baseline_v1.js'
      - 'omega_ui_v2/screens/industry.js'
      - 'omega-offline-map-sw.js'
      - 'test/omega_country_factory_starting_baseline_v1.test.mjs'
      - 'test/omega_country_factory_establishment_data_v1.test.mjs'
      - '.github/workflows/country-factory-establishment-data-v1.yml'
  schedule:
    - cron: '25 4 1 */3 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate all 4,137 country/type inputs
        run: node --test test/omega_country_factory_starting_baseline_v1.test.mjs test/omega_country_factory_establishment_data_v1.test.mjs
      - name: Check importer, exporter, runtime and UI syntax
        run: |
          node --check scripts/build_country_factory_establishment_data_v1.mjs
          node --check omega_country_factory_starting_baseline_v1.js
          node --check omega_ui_v2/screens/industry.js
          python -m py_compile scripts/export_unido_indstat_establishments.py
  mirror-preflight:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install public data mirror client
        run: python -m pip install subsetsio==0.1.0rc1
      - name: Sync the UNIDO INDSTAT R4 public mirror
        run: python -m subsetsio sync --bundle large
      - name: Export source-backed establishment observations
        run: python scripts/export_unido_indstat_establishments.py --output /tmp/unido-indstat-r4-establishments.json
      - name: Import observations into all country/type slots
        run: node scripts/build_country_factory_establishment_data_v1.mjs --subsets-json /tmp/unido-indstat-r4-establishments.json
      - name: Re-validate populated source data
        run: node --test test/omega_country_factory_establishment_data_v1.test.mjs test/omega_country_factory_starting_baseline_v1.test.mjs
  refresh:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install public data mirror client
        run: python -m pip install subsetsio==0.1.0rc1
      - name: Sync the UNIDO INDSTAT R4 public mirror
        run: python -m subsetsio sync --bundle large
      - name: Export source-backed establishment observations
        run: python scripts/export_unido_indstat_establishments.py --output /tmp/unido-indstat-r4-establishments.json
      - name: Import source rows into all country/type slots
        run: node scripts/build_country_factory_establishment_data_v1.mjs --subsets-json /tmp/unido-indstat-r4-establishments.json
      - name: Commit only source-backed observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add country_factory_establishment_data_v1.json
          if git diff --cached --quiet; then
            echo "No new source-backed observations."
          else
            git commit -m "Refresh official country factory establishment data"
            git push origin main
          fi
