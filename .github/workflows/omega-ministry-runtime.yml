name: OMEGA Ministry Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  independent-ministry-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit

      - name: Syntax gate for ministry runtime
        run: |
          set -euo pipefail
          node --check server_bootstrap.js
          node --check omega_ministry_registry.js
          node --check omega_ministry_state_provider.js
          node --check omega_ministry_information_policy.js
          node --check omega_ministry_decision_framework.js
          node --check omega_ministry_state_transaction.js
          node --check omega_ministry_domain_engines.js
          node --check omega_ministry_interoperability_system.js
          node --check omega_ministry_runtime_v1.js
          node --check omega_simulation_runtime.js
          node --check opponent_country_rules.js
          node --check test/opponent_country_rules_runtime.test.js
          node --check omega_ai_context_bridge.js
          node --check test/omega_17_ministry_runtime.test.js
          node --check test/omega_ministry_interoperability.test.js

      - name: Independent 17-ministry runtime proof
        run: |
          set -euo pipefail
          npm run test:ministries
          npm run test:simulation


      - name: Production server boot and canonical script injection smoke
        run: |
          set -euo pipefail
          PORT=31337 node server_bootstrap.js >/tmp/omega-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          READY=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:31337/api/ai/status >/tmp/omega-ai-status.json 2>/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/omega-server.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:31337/ >/tmp/omega-index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const html = await fs.readFile('/tmp/omega-index.html','utf8');
          for (const required of [
            'omega_ministry_registry.js',
            'omega_ministry_state_provider.js',
            'omega_ministry_information_policy.js',
            'omega_ministry_decision_framework.js',
            'omega_ministry_state_transaction.js',
            'omega_ministry_domain_engines.js',
            'omega_ministry_interoperability_system.js',
            'omega_ministry_runtime_v1.js',
            'omega_simulation_runtime.js',
            'opponent_country_rules.js',
            'omega_ai_context_bridge.js'
          ]) {
            if (!html.includes(required)) throw new Error('Canonical script missing from production HTML: '+required);
          }
          const status = JSON.parse(await fs.readFile('/tmp/omega-ai-status.json','utf8'));
          if (status.ok !== true) throw new Error('Production /api/ai/status is not healthy');
          console.log('CI PRODUCTION BOOT SMOKE: PASS');
          NODE

      - name: Required proof assertions
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const runtime = await fs.readFile('omega_ministry_runtime_v1.js','utf8');
          const engines = await fs.readFile('omega_ministry_domain_engines.js','utf8');
          const interoperability = await fs.readFile('omega_ministry_interoperability_system.js','utf8');
          const simulation = await fs.readFile('omega_simulation_runtime.js','utf8');
          const opponentRules = await fs.readFile('opponent_country_rules.js','utf8');
          const opponentTest = await fs.readFile('test/opponent_country_rules_runtime.test.js','utf8');
          const test = await fs.readFile('test/omega_17_ministry_runtime.test.js','utf8');
          const meshTest = await fs.readFile('test/omega_ministry_interoperability.test.js','utf8');

          if (!runtime.includes("const VERSION='1.2.0'")) throw new Error('Runtime version contract is not 1.2.0');
          if (!simulation.includes("const VERSION='1.0.0'")) throw new Error('Simulation authority version contract is not 1.0.0');
          if (!simulation.includes('class SimulationCoordinator')) throw new Error('Canonical simulation coordinator missing');
          if (!simulation.includes('class SimulationClock')) throw new Error('Canonical simulation clock missing');
          if (!simulation.includes('AuthoritativeWorldState')) throw new Error('Authoritative world-state root missing');
          if (!simulation.includes("const PHASES=Object.freeze([")) throw new Error('Ordered simulation phases missing');
          if (!opponentRules.includes("OMEGA OPPONENT COUNTRY RULES RUNTIME")) throw new Error('Opponent country rules runtime missing');
          if (!opponentRules.includes('OMEGA_SIMULATION_TURN_COMMITTED')) throw new Error('Opponent rules turn binding missing');
          if (!opponentRules.includes('OMEGA_OPPONENT_RULE_INTENT_APPLIED')) throw new Error('Opponent intent transaction event missing');
          if (!opponentRules.includes('runtime.enqueueCommand')) throw new Error('Opponent rules command integration missing');
          if (!opponentTest.includes('OMEGA OPPONENT COUNTRY RULES TEST PASSED')) throw new Error('Opponent runtime behavioral test missing');
          if (!interoperability.includes("const VERSION='2.0.0'")) throw new Error('Interoperability version contract is not 2.0.0');
          if (!interoperability.includes('deliveryLedger')) throw new Error('Canonical delivery ledger missing');
          if (!interoperability.includes('publishedFacts')) throw new Error('Public-state projection contract missing');
          if (!interoperability.includes('stateRevision')) throw new Error('State revision contract missing');
          if (!interoperability.includes('UNOBSERVED')) throw new Error('Missing-data semantics missing');
          if (!interoperability.includes('dispatchCommand')) throw new Error('Command system missing');
          if (!interoperability.includes('emitEvent')) throw new Error('Semantic event system missing');
          if (!interoperability.includes('saveState')) throw new Error('Save/load state contract missing');
          if (!interoperability.includes('this.ids.length*this.ids.length')) throw new Error('Dynamic NxN mesh topology generation missing');
          if (!meshTest.includes("every route transports")) throw new Error('Expanded route transport test missing');
          if (!meshTest.includes("relationship is not substituted for treaty status")) throw new Error('Treaty semantic separation test missing');
          if (!meshTest.includes("command -> authoritative owner")) throw new Error('Command propagation test missing');
          if (!runtime.includes("version:VERSION")) throw new Error('Runtime API does not expose the canonical version token');
          if (!runtime.includes('saveState')) throw new Error('Runtime save/load API missing');
          if (!test.includes('const IDS')) throw new Error('Canonical runtime test missing');
          if (!engines.includes("const VERSION='1.0.0'")) throw new Error('Engine version contract is not 1.0.0');
          if (runtime.includes('nativeAdapter')) throw new Error('Legacy native-adapter execution path remains');
          if ((engines.match(/class .*Engine extends IndependentMinistryEngine/g) || []).length !== 17) {
            throw new Error('Expected 17 independent concrete ministry engines');
          }
          if (!test.includes('unique engine instance')) throw new Error('Unique-engine regression assertion missing');
          if (!test.includes('legacy config reference')) throw new Error('Binding-aware legacy reference assertion missing');
          console.log('CI OMEGA MINISTRY PROOF: PASS');
          NODE
