name: OMEGA Ministry Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  independent-ministry-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit

      - name: Syntax gate for ministry runtime
        run: |
          set -euo pipefail
          node --check server_bootstrap.js
          node --check omega_ministry_registry.js
          node --check omega_ministry_state_provider.js
          node --check omega_ministry_information_policy.js
          node --check omega_ministry_decision_framework.js
          node --check omega_ministry_state_transaction.js
          node --check omega_ministry_domain_engines.js
          node --check omega_ministry_interoperability_system.js
          node --check omega_ministry_runtime_v1.js
          node --check omega_simulation_runtime.js
          node --check opponent_country_rules.js
          node --check test/opponent_country_rules_runtime.test.js
          node --check omega_ai_context_bridge.js
          node --check test/omega_17_ministry_runtime.test.js
          node --check test/omega_ministry_interoperability.test.js

      - name: Independent 17-ministry runtime proof
        run: |
          set -euo pipefail
          npm run test:ministries
          npm run test:simulation

      - name: Production server boot and canonical script injection smoke
        run: |
          set -euo pipefail
          PORT=31337 node server_bootstrap.js >/tmp/omega-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          READY=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:31337/api/ai/status >/tmp/omega-ai-status.json 2>/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/omega-server.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:31337/ >/tmp/omega-index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const html = await fs.readFile('/tmp/omega-index.html','utf8');
          for (const required of [
            'omega_ministry_registry.js',
            'omega_ministry_state_provider.js',
            'omega_ministry_information_policy.js',
            'omega_ministry_decision_framework.js',
            'omega_ministry_state_transaction.js',
            'omega_ministry_domain_engines.js',
            'omega_ministry_interoperability_system.js',
            'omega_ministry_runtime_v1.js',
            'omega_simulation_runtime.js',
            'opponent_country_rules.js',
            'omega_ai_context_bridge.js'
          ]) {
            if (!html.includes(required)) throw new Error('Canonical script missing from production HTML: '+required);
          }
          const status = JSON.parse(await fs.readFile('/tmp/omega-ai-status.json','utf8'));
          if (status.ok !== true) throw new Error('Production /api/ai/status is not healthy');
          console.log('CI PRODUCTION BOOT SMOKE: PASS');
          NODE

      - name: Autonomous world architecture proof
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const runtime = await fs.readFile('opponent_country_rules.js','utf8');
          const test = await fs.readFile('test/opponent_country_rules_runtime.test.js','utf8');
          const simulation = await fs.readFile('omega_simulation_runtime.js','utf8');

          if (!runtime.includes("const V='4.2.0'")) throw new Error('Autonomous core version contract missing');
          if (!runtime.includes('const LAYERS=[')) throw new Error('Executable layer registry missing');
          if (!runtime.includes('const SCENARIO_ROWS=[')) throw new Error('Universal scenario registry missing');
          if (!runtime.includes('const ACTIONS={')) throw new Error('Action registry missing');
          if (!runtime.includes('class ProjectEngine')) throw new Error('Project lifecycle engine missing');
          if (!runtime.includes('class TransactionEngine')) throw new Error('Transaction lifecycle engine missing');
          if (!runtime.includes('class Consequence')) throw new Error('Consequence propagation engine missing');
          if (!runtime.includes('class Forecast')) throw new Error('Forecast engine missing');
          if (!runtime.includes('class Scheduler')) throw new Error('Multi-rate scheduler missing');
          if (!runtime.includes('class Reconcile')) throw new Error('State reconciliation missing');
          if (!runtime.includes('class Gateway')) throw new Error('Data intake gateway missing');
          if (!runtime.includes('class Identity')) throw new Error('Canonical identity layer missing');
          if (!runtime.includes('class CapRegistry')) throw new Error('Capability registry missing');
          if (!runtime.includes('L26_EVIDENCE_TRACE')) throw new Error('Evidence trace layer missing');
          if (!runtime.includes('setReasoningAdapter')) throw new Error('AI reasoning boundary missing');
          if (!runtime.includes('executionApplied:false')) throw new Error('Direct state-mutation guard missing');
          if (/trigger:\{[^}]*value\s*:/.test(runtime)) throw new Error('Numeric trigger threshold detected');
          for (const forbidden of ['Bangladesh','India','Pakistan','China','United States','USA']) {
            if (runtime.includes(forbidden)) throw new Error('Country-specific behavior hardcode detected: '+forbidden);
          }

          const layerCount = (runtime.match(/id:'L\d\d_/g)||[]).length;
          if (layerCount !== 28) throw new Error('Expected exactly 28 executable layer declarations, found '+layerCount);
          if ((runtime.match(/\['REL'/g)||[]).length < 20) throw new Error('Universal relational scenario coverage is incomplete');

          if (!simulation.includes('class SimulationCoordinator')) throw new Error('Canonical simulation coordinator missing');
          if (!simulation.includes('AuthoritativeWorldState')) throw new Error('Authoritative world-state root missing');
          if (!simulation.includes("const PHASES=Object.freeze([")) throw new Error('Ordered simulation phases missing');

          if (!test.includes("OMEGA AUTONOMOUS WORLD CORE TEST PASSED")) throw new Error('Autonomous core behavior test missing');
          if (!test.includes("assert.equal(diagnostics.layers,28)")) throw new Error('28-layer assertion missing');
          if (!test.includes("assert.equal(diagnostics.scenarioCount,25)")) throw new Error('25-scenario assertion missing');
          if (!test.includes("assert.equal(diagnostics.directionalSignals,63)")) throw new Error('63-signal assertion missing');
          if (!test.includes("assert.equal(diagnostics.actionTypes,27)")) throw new Error('27-action assertion missing');
          if (!test.includes("L26_EVIDENCE_TRACE")) throw new Error('Evidence trace runtime assertion missing');
          if (!test.includes("projectId")) throw new Error('Project lifecycle behavioral assertion missing');
          if (!test.includes("transactionId")) throw new Error('Transaction lifecycle behavioral assertion missing');
          if (!test.includes("mutationAuthority,false")) throw new Error('AI mutation boundary assertion missing');

          console.log('CI AUTONOMOUS WORLD ARCHITECTURE PROOF: PASS');
          NODE
