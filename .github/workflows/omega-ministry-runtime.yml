name: OMEGA Ministry Runtime

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  independent-ministry-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit

      - name: Syntax gate for ministry runtime
        run: |
          set -euo pipefail
          node --check server_bootstrap.js
          node --check omega_universal_entity_identity_engine.js
          node --check omega_ministry_registry.js
          node --check omega_ministry_state_provider.js
          node --check omega_ministry_information_policy.js
          node --check omega_ministry_decision_framework.js
          node --check omega_ministry_state_transaction.js
          node --check omega_ministry_domain_engines.js
          node --check omega_ministry_interoperability_system.js
          node --check omega_ministry_runtime_v1.js
          node --check omega_simulation_runtime.js
          node --check omega_opponent_deep_memory_system.js
          node --check omega_opponent_intelligence_evolution_system.js
          node --check omega_opponent_adaptive_strategy_system.js
          node --check omega_opponent_autonomy_system.js
          node --check omega_global_trade_system.js
          node --check omega_opponent_treaty_lifecycle_system.js
          node --check omega_opponent_second_order_consequence_system.js
          node --check omega_opponent_memory_trace_log_system.js
          node --check omega_resource_endowment_runtime.js
      node --check omega_resource_action_execution_runtime.js
          node --check omega_resource_economy_runtime_v2.js
          node --check omega_resource_authoritative_adapter.js
          node --check omega_global_market_system.js
          node --check test/omega_resource_economy_runtime_v2.test.mjs
          node --check opponent_country_rules.js
          node --check test/opponent_country_rules_runtime.test.js
          node --check omega_ai_context_bridge.js
          node --check test/omega_17_ministry_runtime.test.js
          node --check test/omega_ministry_interoperability.test.js

      - name: Independent 17-ministry runtime proof
        run: |
          set -euo pipefail
          npm run test:architecture
          npm run test:country-roster
          npm run test:real-country-batch
          npm run test:ministries
          npm run test:simulation

      - name: Production server boot and canonical script injection smoke
        run: |
          set -euo pipefail
          PORT=31337 node server_bootstrap.js >/tmp/omega-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID >/dev/null 2>&1 || true' EXIT
          READY=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:31337/api/ai/status >/tmp/omega-ai-status.json 2>/dev/null; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/omega-server.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:31337/ >/tmp/omega-index.html
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const html = await fs.readFile('/tmp/omega-index.html','utf8');
          for (const required of [
            'omega_ministry_registry.js',
            'omega_ministry_state_provider.js',
            'omega_ministry_information_policy.js',
            'omega_ministry_decision_framework.js',
            'omega_ministry_state_transaction.js',
            'omega_ministry_domain_engines.js',
            'omega_ministry_interoperability_system.js',
            'omega_ministry_runtime_v1.js',
            'omega_simulation_runtime.js',
            'opponent_country_rules.js',
            'omega_universal_entity_identity_engine.js',
            'omega_ai_context_bridge.js',
            'omega_opponent_deep_memory_system.js',
            'omega_opponent_intelligence_evolution_system.js',
            'omega_opponent_adaptive_strategy_system.js',
            'omega_opponent_autonomy_system.js',
            'omega_global_trade_system.js',
            'omega_resource_economy_runtime_v2.js',
            'omega_opponent_treaty_lifecycle_system.js',
            'omega_opponent_second_order_consequence_system.js'
          ]) {
            if (!html.includes(required)) throw new Error('Canonical script missing from production HTML: '+required);
          }
          const status = JSON.parse(await fs.readFile('/tmp/omega-ai-status.json','utf8'));
          if (status.ok !== true) throw new Error('Production /api/ai/status is not healthy');
          console.log('CI PRODUCTION BOOT SMOKE: PASS');
          NODE

      - name: Autonomous world architecture proof
        run: |
          set -euo pipefail
          node --check opponent_country_rules.js
          node --check world_ecosystem_engine.js
          node test/opponent_country_rules_runtime.test.js
          node test/omega_opponent_deep_memory_system.test.mjs
          node test/omega_opponent_intelligence_evolution_system.test.mjs
          node test/omega_global_trade_system.test.mjs
          node test/omega_opponent_treaty_lifecycle_system.test.mjs
          node test/omega_opponent_e2e_runtime.test.mjs
          node test/omega_opponent_memory_trace_log_system.test.mjs
          node test/omega_global_market_system.test.mjs
          node test/omega_resource_endowment_runtime.test.mjs
          node --test test/omega_resource_economy_runtime_v2.test.mjs
          node --test test/omega_resource_authoritative_adapter.test.mjs
      node --test test/omega_resource_action_execution_runtime.test.mjs
          node test/omega_resource_request_and_settlement.test.mjs
          node test/omega_opponent_multi_country_integration.test.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const runtime = await fs.readFile('opponent_country_rules.js','utf8');
          const ecosystem = await fs.readFile('world_ecosystem_engine.js','utf8');

          for (const required of [
            'class RuntimeFlowEngine',
            'class RuntimeOperationEngine',