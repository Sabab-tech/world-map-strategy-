name: OMEGA Economy Phase Checkpoint Focused Regression
on:
  push:
    branches:
      - feature/omega-economy-phase-checkpoints
    paths:
      - 'omega_simulation_runtime.js'
      - 'test/omega_simulation_runtime.test.js'
      - '.github/workflows/omega-economy-phase-checkpoint-focused.yml'
permissions:
  contents: read
jobs:
  checkpoint-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check changed JavaScript
        run: |
          node --check omega_simulation_runtime.js
          node --check test/omega_simulation_runtime.test.js
      - name: Run focused Simulation and checkpoint regressions
        run: node --test test/omega_simulation_runtime.test.js
