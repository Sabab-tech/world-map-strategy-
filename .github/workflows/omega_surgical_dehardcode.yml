name: OMEGA Surgical De-hardcode

on:
  push:
    paths:
      - '.github/workflows/omega_surgical_dehardcode.yml'

permissions:
  contents: write

jobs:
  surgical:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Surgical production de-hardcode
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          ministry = Path('ministry_engine.js')
          cognitive = Path('omega_cognitive_engine.js')
          m = ministry.read_text(encoding='utf-8')
          c = cognitive.read_text(encoding='utf-8')

          m2, n_names = re.subn(r"ministerName\s*:\s*(['\"])[^'\"]*\1", "ministerName: null", m)
          if n_names == 0:
              raise SystemExit('No production ministerName literals found; refusing an unverified identity mutation.')

          # Remove the ministry-level canned branch if it still exists.
          ministry_marker = 'processed your inquiry regarding'
          if ministry_marker in m2:
              pos = m2.index(ministry_marker)
              start = m2.rfind('else', 0, pos)
              end = m2.find('impactAnalysis =', pos)
              if start < 0 or end < 0:
                  raise SystemExit('Ministry canned branch found but its boundaries could not be proven.')
              m2 = m2[:start] + "else { throw new Error('LEGACY_CANNED_RESPONSE_DISABLED'); }\n        " + m2[end:]

          # Remove the cognitive generalized canned branch using its semantic marker,
          # without assuming a particular indentation or brace layout.
          markers = ['Dynamic Generalized Briefing for ANY question', 'processed your directive regarding']
          pos = next((c.find(x) for x in markers if x in c), -1)
          if pos >= 0:
              start = c.rfind('else', 0, pos)
              end = c.find('impactAnalysis =', pos)
              if start < 0 or end < 0:
                  raise SystemExit('Cognitive canned branch found but its boundaries could not be proven.')
              c = c[:start] + "else { throw new Error('LEGACY_CANNED_RESPONSE_DISABLED'); }\n        " + c[end:]

          ministry.write_text(m2, encoding='utf-8')
          cognitive.write_text(c, encoding='utf-8')
          subprocess.run(['git', 'diff', '--exit-code', '--', 'index.html'], check=True)
          subprocess.run(['node', '--check', 'ministry_engine.js'], check=True)
          subprocess.run(['node', '--check', 'omega_cognitive_engine.js'], check=True)

          if ministry_marker in m2 or any(x in c for x in markers):
              raise SystemExit('Legacy canned response marker still present after mutation.')

      - name: Commit surgical result and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/omega_surgical_dehardcode.yml
          git add ministry_engine.js omega_cognitive_engine.js .github/workflows/omega_surgical_dehardcode.yml
          git diff --cached --check
          test -z "$(git diff --cached -- index.html)"
          git commit -m 'Remove physical minister identity and canned response hardcodes'
          git push origin HEAD:main
