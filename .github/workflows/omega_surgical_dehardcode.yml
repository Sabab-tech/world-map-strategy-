name: OMEGA Surgical De-hardcode

on:
  push:
    paths:
      - '.github/workflows/omega_surgical_dehardcode.yml'

permissions:
  contents: write

jobs:
  surgical:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Surgical production de-hardcode
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess

          def remove_else_branch(src, marker):
              pos = src.find(marker)
              if pos < 0:
                  return src, False
              start = src.rfind('else', 0, pos)
              if start < 0:
                  raise SystemExit(f'Found marker but no preceding else: {marker}')
              brace = src.find('{', start, pos + len(marker) + 400)
              if brace < 0:
                  raise SystemExit(f'Found else but no opening brace: {marker}')
              depth = 0
              end = None
              for i in range(brace, len(src)):
                  ch = src[i]
                  if ch == '{': depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit(f'Unbalanced legacy branch: {marker}')
              return src[:start] + "else { throw new Error('LEGACY_CANNED_RESPONSE_DISABLED'); }" + src[end:], True

          ministry = Path('ministry_engine.js')
          cognitive = Path('omega_cognitive_engine.js')
          m = ministry.read_text(encoding='utf-8')
          c = cognitive.read_text(encoding='utf-8')

          m, n_names = re.subn(r"ministerName\s*:\s*(['\"])[^'\"]*\1", "ministerName: null", m)
          if n_names == 0:
              raise SystemExit('No production ministerName literals found; refusing an unverified identity mutation.')

          m, _ = remove_else_branch(m, 'processed your inquiry regarding')
          if 'processed your inquiry regarding' in m:
              raise SystemExit('Ministry canned response survived surgical removal.')

          changed = False
          for marker in ('Dynamic Generalized Briefing for ANY question', 'processed your directive regarding'):
              c, did = remove_else_branch(c, marker)
              changed = changed or did
              if did: break
          if not changed and ('Dynamic Generalized Briefing for ANY question' in c or 'processed your directive regarding' in c):
              raise SystemExit('Cognitive canned response marker survived but was not removable.')

          ministry.write_text(m, encoding='utf-8')
          cognitive.write_text(c, encoding='utf-8')
          subprocess.run(['git', 'diff', '--exit-code', '--', 'index.html'], check=True)
          subprocess.run(['node', '--check', 'ministry_engine.js'], check=True)
          subprocess.run(['node', '--check', 'omega_cognitive_engine.js'], check=True)

      - name: Commit surgical result and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/omega_surgical_dehardcode.yml
          git add ministry_engine.js omega_cognitive_engine.js .github/workflows/omega_surgical_dehardcode.yml
          git diff --cached --check
          test -z "$(git diff --cached -- index.html)"
          git commit -m 'Remove physical minister identity and canned response hardcodes'
          git push origin HEAD:main
