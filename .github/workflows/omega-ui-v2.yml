name: OMEGA UI v2 Atlas Command
on:
  pull_request:
    paths:
      - 'index.html'
      - 'omega_ui_v2.js'
      - 'omega_ui_v2.css'
      - 'omega-offline-map-sw.js'
      - 'test/omega_ui_v2_shell.test.mjs'
      - '.github/workflows/omega-ui-v2.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'omega_ui_v2.js'
      - 'omega_ui_v2.css'
      - 'omega-offline-map-sw.js'
      - 'test/omega_ui_v2_shell.test.mjs'
      - '.github/workflows/omega-ui-v2.yml'
permissions:
  contents: read
jobs:
  atlas-command-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax-check the new local-only UI shell
        run: |
          node --check omega_ui_v2.js
          node --check omega-offline-map-sw.js
      - name: Test Atlas Command interaction and data contracts
        run: node --test test/omega_ui_v2_shell.test.mjs
      - name: Run existing visual, button, photo and performance regression suite
        run: npm run test:ui-visual
