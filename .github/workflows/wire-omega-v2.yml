name: Wire OMEGA Runtime
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore full application shell and wire production minister runtime
        run: |
          set -e
          git fetch --no-tags --depth=1 origin 8addd28c20b80b2dee6c564b68b0108edda1180c
          if [ "$(wc -l < index.html)" -lt 300 ]; then
            git show 8addd28c20b80b2dee6c564b68b0108edda1180c:index.html > index.html
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="omega_ui_interaction_fix_v2.css">'
          assets=[
            '<script src="omega_minister_runtime_v2.js" defer></script>',
            '<script src="omega_production_semantic_runtime_v3.js" defer></script>',
            '<script src="omega_live_minister_selector.js" defer></script>',
            '<script src="omega_minister_semantic_question_bridge.js" defer></script>'
          ]
          for legacy in ('omega_semantic_runtime_v32.js','omega_country_semantic_bridge.js','omega_resource_semantic_bridge.js'):
              s=s.replace('<script src="'+legacy+'" defer></script>','')
              s=s.replace(legacy,'')
          if css not in s:
              s=s.replace('</head>', '    '+css+'\n</head>', 1)
          for asset in assets:
              if asset not in s:
                  s=s.replace('</body>', '    '+asset+'\n</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate production assets
        run: |
          node --check omega_production_semantic_runtime_v3.js
          node --check omega_minister_runtime_v2.js
          node --check omega_live_minister_selector.js
          node --check omega_minister_semantic_question_bridge.js
          grep -q 'omega_minister_runtime_v2.js' index.html
          grep -q 'omega_production_semantic_runtime_v3.js' index.html
          grep -q 'omega_live_minister_selector.js' index.html
          grep -q 'omega_minister_semantic_question_bridge.js' index.html
          test "$(grep -o 'omega_minister_runtime_v2.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'omega_production_semantic_runtime_v3.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'omega_live_minister_selector.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'omega_minister_semantic_question_bridge.js' index.html | wc -l)" -eq 1
      - name: Persist live wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore full index and wire production minister runtime'
          git push
      - name: Run semantic regression tests
        run: |
          node scripts/test_semantic_runtime_v4.cjs
          node scripts/test_semantic_runtime_v32.mjs