name: OMEGA Resource Verification Certificate

concurrency:
  group: omega-resource-verification-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resource-verification-certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and compact global mineral, oil/gas and coal site data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache
          python -m pip install --disable-pip-version-check openpyxl==3.1.5
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            https://raw.githubusercontent.com/Alexander-ai/global-deposit-globe/main/public/deposits.json \
            -o .cache/global-deposits-source.json
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \\
            https://web.archive.org/web/20260305063452id_/https://globalenergymonitor.org/wp-content/uploads/2026/03/Global-Oil-and-Gas-Extraction-Tracker-March-2026.xlsx \\
            -o .cache/Global-Oil-and-Gas-Extraction-Tracker-March-2026.xlsx
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            https://raw.githubusercontent.com/1ways/coal-mine-tracker/main/non_closed_mines.csv \
            -o .cache/non_closed_mines.csv
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            https://raw.githubusercontent.com/1ways/coal-mine-tracker/main/closed_mines.csv \
            -o .cache/closed_mines.csv
          node scripts/omega_import_global_mineral_deposits.mjs .cache/global-deposits-source.json resource_site_global_deposit_catalog_v1.json
          python scripts/omega_import_global_energy_sites.py .cache/Global-Oil-and-Gas-Extraction-Tracker-March-2026.xlsx .cache/non_closed_mines.csv .cache/closed_mines.csv resource_site_global_energy_catalog_v1.json
      - name: Capture raw resource datasets for local audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-resource-datasets-${{ github.sha }}
          path: |
            resources.json
            resources_2.json
            resource_site_global_deposit_catalog_v1.json
            resource_site_global_energy_catalog_v1.json
          retention-days: 1
      - name: Single-stage resource verification and certificate
        shell: bash
        run: |
          set -u
          declare -A GATES=()

          run_gate() {
            local key="$1"
            local seconds="$2"
            shift 2
            echo "=== GATE $key (${seconds}s timebox) ==="
            set +e
            timeout --foreground --kill-after=3s "${seconds}s" "$@"
            local rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              GATES["$key"]="PASS"
            elif [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              GATES["$key"]="TIMEOUT"
              echo "::warning::$key exceeded ${seconds}s and was timeboxed; continuing."
            else
              GATES["$key"]="FAIL"
              echo "::error::$key failed with exit code $rc; continuing to the next gate."
            fi
          }

          syntax_files=(
            omega_resource_endowment_runtime.js
            omega_resource_part04_identity_runtime.js
            omega_resource_part05_reserve_extraction_runtime.js
            omega_resource_production_model_v2.js
            omega_resource_realism_runtime_v1.js
            omega_resource_logistics_runtime_v1.js
            omega_resource_system_hardening_v1.js
            omega_resource_research_runtime_v1.js
            omega_resource_scenario_engineering_data_v1.js
            omega_resource_country_boundary_guard.js
            omega_resource_action_execution_runtime.js
            omega_resource_economy_runtime_v2.js
            omega_resource_authoritative_adapter.js
            omega_resource_industrial_network_v1.js
            scripts/omega_revalidate_199_resource_sites.mjs
            scripts/omega_import_global_mineral_deposits.mjs
          )
          for file in "${syntax_files[@]}"; do
            run_gate "syntax:${file}" 3 node --check "$file"
          done
          syntax_status="PASS"
          for key in "${!GATES[@]}"; do
            case "$key" in
              syntax:*) [ "${GATES[$key]}" = "PASS" ] || syntax_status="${GATES[$key]}" ;;
            esac
          done
          GATES[syntax]="$syntax_status"

          run_gate resourceEndowment 120 node test/omega_resource_endowment_runtime.test.mjs
          run_gate siteDataCompleteness 15 node test/omega_resource_site_data_completeness.test.mjs
          run_gate resourceReferenceLossless 15 node test/omega_resource_reference_lossless.test.mjs
          run_gate resourceEconomy 15 node --test test/omega_resource_economy_runtime_v2.test.mjs
          run_gate authoritativeAdapter 15 node --test test/omega_resource_authoritative_adapter.test.mjs
          run_gate resourceActions 15 node --test test/omega_resource_action_execution_runtime.test.mjs
          run_gate countryBoundary 15 node --test test/omega_resource_country_boundary.test.mjs
          run_gate globalPipeline 15 node --test test/omega_resource_global_pipeline.test.mjs
          run_gate productionModelV2 15 node test/omega_resource_production_model_v2.test.mjs
          run_gate realismV1 15 node test/omega_resource_realism_runtime_v1.test.mjs
          run_gate logisticsV1 15 node test/omega_resource_logistics_runtime_v1.test.mjs
          run_gate settlementCompatibility 15 node test/omega_resource_request_and_settlement.test.mjs
          run_gate resourceResearch 15 node test/omega_resource_research_runtime.test.mjs
          run_gate resourceResearchEvidence 15 node test/omega_resource_research_evidence.test.mjs
          run_gate resourceResearchPolicy 15 node --test test/omega_resource_research_policy.test.mjs
          run_gate resourceSystemHardening 30 node test/omega_resource_system_hardening.test.mjs
          run_gate resourceIndustrialNetwork 30 node test/omega_resource_industrial_network_v1.test.mjs
          run_gate resourceGameplayBinding 15 node test/omega_resource_gameplay_binding.test.mjs
          run_gate globalResourceCatalog 20 node --test test/omega_global_resource_catalog.test.mjs
          run_gate resourceCoordinateValidation 15 node --test test/omega_resource_site_coordinate_validation.test.mjs

          export OMEGA_GATE_SYNTAX="${GATES[syntax]}"
          export OMEGA_GATE_RESOURCEENDOWMENT="${GATES[resourceEndowment]}"
          export OMEGA_GATE_SITEDATACOMPLETENESS="${GATES[siteDataCompleteness]}"
          export OMEGA_GATE_RESOURCEREFERENCELOSSLESS="${GATES[resourceReferenceLossless]}"
          export OMEGA_GATE_RESOURCEECONOMY="${GATES[resourceEconomy]}"
          export OMEGA_GATE_AUTHORITATIVEADAPTER="${GATES[authoritativeAdapter]}"
          export OMEGA_GATE_RESOURCEACTIONS="${GATES[resourceActions]}"
          export OMEGA_GATE_COUNTRYBOUNDARY="${GATES[countryBoundary]}"
          export OMEGA_GATE_GLOBALPIPELINE="${GATES[globalPipeline]}"
          export OMEGA_GATE_PRODUCTIONMODELV2="${GATES[productionModelV2]}"
          export OMEGA_GATE_REALISMV1="${GATES[realismV1]}"
          export OMEGA_GATE_LOGISTICSV1="${GATES[logisticsV1]}"
          export OMEGA_GATE_SETTLEMENTCOMPATIBILITY="${GATES[settlementCompatibility]}"
          export OMEGA_GATE_RESOURCERESEARCH="${GATES[resourceResearch]}"
          export OMEGA_GATE_RESOURCERESEARCHEVIDENCE="${GATES[resourceResearchEvidence]}"
          export OMEGA_GATE_RESOURCERESEARCHPOLICY="${GATES[resourceResearchPolicy]}"
          export OMEGA_GATE_RESOURCESYSTEMHARDENING="${GATES[resourceSystemHardening]}"
          export OMEGA_GATE_RESOURCEINDUSTRIALNETWORK="${GATES[resourceIndustrialNetwork]}"
          export OMEGA_GATE_RESOURCEGAMEPLAYBINDING="${GATES[resourceGameplayBinding]}"
          export OMEGA_GATE_GLOBALRESOURCECATALOG="${GATES[globalResourceCatalog]}"
          export OMEGA_GATE_RESOURCECOORDINATEVALIDATION="${GATES[resourceCoordinateValidation]}"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const gates = {
            syntax: process.env.OMEGA_GATE_SYNTAX,
            resourceEndowment: process.env.OMEGA_GATE_RESOURCEENDOWMENT,
            siteDataCompleteness: process.env.OMEGA_GATE_SITEDATACOMPLETENESS,
            resourceReferenceLossless: process.env.OMEGA_GATE_RESOURCEREFERENCELOSSLESS,
            resourceEconomy: process.env.OMEGA_GATE_RESOURCEECONOMY,
            authoritativeAdapter: process.env.OMEGA_GATE_AUTHORITATIVEADAPTER,
            resourceActions: process.env.OMEGA_GATE_RESOURCEACTIONS,
            countryBoundary: process.env.OMEGA_GATE_COUNTRYBOUNDARY,
            globalPipeline: process.env.OMEGA_GATE_GLOBALPIPELINE,
            productionModelV2: process.env.OMEGA_GATE_PRODUCTIONMODELV2,
            realismV1: process.env.OMEGA_GATE_REALISMV1,
            logisticsV1: process.env.OMEGA_GATE_LOGISTICSV1,
            settlementCompatibility: process.env.OMEGA_GATE_SETTLEMENTCOMPATIBILITY,
            resourceResearch: process.env.OMEGA_GATE_RESOURCERESEARCH,
            resourceResearchEvidence: process.env.OMEGA_GATE_RESOURCERESEARCHEVIDENCE,
            resourceResearchPolicy: process.env.OMEGA_GATE_RESOURCERESEARCHPOLICY,
            resourceSystemHardening: process.env.OMEGA_GATE_RESOURCESYSTEMHARDENING,
            resourceIndustrialNetwork: process.env.OMEGA_GATE_RESOURCEINDUSTRIALNETWORK,
            resourceGameplayBinding: process.env.OMEGA_GATE_RESOURCEGAMEPLAYBINDING,
            globalResourceCatalog: process.env.OMEGA_GATE_GLOBALRESOURCECATALOG,
            resourceCoordinateValidation: process.env.OMEGA_GATE_RESOURCECOORDINATEVALIDATION
          };
          const status = Object.values(gates).every((value) => value === 'PASS') ? 'VERIFIED' : 'INCOMPLETE';
          const certificate = {
            certificate: 'OMEGA-RESOURCE-VERIFICATION',
            status,
            workflow: 'OMEGA Resource Verification Certificate',
            commit: process.env.GITHUB_SHA,
            run: process.env.GITHUB_RUN_NUMBER,
            generatedAt: new Date().toISOString(),
            gates,
            timeboxing: {
              longGatePolicy: 'TIMEOUT_AND_CONTINUE',
              endowmentSeconds: 120,
              otherTestSeconds: 15,
              syntaxSeconds: 3
            },
            authorityPolicy: {
              observedStateCanNotBeOverwrittenBySimulatedState: true,
              simulatedValuesAreExplicit: true,
              standardsPolicyDataset: 'OMEGA_RESOURCE_RESEARCH_POLICY_V1',
              mineralFramework: 'CRIRSCO_STYLE',
              petroleumFramework: 'SPE_PRMS_2018',
              universalDeclineRateAllowed: false,
              commodityCalibrationSource: 'USGS_MCS_2026'
            }
          };
          fs.writeFileSync('omega_resource_verification_certificate.json', JSON.stringify(certificate, null, 2)+'\n');
          console.log(JSON.stringify(certificate, null, 2));
          if (status !== 'VERIFIED') process.exitCode = 2;
          NODE

      - name: Upload verified certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-resource-verification-certificate
          path: omega_resource_verification_certificate.json