name: Repair live index
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good application shell
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 8addd28c20b80b2dee6c564b68b0108edda1180c
          git show 8addd28c20b80b2dee6c564b68b0108edda1180c:index.html > /tmp/known-good-index.html
          test "$(wc -c < /tmp/known-good-index.html)" -gt 50000
          cp /tmp/known-good-index.html index.html
      - name: Apply only the production minister wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="omega_ui_interaction_fix_v2.css">'
          scripts = [
              '<script src="omega_minister_runtime_v2.js" defer></script>',
              '<script src="omega_production_semantic_runtime_v3.js" defer></script>',
              '<script src="omega_live_minister_selector.js" defer></script>',
              '<script src="omega_minister_semantic_question_bridge.js" defer></script>'
          ]
          legacy = (
              'omega_semantic_runtime_v32.js',
              'omega_country_semantic_bridge.js',
              'omega_resource_semantic_bridge.js',
              'omega_minister_semantic_question_bridge_v1.js'
          )
          for name in legacy:
              s = s.replace(f'<script src="{name}" defer></script>', '')
          if css not in s:
              s = s.replace('</head>', f'    {css}\n</head>', 1)
          for script in scripts:
              s = s.replace(script, '')
          for script in scripts:
              s = s.replace('</body>', f'    {script}\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Structural validation
        run: |
          set -euo pipefail
          test "$(wc -c < index.html)" -gt 50000
          grep -q '<div id="app"' index.html
          grep -q '<div id="map"' index.html
          grep -q 'id="ui-engine-root"' index.html
          for f in omega_minister_runtime_v2.js omega_production_semantic_runtime_v3.js omega_live_minister_selector.js omega_minister_semantic_question_bridge.js; do grep -q "$f" index.html; done
          test "$(grep -o 'omega_minister_runtime_v2.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'omega_production_semantic_runtime_v3.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'omega_live_minister_selector.js' index.html | wc -l)" -eq 1
          test "$(grep -o 'omega_minister_semantic_question_bridge.js' index.html | wc -l)" -eq 1
          ! grep -q 'omega_semantic_runtime_v32.js' index.html
          ! grep -q 'omega_country_semantic_bridge.js' index.html
          ! grep -q 'omega_resource_semantic_bridge.js' index.html
      - name: JavaScript syntax validation
        run: |
          set -euo pipefail
          node --check omega_minister_runtime_v2.js
          node --check omega_production_semantic_runtime_v3.js
          node --check omega_live_minister_selector.js
          node --check omega_minister_semantic_question_bridge.js
      - name: Commit repaired index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore complete live application shell'
          git push origin HEAD:main
