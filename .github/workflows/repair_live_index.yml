name: Repair live index
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair and wire live shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'id="app"' not in s:
              import subprocess
              subprocess.run(['git','checkout','899de7ed952955a1a93eddc377d85779a022a845','--','index.html'],check=True)
              s=p.read_text()
          marker='</body>'
          scripts='''\n    <script src="omega_minister_runtime_v2.js" defer></script>\n    <script src="omega_production_semantic_runtime_v3.js" defer></script>\n    <script src="omega_live_minister_selector.js" defer></script>\n'''
          if 'omega_minister_runtime_v2.js' not in s:
              s=s.replace(marker,scripts+marker,1)
          elif 'omega_live_minister_selector.js' not in s:
              s=s.replace(marker,'    <script src="omega_live_minister_selector.js" defer></script>\n'+marker,1)
          p.write_text(s)
          PY
          grep -q 'id="app"' index.html
          grep -q 'omega_minister_runtime_v2.js' index.html
          grep -q 'omega_production_semantic_runtime_v3.js' index.html
          grep -q 'omega_live_minister_selector.js' index.html
          grep -q 'omega_ui_interaction_fix_v2.css' index.html
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Repair live index and wire minister selector'
          git push origin HEAD:main