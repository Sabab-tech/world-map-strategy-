permissions:
  contents: read

jobs:
  real-resource-gameplay-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository syntax and source-integrity checks
        run: npm run lint
      - name: Server AI resource decision contract
        run: npm run test:resource-ai-decision
      - name: Live operations UI data-binding regression
        run: npm run test:liveops
      - name: All-country browsing and factory UI regression
        run: npm run test:omega-ui-v2 && node --test test/omega_ui_v2_asset_navigation.test.mjs
      - name: Milestone A complete registry audit
        run: npm run test:resource-site-integrity
      - name: Source-preserving quantity normalization and missing-site coverage
        run: npm run test:resource-quantity-normalization && npm run test:resource-quantity-completion
      - name: Endowment runtime regression
        run: npm run test:resource-endowment
      - name: Every-deposit resource recipe coverage
        run: npm run test:resource-recipe-coverage
      - name: Real Endowment to output, market and treasury
        run: npm run test:resource-e2e
      - name: Autonomous per-country deposit-to-market regression
        run: npm run test:resource-global-auto
      - name: International trade lineage regression
        run: npm run test:global-trade
      - name: Global raw inventory regression
        run: npm run test:resource-global-pipeline
      - name: Authoritative resource adapter regression
        run: npm run test:resource-authoritative
      - name: Resource action and settlement regression
        run: npm run test:resource-actions && npm run test:resource-request
      - name: Production and realism regressions
        run: npm run test:resource-production-model && npm run test:resource-realism
      - name: National demand and player supply lifeline regression
        run: npm run test:resource-demand
      - name: Country startup inventory and factory baseline regression
        run: npm run test:resource-startup-baseline
      - name: Resource Command Center supply policy UI regression
        run: node --test test/omega_resource_command_center_ui_v1.test.mjs test/omega_resource_command_center_ui_v1_integration.test.mjs
      - name: Resource state hardening regression
        run: npm run test:resource-system-hardening
      - name: Industrial network regression
        run: npm run test:resource-industrial-network
      - name: Factory catalog, construction and quantity integrity
        run: npm run test:factory-baseline
      - name: Transport logistics regression
        run: npm run test:resource-logistics
      - name: Strategic policy, depletion and save/load integrity regressions
        run: npm run test:resource-strategic-policy && npm run test:resource-multicentury-depletion
