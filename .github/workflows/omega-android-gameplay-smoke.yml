name: OMEGA Android 9 Offline Gameplay Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/omega-android-gameplay-smoke.yml"
      - "android/**"
      - "index.html"
      - "omega_boot_performance_monitor_v1.js"
      - "omega_enterprise_composition_root_v10.js"
      - "omega-offline-map-sw.js"
      - "country_sector_profiles_v1.json"
      - "country_sector_profile_schema_v1.json"
      - "country_general_data_registry_v1.json"
      - "omega_ministry_entry_v3.js"
      - "omega_ui_system_redesign_v1.js"
      - "map-engine-1.js"
      - "map-engine-2.js"
      - "test/**"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/omega-android-gameplay-smoke.yml"
      - "android/**"
      - "index.html"
      - "omega_boot_performance_monitor_v1.js"
      - "omega_enterprise_composition_root_v10.js"
      - "omega-offline-map-sw.js"
      - "country_sector_profiles_v1.json"
      - "country_sector_profile_schema_v1.json"
      - "country_general_data_registry_v1.json"
      - "omega_ministry_entry_v3.js"
      - "omega_ui_system_redesign_v1.js"
      - "map-engine-1.js"
      - "map-engine-2.js"

permissions:
  contents: read

concurrency:
  # CI smoke tests are disposable; newer commits must not wait behind stale emulator runs.
  group: omega-android9-gameplay-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-gameplay-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build Android debug APK and instrumentation APK
        run: gradle -p android assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Run offline gameplay smoke on Android 9 emulator (API 28)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 28
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2
          disable-animations: true
          script: |
            sh -c 'set -eu; artifact_dir="$RUNNER_TEMP/omega-android9-smoke"; mkdir -p "$artifact_dir"; adb shell cmd webviewupdate set-webview-implementation com.android.chrome >"$artifact_dir/webview-provider-select.txt" 2>&1 || true; adb shell dumpsys webviewupdate | tee "$artifact_dir/webview-provider.txt"; adb shell dumpsys package com.android.chrome | grep -m1 -E "versionName=|versionCode=" >"$artifact_dir/chrome-version.txt" 2>&1 || true; wait_for_api28() { poll=1; while [ "$poll" -le 45 ]; do state="$(adb get-state 2>/dev/null | tr -d "\r" || true)"; if [ "$state" = "device" ]; then boot="$(timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" || true)"; sdk="$(timeout 5s adb shell getprop ro.build.version.sdk 2>/dev/null | tr -d "\r" || true)"; if [ "$boot" = "1" ] && [ "$sdk" = "28" ]; then echo "API 28 emulator online and fully booted (poll $poll)"; return 0; fi; elif [ "$state" = "offline" ]; then adb reconnect offline >/dev/null 2>&1 || true; fi; sleep 2; poll=$((poll + 1)); done; echo "ERROR: API 28 emulator did not become ready" >&2; adb devices -l >&2 || true; return 1; }; wait_for_api28; adb shell getprop ro.build.version.sdk | tee "$artifact_dir/api-level.txt"; adb devices -l | tee "$artifact_dir/adb-devices-before.txt"; attempt=1; max_attempts=3; while [ "$attempt" -le "$max_attempts" ]; do log_file="$artifact_dir/gradle-attempt-$attempt.log"; echo "Offline gameplay instrumentation attempt $attempt/$max_attempts"; if gradle -p android connectedDebugAndroidTest --no-daemon >"$log_file" 2>&1; then cat "$log_file"; echo "PASS: API 28 offline gameplay instrumentation completed"; exit 0; else test_exit=$?; cat "$log_file"; echo "Instrumentation attempt failed with exit code $test_exit"; fi; adb logcat -d -v threadtime >"$artifact_dir/logcat-attempt-$attempt.txt" 2>&1 || true; adb devices -l >"$artifact_dir/adb-devices-after-$attempt.txt" 2>&1 || true; for report_dir in android/app/build/outputs/androidTest-results android/app/build/reports/androidTests; do if [ -d "$report_dir" ]; then find "$report_dir" -type f -print; find "$report_dir" -type f -name "*.xml" -exec cat {} \;; fi; done; if ! grep -Eiq "No compatible devices connected|Unknown API Level|ShellCommandUnresponsiveException|adb: device offline|device offline|Device offline" "$log_file"; then echo "ERROR: instrumentation failed for a non-transport reason; diagnostics are saved" >&2; exit "$test_exit"; fi; if [ "$attempt" -ge "$max_attempts" ]; then echo "ERROR: ADB/device discovery failed after $max_attempts attempts" >&2; exit "$test_exit"; fi; echo "Transient ADB failure; restarting ADB and rechecking API 28"; adb kill-server >/dev/null 2>&1 || true; adb start-server; adb reconnect offline >/dev/null 2>&1 || true; wait_for_api28 || exit "$test_exit"; attempt=$((attempt + 1)); done'

      - name: Upload Android 9 smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-android9-smoke-diagnostics
          path: |
            ${{ runner.temp }}/omega-android9-smoke/**
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 7
