name: OMEGA Android 9 Offline Gameplay Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/omega-android-gameplay-smoke.yml"
      - "android/**"
      - "index.html"
      - "omega-offline-map-sw.js"
      - "country_sector_profiles_v1.json"
      - "country_sector_profile_schema_v1.json"
      - "country_general_data_registry_v1.json"
      - "omega_ministry_entry_v3.js"
      - "omega_ui_system_redesign_v1.js"
      - "map-engine-1.js"
      - "map-engine-2.js"
      - "test/**"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/omega-android-gameplay-smoke.yml"
      - "android/**"
      - "index.html"
      - "omega-offline-map-sw.js"
      - "country_sector_profiles_v1.json"
      - "country_sector_profile_schema_v1.json"
      - "country_general_data_registry_v1.json"
      - "omega_ministry_entry_v3.js"
      - "omega_ui_system_redesign_v1.js"
      - "map-engine-1.js"
      - "map-engine-2.js"

permissions:
  contents: read

concurrency:
  # Every head of the same PR shares one group, so a newer head cancels stale emulator runs.
  group: omega-android9-gameplay-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-gameplay-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build Android debug APK and instrumentation APK
        run: gradle -p android assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Run offline gameplay smoke on Android 9 emulator (API 28)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell getprop ro.build.version.sdk
            bash -c 'set +e; gradle -p android connectedDebugAndroidTest --no-daemon; test_status=$?; if [ "$test_status" -ne 0 ]; then mkdir -p android/app/build/reports/omega-offline-smoke; adb logcat -d -t 8000 > android/app/build/reports/omega-offline-smoke/logcat.txt 2>&1 || true; find android/app/build/outputs/androidTest-results android/app/build/reports/androidTests -type f -name "*.xml" -print 2>/dev/null || true; find android/app/build/outputs/androidTest-results android/app/build/reports/androidTests -type f -name "*.xml" -exec cat {} \; 2>/dev/null || true; fi; exit "$test_status"'
      - name: Print Android instrumentation diagnostics on failure
        if: failure()
        shell: bash
        run: |
          find android/app/build/outputs/androidTest-results/connected/debug android/app/build/reports/androidTests/connected/debug -type f -name '*.xml' -print -exec cat {} \; 2>/dev/null || true
          if [ -f android/app/build/reports/omega-offline-smoke/logcat.txt ]; then
            grep -Ei 'AndroidRuntime|chromium|console.*(error|exception)|uncaught|fatal exception' android/app/build/reports/omega-offline-smoke/logcat.txt | tail -n 240 || true
          fi

      - name: Upload Android 9 offline smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omega-android9-offline-smoke-diagnostics
          if-no-files-found: warn
          path: |
            android/app/build/outputs/androidTest-results/connected/debug/**
            android/app/build/reports/androidTests/connected/debug/**
            android/app/build/reports/omega-offline-smoke/**
