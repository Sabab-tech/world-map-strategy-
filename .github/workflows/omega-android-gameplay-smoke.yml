name: OMEGA Android 9 Offline Gameplay Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/omega-android-gameplay-smoke.yml"
      - "android/**"
      - "index.html"
      - "omega-offline-map-sw.js"
      - "country_sector_profiles_v1.json"
      - "country_sector_profile_schema_v1.json"
      - "country_general_data_registry_v1.json"
      - "omega_ministry_entry_v3.js"
      - "omega_ui_system_redesign_v1.js"
      - "map-engine-1.js"
      - "map-engine-2.js"
      - "test/**"
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/omega-android-gameplay-smoke.yml"
      - "android/**"
      - "index.html"
      - "omega-offline-map-sw.js"
      - "country_sector_profiles_v1.json"
      - "country_sector_profile_schema_v1.json"
      - "country_general_data_registry_v1.json"
      - "omega_ministry_entry_v3.js"
      - "omega_ui_system_redesign_v1.js"
      - "map-engine-1.js"
      - "map-engine-2.js"

permissions:
  contents: read

concurrency:
  # CI smoke tests are disposable; newer commits must not wait behind stale emulator runs.
  group: omega-android9-gameplay-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-gameplay-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build Android debug APK and instrumentation APK
        run: gradle -p android assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Run offline gameplay smoke on Android 9 emulator (API 28)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 28
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot-load -no-snapshot-save -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2
          disable-animations: true
          script: |
            # The emulator action executes script lines via /bin/sh, so keep recovery logic in one shell process.
            sh -c 'set -eu; wait_for_api28() { poll=1; while [ "$poll" -le 45 ]; do state="$(adb get-state 2>/dev/null | tr -d "\r" || true)"; if [ "$state" = "device" ]; then boot="$(timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" || true)"; sdk="$(timeout 5s adb shell getprop ro.build.version.sdk 2>/dev/null | tr -d "\r" || true)"; if [ "$boot" = "1" ] && [ "$sdk" = "28" ]; then echo "API 28 emulator online and fully booted"; return 0; fi; elif [ "$state" = "offline" ]; then adb reconnect offline >/dev/null 2>&1 || true; fi; sleep 2; poll=$((poll + 1)); done; echo "ERROR: API 28 emulator did not become ready" >&2; adb devices -l >&2 || true; return 1; }; wait_for_api28; attempt=1; max_attempts=3; while [ "$attempt" -le "$max_attempts" ]; do log_file="/tmp/omega-offline-gameplay-smoke-$attempt.log"; echo "Offline gameplay instrumentation attempt $attempt/$max_attempts"; if gradle -p android connectedDebugAndroidTest --no-daemon >"$log_file" 2>&1; then cat "$log_file"; echo "PASS: API 28 offline gameplay instrumentation completed"; exit 0; else test_exit=$?; cat "$log_file"; fi; if ! grep -Eiq "No compatible devices connected|Unknown API Level|ShellCommandUnresponsiveException|adb: device offline|device offline" "$log_file"; then echo "ERROR: instrumentation failed without an emulator/ADB discovery error; not retrying" >&2; exit "$test_exit"; fi; if [ "$attempt" -ge "$max_attempts" ]; then echo "ERROR: emulator/ADB discovery failed after $max_attempts attempts" >&2; adb devices -l >&2 || true; exit "$test_exit"; fi; echo "Transient ADB failure; restarting ADB and rechecking API 28"; adb kill-server >/dev/null 2>&1 || true; adb start-server; adb reconnect offline >/dev/null 2>&1 || true; wait_for_api28 || exit "$test_exit"; attempt=$((attempt + 1)); done'

            wait_for_api28() {
              poll=1
              while [ "$poll" -le 45 ]; do
                state="$(adb get-state 2>/dev/null | tr -d '\r' || true)"
                if [ "$state" = "device" ]; then
                  boot="$(timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
                  sdk="$(timeout 5s adb shell getprop ro.build.version.sdk 2>/dev/null | tr -d '\r' || true)"
                  if [ "$boot" = "1" ] && [ "$sdk" = "28" ]; then
                    echo "API 28 emulator is online and fully booted (poll $poll)."
                    return 0
                  fi
                elif [ "$state" = "offline" ]; then
                  adb reconnect offline >/dev/null 2>&1 || true
                fi
                sleep 2
                poll=$((poll + 1))
              done
              echo "ERROR: emulator did not become a fully booted API 28 device." >&2
              adb devices -l >&2 || true
              return 1
            }

            wait_for_api28
            adb shell getprop ro.build.version.sdk

            attempt=1
            max_attempts=3
            while [ "$attempt" -le "$max_attempts" ]; do
              log_file="/tmp/omega-offline-gameplay-smoke-${attempt}.log"
              echo "Offline gameplay instrumentation attempt ${attempt}/${max_attempts}"

              if gradle -p android connectedDebugAndroidTest --no-daemon >"$log_file" 2>&1; then
                cat "$log_file"
                echo "PASS: API 28 offline gameplay instrumentation completed."
                exit 0
              else
                test_exit=$?
                cat "$log_file"
              fi

              # Retry only when ADB/emulator transport prevented test discovery.
              # Actual instrumentation assertions fail immediately without retry.
              if ! grep -Eiq 'No compatible devices connected|Unknown API Level|ShellCommandUnresponsiveException|adb: device offline|device offline' "$log_file"; then
                echo "ERROR: instrumentation failed without an emulator/ADB discovery error; not retrying." >&2
                exit "$test_exit"
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "ERROR: emulator/ADB discovery failed after ${max_attempts} attempts." >&2
                adb devices -l >&2 || true
                exit "$test_exit"
              fi

              echo "Transient ADB failure detected; restarting ADB and rechecking API 28 boot state."
              adb kill-server >/dev/null 2>&1 || true
              adb start-server
              adb reconnect offline >/dev/null 2>&1 || true
              wait_for_api28 || exit "$test_exit"
              attempt=$((attempt + 1))
            done
