name: OMEGA Resource Site Enrichment

on:
  push:
    branches: [main]

permissions:
  contents: write

# SINGLE RESOURCE-SITE ENRICHMENT EXECUTION

concurrency:
  group: omega-resource-site-enrichment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enrich:
    if: contains(github.event.head_commit.message, '[resource-site-enrichment]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Revalidate and enrich 199 resource sites
        run: node scripts/omega_revalidate_199_resource_sites.mjs

      - name: Commit enriched resource data
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore(resource): revalidate and enrich 199 resource sites"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Failed to push enriched resource data after three synchronized attempts." >&2
          exit 1
