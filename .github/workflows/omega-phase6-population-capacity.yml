name: OMEGA Phase 6 Population and Industrial Capacity

on:
  pull_request:
    paths:
      - "omega_phase6_national_population_capacity_runtime_v1.js"
      - "omega_simulation_runtime.js"
      - "test/omega_phase6_national_population_capacity_runtime_v1.test.mjs"
      - "test/omega_simulation_phase6_save_provenance.test.mjs"
      - "docs/OMEGA_PHASE6_NATIONAL_POPULATION_CONSUMPTION_INDUSTRIAL_CAPACITY_V1.md"
      - "index.html"
      - "country_general_data_registry_v1.json"
      - "population_official_observations_v1.json"
      - "scripts/build_country_general_data_registry_v1.mjs"
      - "resource_country_resource_context_index.json"
      - "resource_economy_rules.json"
      - "country_factory_starting_baseline_v1.json"
      - "resource_industrial_catalog_v1.json"
      - "omega_country_general_data_runtime_v1.js"
      - "omega_country_factory_starting_baseline_v1.js"
      - "omega_resource_national_demand_runtime_v1.js"
      - "omega_resource_industrial_network_v1.js"
      - "omega_global_trade_system.js"
      - "test/omega_global_trade_system.test.mjs"
      - "omega-offline-map-sw.js"
      - "test/omega_ui_v2.test.mjs"
      - "package.json"
      - ".github/workflows/omega-phase6-population-capacity.yml"
  push:
    branches: [main]
    paths:
      - "omega_phase6_national_population_capacity_runtime_v1.js"
      - "omega_simulation_runtime.js"
      - "test/omega_phase6_national_population_capacity_runtime_v1.test.mjs"
      - "test/omega_simulation_phase6_save_provenance.test.mjs"
      - "docs/OMEGA_PHASE6_NATIONAL_POPULATION_CONSUMPTION_INDUSTRIAL_CAPACITY_V1.md"
      - "index.html"
      - "country_general_data_registry_v1.json"
      - "population_official_observations_v1.json"
      - "scripts/build_country_general_data_registry_v1.mjs"
      - "resource_country_resource_context_index.json"
      - "resource_economy_rules.json"
      - "country_factory_starting_baseline_v1.json"
      - "resource_industrial_catalog_v1.json"
      - "omega_country_general_data_runtime_v1.js"
      - "omega_country_factory_starting_baseline_v1.js"
      - "omega_resource_national_demand_runtime_v1.js"
      - "omega_resource_industrial_network_v1.js"
      - "omega_global_trade_system.js"
      - "test/omega_global_trade_system.test.mjs"
      - "omega-offline-map-sw.js"
      - "test/omega_ui_v2.test.mjs"
      - "package.json"
      - ".github/workflows/omega-phase6-population-capacity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rebuild registry with official country population evidence
        run: node scripts/build_country_general_data_registry_v1.mjs
      - name: Syntax-check Phase 6 runtime
        run: node --check omega_phase6_national_population_capacity_runtime_v1.js
      - name: Verify national population, consumption and capacity contracts
        run: node --test test/omega_phase6_national_population_capacity_runtime_v1.test.mjs test/omega_simulation_phase6_save_provenance.test.mjs
      - name: Verify durable bilateral shipment lifecycle
        run: node --check omega_global_trade_system.js && node test/omega_global_trade_system.test.mjs
      - name: Verify offline Phase 6 runtime and cache invalidation
        run: node --check omega-offline-map-sw.js && node --test --test-name-pattern="market presentation keeps raw, factory-role and food lanes separate and uses offline vector art" test/omega_ui_v2.test.mjs
      - name: Verify existing population-demand and factory authorities
        run: npm run test:resource-demand && npm run test:country-factory-starting-baseline
