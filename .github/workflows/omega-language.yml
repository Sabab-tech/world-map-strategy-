name: OMEGA Canonical AI Resource Repair
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/omega-language.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Patch resource registry ingestion and resolver
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('omega_resource_semantic_bridge.js')
          s=p.read_text(encoding='utf-8')
          old="""  function ingestResourceDataset(raw,source){if(!O(raw)&&!Array.isArray(raw))return;state.resourcesRaw.push({source,raw:C(raw)});const roots=[];for(const k of ['resources','resourceDatabase','RESOURCE_DATABASE','resource_types'])if(raw?.[k]!=null)roots.push([k,raw[k]]);if(raw?.GSRSK_Master_Resource_Data_v14?.resource_types)roots.push(['GSRSK_Master_Resource_Data_v14',raw.GSRSK_Master_Resource_Data_v14.resource_types]);if(!roots.length&&raw?.GSRSK_Master_CountryProfiles_v14)return;const walk=(v,path,parentType=null)=>{if(Array.isArray(v)){v.forEach((x,i)=>walk(x,path.concat(String(i)),parentType));return;}if(!O(v))return;const key=path[path.length-1]||'';if(CONTAINER_KEY.test(S(key)))return;const c=recordCandidate(v,key);if(c){const id=TOKEN(c.instanceId||`${source}_${state.resourceRecords.length+1}`);const rt=TOKEN(c.resourceTypeId||parentType||'');const cr=resolveCountry(c.countryRaw);state.resourceRecords.push({id,resourceTypeId:rt||null,countryId:cr.id||S(c.countryRaw).toUpperCase()||null,source,path:path.join('.'),raw:C(c.raw),assetClass:c.assetClass||null});}for(const[k,x]of Object.entries(v)){if(CONTAINER_KEY.test(S(k)))continue;const next=/resource_types|resources|resourceDatabase|RESOURCE_DATABASE/i.test(key)?TOKEN(k):parentType;walk(x,path.concat(k),next);}};for(const[rootKey,root]of roots)walk(root,[rootKey],null);state.diagnostics.resourceRecordCount=state.resourceRecords.length;}"""
          new="""  function ingestResourceDataset(raw,source){if(!O(raw)&&!Array.isArray(raw))return;state.resourcesRaw.push({source,raw:C(raw)});const roots=[];for(const k of ['resources','resourceDatabase','RESOURCE_DATABASE','resource_types'])if(raw?.[k]!=null)roots.push([k,raw[k]]);if(raw?.GSRSK_Master_Resource_Data_v14?.resource_types)roots.push(['GSRSK_Master_Resource_Data_v14',raw.GSRSK_Master_Resource_Data_v14.resource_types]);if(!roots.length&&raw?.GSRSK_Master_CountryProfiles_v14)return;const walk=(v,path,parentType=null)=>{if(Array.isArray(v)){v.forEach((x,i)=>walk(x,path.concat(String(i)),parentType));return;}if(!O(v))return;const key=path[path.length-1]||'';if(CONTAINER_KEY.test(S(key)))return;const candidate=recordCandidate(v,key);const declaredType=first(v,['resourceTypeId','resource_type_id','resource','commodityId','commodity','resourceName','commodityName'])||parentType;const declaredName=first(v,['resourceName','commodityName','resource_name','commodity_name','name','displayName','label']);if(declaredType){const rid=TOKEN(declaredType);if(rid)registerResourceType({id:rid,name:declaredName||key},rid);}if(candidate){const id=TOKEN(candidate.instanceId||`${source}_${state.resourceRecords.length+1}`);const rt=TOKEN(candidate.resourceTypeId||parentType||'');if(rt&&!state.resources.has(rt))registerResourceType({id:rt,name:declaredName||rt},rt);const cr=resolveCountry(candidate.countryRaw);state.resourceRecords.push({id,resourceTypeId:rt||null,countryId:cr.id||S(candidate.countryRaw).toUpperCase()||null,source,path:path.join('.'),raw:C(candidate.raw),assetClass:candidate.assetClass||null});}for(const[k,x]of Object.entries(v)){if(CONTAINER_KEY.test(S(k)))continue;const next=/resource_types|resources|resourceDatabase|RESOURCE_DATABASE/i.test(key)?TOKEN(k):parentType;walk(x,path.concat(k),next);}};for(const[rootKey,root]of roots)walk(root,[rootKey],null);state.diagnostics.resourceRecordCount=state.resourceRecords.length;}"""
          if old not in s: raise SystemExit('resource dataset ingestion anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add omega_resource_semantic_bridge.js
          git commit -m 'fix: register resource identities from loaded datasets [skip ci]'
          git push
      - name: Runtime verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/canonical-identity-full
          git reset --hard origin/fix/canonical-identity-full
          npm install --ignore-scripts --no-audit
          npm run lint
          node scripts/test_canonical_ai_chain.cjs
          node scripts/test_deep_semantic_brain.cjs