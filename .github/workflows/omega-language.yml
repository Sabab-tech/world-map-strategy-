# Canonical language + AI runtime verification. Full semantic/cognitive regression is required.
name: OMEGA Language System

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  language-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit
      - name: Repair malformed offline lexicon only when required
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('offline_lexicon.json')
          raw = p.read_bytes()
          try:
              text = raw.decode('utf-8')
              json.loads(text)
              print('OFFLINE_LEXICON_JSON: already valid UTF-8 JSON')
          except Exception as first_error:
              text = raw.decode('utf-8', errors='surrogateescape')
              lines = text.splitlines()
              line_no = 21027
              if 1 <= line_no <= len(lines):
                  print('OFFLINE_LEXICON_BAD_LINE:', repr(lines[line_no - 1]))
              print('OFFLINE_LEXICON_INITIAL_ERROR:', repr(first_error))

              out = []
              in_string = False
              escaped = False
              i = 0
              n = len(text)
              structural = {':', ',', '}', ']'}
              while i < n:
                  ch = text[i]
                  code = ord(ch)
                  if escaped:
                      out.append(ch)
                      escaped = False
                      i += 1
                      continue
                  if in_string and ch == '\\':
                      out.append(ch)
                      escaped = True
                      i += 1
                      continue
                  if ch == '"':
                      if not in_string:
                          in_string = True
                          out.append(ch)
                          i += 1
                          continue
                      j = i + 1
                      while j < n and text[j] in ' \t\r\n':
                          j += 1
                      nxt = text[j] if j < n else ''
                      if nxt in structural or not nxt:
                          in_string = False
                          out.append(ch)
                      else:
                          out.append('\\"')
                      i += 1
                      continue
                  if in_string and code < 0x20:
                      out.append(f'\\u{code:04x}')
                      i += 1
                      continue
                  if 0xDC80 <= code <= 0xDCFF:
                      if in_string:
                          out.append(f'\\u{code - 0xDC00:04x}')
                      else:
                          out.append(' ')
                      i += 1
                      continue
                  out.append(ch)
                  i += 1

              repaired = ''.join(out)
              data = json.loads(repaired)
              if not isinstance(data, dict):
                  raise SystemExit('offline_lexicon.json repaired successfully but root is not an object')
              data_words = data.get('DICTIONARY')
              if not isinstance(data_words, dict) or not data_words:
                  raise SystemExit('offline_lexicon.json repaired successfully but DICTIONARY is empty')
              p.write_text(repaired, encoding='utf-8')
              print(f'OFFLINE_LEXICON_REPAIRED: {first_error}')
              print(f'OFFLINE_LEXICON_WORDS: {len(data_words)}')
          PY
          if ! git diff --quiet -- offline_lexicon.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add offline_lexicon.json
            git commit -m 'fix: repair malformed offline lexicon [skip ci]'
            git push
          fi
      - name: Validate repaired repository JSON
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const text = await fs.readFile('offline_lexicon.json', 'utf8');
          const data = JSON.parse(text);
          if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('offline_lexicon.json root must be an object');
          if (!data.DICTIONARY || typeof data.DICTIONARY !== 'object' || !Object.keys(data.DICTIONARY).length) throw new Error('offline_lexicon.json DICTIONARY is empty');
          console.log(`OFFLINE LEXICON JSON TEST PASSED; entries=${Object.keys(data.DICTIONARY).length}`);
          NODE
      - name: Syntax gate
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
      - name: Deep Core authority gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.cache -E 'api\.github\.com|raw\.githubusercontent\.com|BROWSER_GITHUB|github\.io' offline_query_engine.js server.js; then
            echo 'Deep Core browser GitHub retrieval authority remains.'
            exit 1
          fi
          if grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=.cache -E 'OfflineQueryEngine\.(execute|executeAsync|buildExecutionPlan|buildExecutionPlanAsync)\([^,]+, *\[\]' .; then
            echo 'Empty dataset/context injection remains in a production Deep Core call path.'
            exit 1
          fi
      - name: Canonical chain validation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test_canonical_ai_chain.cjs
      - name: Deep Core Node runtime verification
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import './omega_country_semantic_bridge.js';
          import './offline_query_engine.js';

          const countryBridge = globalThis.OmegaCanonicalIdentityRegistry || globalThis.OmegaCountrySemanticBridge;
          if (!countryBridge?.init) throw new Error('Canonical country identity bridge unavailable');
          const ready = await countryBridge.init();
          if (ready !== true) throw new Error('Canonical country identity bridge failed to initialize');

          const countries = JSON.parse(await fs.readFile('countries.json', 'utf8'));
          const rows = Array.isArray(countries) ? countries : (countries?.countries || countries?.data || Object.values(countries || {}));
          const row = rows.find(x => String(x?.code || x?.id || x?.iso2 || x?.iso3 || '').trim() && String(x?.name || '').trim());
          if (!row) throw new Error('No usable country record found in countries.json');

          const id = String(row.code || row.id || row.iso2 || row.iso3).trim().toUpperCase();
          const name = String(row.name).trim();
          const engine = globalThis.OfflineQueryEngine;
          if (!engine) throw new Error('OfflineQueryEngine unavailable');

          engine.initializeRepository();
          const diagnostics = engine.diagnostics();
          console.log('DEEP_CORE_DIAGNOSTICS', JSON.stringify(diagnostics, null, 2));
          if (!diagnostics?.scan || diagnostics.scan.authority !== 'NODE_FILESYSTEM') throw new Error(`Unexpected repository authority: ${diagnostics?.scan?.authority || 'UNKNOWN'}`);
          if (diagnostics.initialized !== true) throw new Error('Deep Core repository index did not initialize');
          if (!Number(diagnostics?.stats?.files) || !Number(diagnostics?.stats?.records)) throw new Error(`Deep Core repository index contains no usable indexed records: ${JSON.stringify(diagnostics)}`);
          if (diagnostics.scan.complete !== true) throw new Error(`Deep Core repository scan is incomplete: ${JSON.stringify(diagnostics.scan.failedFiles || [])}`);
          if (Number(diagnostics.scan.loadedFiles) !== Number(diagnostics.scan.discoveredFiles)) throw new Error(`Deep Core loaded/discovered mismatch: ${diagnostics.scan.loadedFiles}/${diagnostics.scan.discoveredFiles}`);
          const countryDataset = engine.catalog().find(x => String(x?.dataset || x?.name || '').toLowerCase() === 'countries.json');
          if (!countryDataset) throw new Error(`countries.json was not discovered by the Deep Core index: ${JSON.stringify(diagnostics.catalog || [])}`);

          const lookup = engine.lookupId(id);
          if (lookup.status !== 'RESOLVED' || !lookup.count) throw new Error(`Deep Core ID lookup failed for ${id}: ${lookup.status}; diagnostics=${JSON.stringify(diagnostics)}`);

          const search = engine.search(name);
          if (search.status !== 'RESOLVED' || !search.count) throw new Error(`Deep Core search failed for ${name}: ${search.status}; diagnostics=${JSON.stringify(diagnostics)}`);

          const ir = { operation: 'IDENTIFY', language: 'en', entities: { country: { id, surface: name } } };
          const result = engine.execute(ir, { countryId: id }, 'en', { countryId: id });
          if (!result?.ok || result.status !== 'VERIFIED_FACT') throw new Error(`Deep Core execute failed: ${result?.status || 'UNKNOWN'}; diagnostics=${JSON.stringify(diagnostics)}`);
          if (!Array.isArray(result.evidence) || !result.evidence.length) throw new Error('Deep Core execution returned no evidence');
          for (const e of result.evidence) {
            if (!e.dataset || !e.physicalPath || !e.recordLocator || !e.authority) throw new Error('Deep Core evidence missing dataset/path/locator/authority');
          }
          if (result.dataAccess?.authority !== 'NODE_FILESYSTEM') throw new Error(`Deep Core result authority mismatch: ${result.dataAccess?.authority || 'UNKNOWN'}`);

          console.log('DEEP CORE NODE RUNTIME TEST PASSED');
          console.log(`Repository authority: ${diagnostics.scan.authority}`);
          console.log(`Indexed files: ${diagnostics.stats.files}`);
          console.log(`Indexed records: ${diagnostics.stats.records}`);
          console.log(`Identity lookup: ${id} -> RESOLVED`);
          console.log(`Search: ${name} -> RESOLVED`);
          console.log(`Execution: VERIFIED_FACT; evidence=${result.evidence.length}`);
          console.log(`Evidence authority: ${result.evidence[0].authority}`);
          NODE
      - name: Deep Core server API runtime verification
        shell: bash
        run: |
          set -euo pipefail
          PORT=39079 node server_bootstrap.js >/tmp/omega-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const base = 'http://127.0.0.1:39079';
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          let health = null;
          for (let i = 0; i < 120; i++) {
            try {
              const r = await fetch(`${base}/api/deep-core/health`, { cache: 'no-store' });
              if (r.ok) { health = await r.json(); break; }
            } catch (_) {}
            await sleep(250);
          }
          if (!health?.ok) throw new Error('Deep Core server did not become healthy');
          const diag = await (await fetch(`${base}/api/deep-core/diagnostics`, { cache: 'no-store' })).json();
          if (diag?.scan?.authority !== 'NODE_FILESYSTEM') throw new Error(`Server Deep Core authority mismatch: ${diag?.scan?.authority || 'UNKNOWN'}`);
          if (diag?.initialized !== true) throw new Error('Server Deep Core was not initialized');
          if (diag?.scan?.complete !== true) throw new Error(`Server Deep Core repository scan incomplete: ${JSON.stringify(diag?.scan?.failedFiles || [])}`);

          const countries = JSON.parse(await fs.readFile('countries.json', 'utf8'));
          const rows = Array.isArray(countries) ? countries : (countries?.countries || countries?.data || Object.values(countries || {}));
          const row = rows.find(x => String(x?.code || x?.id || x?.iso2 || x?.iso3 || '').trim() && String(x?.name || '').trim());
          const id = String(row.code || row.id || row.iso2 || row.iso3).trim().toUpperCase();
          const name = String(row.name).trim();

          const lookupResponse = await fetch(`${base}/api/deep-core/lookup?id=${encodeURIComponent(id)}`);
          const lookup = await lookupResponse.json();
          if (!lookupResponse.ok || lookup.status !== 'RESOLVED' || !lookup.count) throw new Error(`Server lookup failed: ${lookup.status || lookupResponse.status}`);

          const searchResponse = await fetch(`${base}/api/deep-core/search?q=${encodeURIComponent(name)}`);
          const search = await searchResponse.json();
          if (!searchResponse.ok || search.status !== 'RESOLVED' || !search.count) throw new Error(`Server search failed: ${search.status || searchResponse.status}`);

          const queryResponse = await fetch(`${base}/api/deep-core/query`, { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ prompt: `List records for ${name}`, countryId: id }) });
          const query = await queryResponse.json();
          if (!query?.result || !query.result?.evidence?.length) throw new Error(`Server Deep Core query returned no evidence: ${query?.result?.status || query?.status || queryResponse.status}`);
          if (query.result?.dataAccess?.authority !== 'NODE_FILESYSTEM') throw new Error(`Server query authority mismatch: ${query.result?.dataAccess?.authority || 'UNKNOWN'}`);
          for (const e of query.result.evidence) {
            if (!e.dataset || !e.physicalPath || !e.recordLocator || !e.authority) throw new Error('Server query evidence missing provenance fields');
          }

          console.log('DEEP CORE SERVER API RUNTIME TEST PASSED');
          console.log(`Health: PASS`);
          console.log(`Authority: ${diag.scan.authority}`);
          console.log(`Lookup: ${id} -> RESOLVED`);
          console.log(`Search: ${name} -> RESOLVED`);
          console.log(`Query evidence: ${query.result.evidence.length}`);
          console.log(`Query evidence authority: ${query.result.evidence[0].authority}`);
          NODE
          echo '--- server log ---'
          tail -n 80 /tmp/omega-server.log || true
      - name: Full canonical test suite
        shell: bash
        run: |
          set -euo pipefail
          npm test
