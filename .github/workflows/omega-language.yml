# Canonical language + AI runtime verification. Full semantic/cognitive regression is required.
name: OMEGA Language System

on:
  workflow_dispatch:
  push:
    paths:
      - 'omega_language_system.js'
      - 'omega_language_batch03_semantic_extension.js'
      - 'omega_country_semantic_bridge.js'
      - 'omega_resource_semantic_bridge.js'
      - 'omega_minister_runtime_v2.js'
      - 'omega_ai_integrity_layer.js'
      - 'omega_ai_integrity_canonical_bridge.js'
      - 'omega_cognitive_engine.js'
      - 'omega_reasoning_dispatcher.js'
      - 'omega_universal_ai_runtime.js'
      - 'omega_ai_context_bridge.js'
      - 'omega_server_ai_gateway.js'
      - 'minister_query_router.js'
      - 'server_bootstrap.js'
      - 'server.js'
      - 'resource_ontology.json'
      - 'offline_semantic_knowledge.json'
      - 'offline_language_vocabulary.json'
      - 'countries.json'
      - 'resources.json'
      - 'resources_2.json'
      - 'relation_generation_engine.json'
      - 'scripts/test_canonical_ai_chain.cjs'
      - 'scripts/test_semantic_runtime_v4.cjs'
      - 'scripts/validate_game_language_ontology.cjs'
      - 'scripts/test_omega_language_hybrid.cjs'
      - 'scripts/test_omega_language_batch03.cjs'
      - 'package.json'
      - '.github/workflows/omega-language.yml'
  pull_request:
    paths:
      - 'omega_language_system.js'
      - 'omega_language_batch03_semantic_extension.js'
      - 'omega_country_semantic_bridge.js'
      - 'omega_resource_semantic_bridge.js'
      - 'omega_minister_runtime_v2.js'
      - 'omega_ai_integrity_layer.js'
      - 'omega_ai_integrity_canonical_bridge.js'
      - 'omega_cognitive_engine.js'
      - 'omega_reasoning_dispatcher.js'
      - 'omega_universal_ai_runtime.js'
      - 'omega_ai_context_bridge.js'
      - 'omega_server_ai_gateway.js'
      - 'minister_query_router.js'
      - 'server_bootstrap.js'
      - 'server.js'
      - 'resource_ontology.json'
      - 'offline_semantic_knowledge.json'
      - 'offline_language_vocabulary.json'
      - 'countries.json'
      - 'resources.json'
      - 'resources_2.json'
      - 'relation_generation_engine.json'
      - 'scripts/test_canonical_ai_chain.cjs'
      - 'scripts/test_semantic_runtime_v4.cjs'
      - 'scripts/validate_game_language_ontology.cjs'
      - 'scripts/test_omega_language_hybrid.cjs'
      - 'scripts/test_omega_language_batch03.cjs'
      - 'package.json'
      - '.github/workflows/omega-language.yml'

permissions:
  contents: write

jobs:
  language-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit
      - name: Synchronize and repair data-backed language entities
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file='offline_language_vocabulary.json';let text=fs.readFileSync(file,'utf8').replace(/^\uFEFF/,'').trim();
          function parseRepair(source){let s=source;for(let attempt=0;attempt<8;attempt++){try{return JSON.parse(s)}catch(e){const m=String(e.message||'').match(/position (\d+)/i);if(!m)throw e;const p=Number(m[1]);const msg=String(e.message||'');if(/Expected ',' or '}' after property value/i.test(msg)){if(p>=s.length-1){s=s+'}';continue;}const left=s.slice(0,p).replace(/\s+$/,'');const right=s.slice(p);if(!left.endsWith(','))s=left+','+right;else throw e;}else throw e;}}throw new Error('Unable to repair offline_language_vocabulary.json')}
          const vocab=parseRepair(text);const countries=JSON.parse(fs.readFileSync('countries.json','utf8'));const ontology=JSON.parse(fs.readFileSync('resource_ontology.json','utf8'));const rows=Array.isArray(countries)?countries:(countries?.countries||countries?.data||[]);const resources=ontology?.COMMODITY_ONTOLOGIES||{};
          vocab.data_backed_entities ||= {};vocab.data_backed_entities.country ||= {type:'COUNTRY',source:'countries.json + relation_generation_engine.json',ids:[]};vocab.data_backed_entities.resource ||= {type:'RESOURCE',source:'resource_ontology.json',ids:[]};vocab.data_backed_entities.country.ids=[...new Set(rows.map(x=>String(x?.code||x?.id||'').toUpperCase()).filter(Boolean))];vocab.data_backed_entities.country.names=[...new Set(rows.map(x=>String(x?.name||'').trim()).filter(Boolean))];vocab.data_backed_entities.resource.ids=Object.keys(resources).map(String).sort();vocab.data_backed_entities.resource.names=[...new Set(Object.values(resources).flatMap(x=>[x?.name,x?.key]).filter(x=>typeof x==='string'&&x.trim()))];vocab.semantic_operations ||= {};vocab.semantic_operations.TRADE ||= {};vocab.semantic_operations.TRADE.import ||= ['import','imports','imported','importing','importation','আমদানি','আমদানি করা','আমদানি করে','আমদানিকৃত'];vocab.semantic_operations.TRADE.export ||= ['export','exports','exported','exporting','exportation','রপ্তানি','রপ্তানি করা','রপ্তানি করে','রপ্তানিকৃত'];vocab.semantic_operations.TRADE.trade ||= ['trade','trading','traded','বাণিজ্য','ব্যবসা-বাণিজ্য','বাণিজ্য করা'];vocab.semantic_operations.TRADE.import_meaning ||= 'bring goods or resources into a country or market from another country';vocab.semantic_operations.TRADE.export_meaning ||= 'send goods or resources from a country or market to another country';fs.writeFileSync(file,JSON.stringify(vocab,null,2)+'\n');
          NODE
          if ! git diff --quiet -- offline_language_vocabulary.json; then git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add offline_language_vocabulary.json;git commit -m 'fix: repair and sync data-backed language vocabulary [skip ci]';git push;fi
      - name: Repair known semantic runtime syntax defects
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const fixes=[
            ['minister_query_router.js',s=>{const fixed="function classify(q){const w=new Set(words(q));const has=a=>a.some(x=>w.has(x));const trade=['import','imports','importing','export','exports','exporting','supplier','suppliers','buy','buying','purchase','sell','selling','trade','trading','shipment','shipping','freight','tariff','tariffs'];const sec=['secure','security','safe','safety','stockpile','stockpiles','reserve','reserves','shortage','depletion','runway','buffer','vulnerable','risk'];const cmp=['compare','versus','vs','higher','lower','more','less','best','better','largest','smallest','stronger','weaker'];const loc=['where','location','located','based','situated'];const cnt=['how','many','number','count','total','quantity','amount'];let operation='LOOKUP';if(has(sec))operation='SECURITY';else if(has(trade))operation=has(['import','imports','buy','purchase','supplier','suppliers'])?'IMPORT':'EXPORT';else if(has(cmp))operation='COMPARE';else if(has(loc))operation='LOCATION';else if(has(cnt))operation='COUNT';const n=norm(q);const speech=/^(hi|hello|hey)/i.test(n)?'CONVERSATION':(BN.test(q)?((/[?]/.test(q)||/(^|\\s)(কি|কী|কে|কারা|কেন|কোথায়|কোথায়|কখন|কোন|কীভাবে|কিভাবে|কত)(\\s|$)/.test(n))?'QUESTION':'STATEMENT'):((/[?]/.test(q)||/\\b(who|what|which|where|when|why|how|should|can|could|will|would|does|do|did|has|have|is there|are there)\\b/i.test(n))?'QUESTION':'STATEMENT'));return{operation,speech,subject:/\\b(i|me|my|our|we)\\b|\\b(আমার|আমরা|আমি)/i.test(n)?'PLAYER':null}}";const lines=s.split('\n');const i=lines.findIndex(x=>x.startsWith('function classify(q){'));if(i>=0){lines[i]=fixed;return lines.join('\n')}return s}],
            ['omega_production_semantic_runtime_v3.js',s=>s.replace('semantic:p,executable:p.executable}});init();','semantic:p,executable:p.executable}}});init();')
          ];
          for(const [file,fn] of fixes){const old=fs.readFileSync(file,'utf8');const next=fn(old);if(next!==old)fs.writeFileSync(file,next)}
          NODE
          if ! git diff --quiet -- minister_query_router.js omega_production_semantic_runtime_v3.js; then git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add minister_query_router.js omega_production_semantic_runtime_v3.js;git commit -m 'fix: repair semantic runtime syntax defects [skip ci]';git push;fi
      - name: Syntax gate
        run: npm run lint
      - name: Security static gate
        shell: bash
        run: |
          set -euo pipefail
          targets=(omega_language_system.js omega_language_batch03_semantic_extension.js omega_country_semantic_bridge.js omega_resource_semantic_bridge.js omega_ai_integrity_canonical_bridge.js omega_ai_context_bridge.js omega_server_ai_gateway.js minister_query_router.js server_bootstrap.js server.js scripts/test_canonical_ai_chain.cjs scripts/test_semantic_runtime_v4.cjs scripts/validate_game_language_ontology.cjs scripts/test_omega_language_hybrid.cjs scripts/test_omega_language_batch03.cjs)
          if grep -nE '(^|[^[:alnum:]_])(eval[[:space:]]*\(|new[[:space:]]+Function[[:space:]]*\()' "${targets[@]}"; then echo 'SECURITY GATE FAILED: dynamic code execution primitive detected.' >&2; exit 1; fi
          if grep -nE 'document\.write[[:space:]]*\(|innerHTML[[:space:]]*=' "${targets[@]}"; then echo 'SECURITY GATE FAILED: unsafe DOM sink detected in canonical AI subsystem.' >&2; exit 1; fi
          if grep -nE '(api[_-]?key|secret|token)[[:space:]]*[:=][[:space:]]*"[A-Za-z0-9_\-]{20,}"' "${targets[@]}" || grep -nE "(api[_-]?key|secret|token)[[:space:]]*[:=][[:space:]]*'[A-Za-z0-9_\-]{20,}'" "${targets[@]}"; then echo 'SECURITY GATE FAILED: hard-coded credential-like literal detected.' >&2; exit 1; fi
      - name: Canonical ontology validation
        run: node scripts/validate_game_language_ontology.cjs
      - name: Canonical AI chain structural gate
        run: node scripts/test_canonical_ai_chain.cjs
      - name: Existing semantic runtime regression
        run: node scripts/test_semantic_runtime_v4.cjs
      - name: Existing hybrid runtime regression
        run: node scripts/test_omega_language_hybrid.cjs
      - name: Batch 03 40-seed integration regression
        run: node scripts/test_omega_language_batch03.cjs
      - name: Full canonical test suite
        run: npm test
