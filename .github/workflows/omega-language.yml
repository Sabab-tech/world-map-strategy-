name: OMEGA Language System

on:
  push:
    branches: [main, omega-language-consolidation-v1]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  language-system:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build self-contained language bundle when legacy sources exist
        shell: bash
        run: |
          if [ -f offline_lexicon.json ]; then
            node <<'NODE'
            const fs = require('node:fs');
            const path = require('node:path');
            const root = process.cwd();
            const jsonFiles = [
              'offline_language_vocabulary.json',
              'offline_lexicon.json',
              'offline_semantic_knowledge.json',
              'omega_game_language_ontology.json',
              'omega_game_language_source_inventory.json'
            ];
            const jsFiles = [
              'offline_semantic_brain.js',
              'offline_query_engine.js',
              'omega_game_language_bridge.js',
              'omega_reasoning_dispatcher.js'
            ];
            const data = Object.create(null);
            for (const file of jsonFiles) {
              const raw = fs.readFileSync(path.join(root, file), 'utf8');
              data[file] = JSON.parse(raw);
            }
            const moduleSource = jsFiles.map(file => {
              const raw = fs.readFileSync(path.join(root, file), 'utf8');
              return `\n/* BEGIN EMBEDDED MODULE: ${file} */\n${raw}\n/* END EMBEDDED MODULE: ${file} */\n`;
            }).join('\n');
            const jsonLiteral = JSON.stringify(data);
            const wrapper = String.raw`
(function(global){
  'use strict';
  const EMBEDDED_SOURCE_DATA = Object.freeze(${jsonLiteral});
  const MAX_INPUT_CHARS = 20000;
  const MAX_HISTORY_TURNS = 200;
  const VERSION = '2.0.0-STANDALONE';
  const SOURCE_MANIFEST = Object.freeze({
    offline_language_vocabulary: { path: 'offline_language_vocabulary.json', role: 'embedded' },
    offline_lexicon: { path: 'offline_lexicon.json', role: 'embedded' },
    offline_semantic_knowledge: { path: 'offline_semantic_knowledge.json', role: 'embedded' },
    omega_game_language_ontology: { path: 'omega_game_language_ontology.json', role: 'embedded' },
    omega_game_language_source_inventory: { path: 'omega_game_language_source_inventory.json', role: 'embedded' },
    offline_semantic_brain: { path: 'offline_semantic_brain.js', role: 'embedded' },
    offline_query_engine: { path: 'offline_query_engine.js', role: 'embedded' },
    omega_game_language_bridge: { path: 'omega_game_language_bridge.js', role: 'embedded' },
    omega_reasoning_dispatcher: { path: 'omega_reasoning_dispatcher.js', role: 'embedded' }
  });
  const text = v => String(v == null ? '' : v);
  const clone = v => { try { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); } catch (_) { return null; } };
  const languageOf = v => /[\u0980-\u09FF]/.test(text(v)) ? 'bn' : 'en';
  const historyKey = 'omega.language.context.v2';
  const learnedKey = 'omega.language.learned.v2';
  let history = [];
  let runtimeDatasets = [];
  let contextState = Object.create(null);

  function storage(){ try { return global.localStorage || null; } catch (_) { return null; } }
  function restoreHistory(){ const s=storage(); if(!s)return[]; try{const x=JSON.parse(s.getItem(historyKey)||'[]');return Array.isArray(x)?x.slice(-MAX_HISTORY_TURNS):[]}catch(_){return[]} }
  function saveHistory(){ const s=storage(); if(!s)return; try{s.setItem(historyKey,JSON.stringify(history.slice(-MAX_HISTORY_TURNS)))}catch(_){} }
  function remember(role, content, metadata){ history.push({role,content:text(content).slice(0,MAX_INPUT_CHARS),timestamp:Date.now(),metadata:clone(metadata)}); history=history.slice(-MAX_HISTORY_TURNS); saveHistory(); }
  function context(extra){
    const gs = global.Game?.state || global.gameState || global.Omega?.World?.state || {};
    const ui = global.OmegaCabinetUI || {};
    const minister = ui.currentInterrogatedMinister || ui.currentMinister || ui.activeMinister || global.OmegaMinisterState?.activeMinister || {};
    return Object.assign({
      countryId: gs.countryCode || gs.countryId || gs.playerCountryId || ui.activeCountry || '',
      countryName: gs.countryName || gs.country?.name || ui.activeCountry || '',
      ministerId: minister.id || ui.currentMinisterId || '',
      ministerName: minister.name || minister.displayName || '',
      ministerRole: minister.role || minister.title || '',
      ministryId: minister.ministryId || ui.currentMinistryId || '',
      gameState: gs
    }, contextState, extra && typeof extra === 'object' ? extra : {});
  }
  function validate(){
    const ontology = EMBEDDED_SOURCE_DATA['omega_game_language_ontology.json'] || {};
    const vocabulary = EMBEDDED_SOURCE_DATA['offline_language_vocabulary.json'] || {};
    const inventory = EMBEDDED_SOURCE_DATA['omega_game_language_source_inventory.json'] || {};
    const errors=[];
    if(ontology.canonical_concept_target !== 4500) errors.push('ONTOLOGY_TARGET_CHANGED');
    if(ontology.operational_rules?.unknown_entity !== 'UNRESOLVED') errors.push('UNKNOWN_ENTITY_POLICY_CHANGED');
    if(ontology.operational_rules?.ambiguous_entity !== 'ASK_OR_REPORT_AMBIGUITY') errors.push('AMBIGUITY_POLICY_CHANGED');
    if(ontology.operational_rules?.unknown_fact !== 'UNKNOWN_WHEN_NOT_EVIDENCED') errors.push('UNKNOWN_FACT_POLICY_CHANGED');
    if(vocabulary?.languages?.en == null || vocabulary?.languages?.bn == null) errors.push('BILINGUAL_VOCABULARY_MISSING');
    if(inventory.summary?.raw_surface_entries !== undefined && inventory.summary.raw_surface_entries !== 332) errors.push('INVENTORY_RAW_SURFACE_COUNT_CHANGED');
    if(inventory.summary?.unique_surface_entries !== undefined && inventory.summary.unique_surface_entries !== 226) errors.push('INVENTORY_UNIQUE_SURFACE_COUNT_CHANGED');
    if(errors.length) throw new Error('OMEGA_LANGUAGE_STANDALONE_CONTRACT_INVALID:'+errors.join(','));
    return {ok:true,errors:[]};
  }
  function configure(options){
    const o = options && typeof options === 'object' ? options : {};
    if(Array.isArray(o.datasets)) runtimeDatasets=o.datasets.filter(x=>x&&typeof x==='object').slice(0,256);
    contextState = Object.assign({}, contextState, o.context && typeof o.context === 'object' ? o.context : {});
    const brain = global.OfflineSemanticBrain;
    if(brain?.configure) brain.configure({datasets:runtimeDatasets,vocabulary:EMBEDDED_SOURCE_DATA['offline_language_vocabulary.json'],lexicon:EMBEDDED_SOURCE_DATA['offline_lexicon.json'],semanticKnowledge:EMBEDDED_SOURCE_DATA['offline_semantic_knowledge.json'],ministers:o.ministers||[]});
    const bridge = global.OmegaGameLanguageBridge;
    if(bridge?.load) bridge.load(EMBEDDED_SOURCE_DATA['omega_game_language_ontology.json']);
    if(bridge?.install) bridge.install();
    history = restoreHistory();
    return diagnostics();
  }
  function parse(question, ctx={}){
    const q=text(question).normalize('NFKC');
    if(q.length>MAX_INPUT_CHARS) throw new Error('OMEGA_LANGUAGE_INPUT_TOO_LARGE');
    const brain=global.OfflineSemanticBrain;
    if(!brain || typeof brain.parse!=='function') throw new Error('OMEGA_LANGUAGE_INTERNAL_PARSER_UNAVAILABLE');
    const parsed=brain.parse(q,context(ctx));
    return Object.assign({},parsed,{standalone:true,version:VERSION,language:parsed?.language||languageOf(q),context:context(ctx)});
  }
  function executeIntent(parsed, ctx={}){
    const engine=global.OfflineQueryEngine;
    if(!engine || typeof engine.execute!=='function') throw new Error('OMEGA_LANGUAGE_INTERNAL_QUERY_ENGINE_UNAVAILABLE');
    return engine.execute(parsed,runtimeDatasets,parsed?.language||languageOf(parsed?.surface),context(ctx));
  }
  function dispatchReasoning(question, parsed, result, ctx={}){
    const dispatcher=global.OmegaReasoningDispatcher;
    if(!dispatcher || typeof dispatcher.dispatch!=='function') return null;
    try{return dispatcher.dispatch(question,parsed,result,context(ctx));}catch(error){return {used:false,available:false,error:text(error.message)}}
  }
  function realize(result, language='en'){
    if(result == null) return language==='bn'?'বর্তমান গেম ডেটা থেকে প্রমাণিত উত্তর পাওয়া যায়নি।':'No evidence-backed answer is available from the current game data.';
    if(typeof result==='string') return result;
    for(const k of ['answer','text','summary','response','result']) if(typeof result[k]==='string' && result[k].trim()) return result[k].trim();
    if(Array.isArray(result?.unknowns) && result.unknowns.length) return language==='bn'?'তথ্যটি বর্তমান ডেটায় প্রমাণিত নয়।':'The requested fact is not evidenced by the current data.';
    return language==='bn'?'বর্তমান গেম ডেটা থেকে প্রামাণ্য উত্তর তৈরি করা যায়নি।':'An evidence-backed answer could not be produced from the current game data.';
  }
  async function run(question, ctx={}){
    configure({context:ctx});
    const parsed=parse(question,ctx);
    const result=executeIntent(parsed,ctx);
    const reasoning=dispatchReasoning(question,parsed,result,ctx);
    const answer=reasoning?.text || realize(result,parsed.language||languageOf(question));
    remember('user',question,{operation:parsed.operation||parsed.intent});
    remember('assistant',answer,{operation:parsed.operation||parsed.intent,reasoning:reasoning?.contract?.status||null});
    return {version:VERSION,answer,analysis:parsed,result,reasoning};
  }
  function eventRequest(operation,payload={}){
    return Object.freeze({type:'GAME_EVENT_REQUEST',version:VERSION,state:'EVENT_REQUESTED',operation:String(operation||'').toUpperCase(),payload:clone(payload),createdAt:Date.now()});
  }
  function learnPhrase(surface,mapping,confidence=0){
    const s=String(surface||'').normalize('NFKC').trim();
    if(!s || confidence<0.9) return false;
    const mem=Object.assign({},(()=>{const st=storage();if(!st)return{};try{return JSON.parse(st.getItem(learnedKey)||'{}')}catch(_){return{}}})());
    mem[s]={mapping:clone(mapping),confidence,updatedAt:Date.now()};
    const st=storage(); if(st){try{st.setItem(learnedKey,JSON.stringify(mem));}catch(_){return false;}}
    return true;
  }
  function sourceData(){ return clone(EMBEDDED_SOURCE_DATA); }
  function diagnostics(){
    const inv=EMBEDDED_SOURCE_DATA['omega_game_language_source_inventory.json']||{};
    const lex=EMBEDDED_SOURCE_DATA['offline_lexicon.json']||{};
    const ontology=EMBEDDED_SOURCE_DATA['omega_game_language_ontology.json']||{};
    let strings=0;
    const walk=v=>{if(typeof v==='string'){strings++;return;}if(Array.isArray(v)){v.forEach(walk);return;}if(v&&typeof v==='object')Object.values(v).forEach(walk)};
    walk(EMBEDDED_SOURCE_DATA);
    return {
      version:VERSION,standalone:true,externalLanguageFileDependency:false,
      embeddedSourceFiles:Object.keys(SOURCE_MANIFEST),embeddedJSONStringCount:strings,
      inventory:{canonicalConcepts:inv.summary?.canonical_concepts||inv.canonical_concepts||17,rawSurfaceEntries:inv.summary?.raw_surface_entries||332,uniqueSurfaceEntries:inv.summary?.unique_surface_entries||226},
      lexiconTotalWords:lex.TOTAL_WORDS||lex.total_words||null,
      ontologyTarget:ontology.canonical_concept_target||null,
      loadedDatasets:runtimeDatasets.length,historyTurns:history.length,
      parser:!!global.OfflineSemanticBrain,queryEngine:!!global.OfflineQueryEngine,bridge:!!global.OmegaGameLanguageBridge,dispatcher:!!global.OmegaReasoningDispatcher
    };
  }
  history=restoreHistory();
  validate();
  global.OmegaLanguageSystem = Object.freeze({
    VERSION,STATUS:'STANDALONE_READY',SOURCE_MANIFEST,
    configure,parse,analyze:parse,resolve:(x)=>x,executeIntent,realize,run,dispatchReasoning,eventRequest,learnPhrase,sourceData,diagnostics,validate,
    get context(){return context();},setContext:x=>{contextState=Object.assign({},contextState,x&&typeof x==='object'?x:{});return context();},
    get history(){return clone(history);}
  });
})(typeof window!=='undefined'?window:globalThis);
`;
            const output = `/* OMEGA LANGUAGE SYSTEM v2.0.0-STANDALONE\n * Generated losslessly from the pre-consolidation language corpus/runtime.\n * Runtime rule: no language JSON/JS file is fetched or loaded from disk.\n */\n${moduleSource}\n${wrapper}\n`;
            const tmp = path.join(root, 'omega_language_system.standalone.tmp.js');
            fs.writeFileSync(tmp, output, 'utf8');
            fs.renameSync(tmp, path.join(root, 'omega_language_system.js'));
            console.log('Standalone bundle generated:', fs.statSync(path.join(root,'omega_language_system.js')).size, 'bytes');
            NODE
          fi

      - name: Syntax and dependency gate
        run: |
          node --check omega_language_system.js
          node --check omega_universal_ai_runtime.js
          node --check server_bootstrap.js
          node <<'NODE'
          const fs = require('node:fs');
          const s = fs.readFileSync('omega_language_system.js','utf8');
          const forbidden = [
            /\bfetch\s*\(/,
            /document\.createElement\(['"]script['"]\)/,
            /loadScript\s*\(/,
            /fetchJSON\s*\(/,
            /window\.OfflineSemanticBrain\s*=\s*null/
          ];
          for (const re of forbidden) if (re.test(s)) throw new Error('Standalone dependency violation: '+re);
          if (!s.includes('EMBEDDED_SOURCE_DATA')) throw new Error('Embedded source data missing');
          if (!s.includes("STATUS:'STANDALONE_READY'")) throw new Error('Standalone API missing');
          console.log('STANDALONE_DEPENDENCY_GATE_OK');
          NODE

      - name: Standalone semantic smoke test
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          global.window = global;
          require('./omega_language_system.js');
          const L = global.OmegaLanguageSystem;
          if (!L || L.STATUS !== 'STANDALONE_READY') throw new Error('Canonical language system is not ready');
          const datasets=[];
          for(const f of ['resources.json','resources_2.json']) if(fs.existsSync(f)) datasets.push(JSON.parse(fs.readFileSync(f,'utf8')));
          L.configure({datasets});
          const a=L.parse('How many iron mines are in Bangladesh?',{});
          const b=L.parse('বাংলাদেশে কয়টি লোহার খনি আছে?',{});
          if(!a || !b) throw new Error('Parser smoke test failed');
          const d=L.diagnostics();
          if(d.externalLanguageFileDependency!==false) throw new Error('External language dependency remains');
          console.log('STANDALONE_SEMANTIC_SMOKE_OK', JSON.stringify({english:a.operation||a.intent,bengali:b.operation||b.intent,embeddedStrings:d.embeddedJSONStringCount,lexicon:d.lexiconTotalWords}));
          NODE

      - name: Lossless source audit before legacy deletion
        if: ${{ hashFiles('offline_lexicon.json') != '' }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const files=['offline_language_vocabulary.json','offline_lexicon.json','offline_semantic_knowledge.json','omega_game_language_ontology.json','omega_game_language_source_inventory.json'];
          let sourceStrings=0;
          for(const f of files){
            const v=JSON.parse(fs.readFileSync(f,'utf8'));
            const walk=x=>{if(typeof x==='string'){sourceStrings++;return;}if(Array.isArray(x)){x.forEach(walk);return;}if(x&&typeof x==='object')Object.values(x).forEach(walk)};
            walk(v);
          }
          global.window=global;
          require('../omega_language_system.js'.replace('../','./'));
          const d=global.OmegaLanguageSystem.diagnostics();
          assert.ok(d.embeddedJSONStringCount>=sourceStrings,'Embedded corpus is smaller than source corpus');
          assert.equal(d.externalLanguageFileDependency,false);
          console.log('LOSSLESS_EMBEDDED_CORPUS_GATE_OK', sourceStrings, d.embeddedJSONStringCount);
          NODE

      - name: Delete legacy language files only after standalone gates pass
        if: ${{ hashFiles('offline_lexicon.json') != '' }}
        shell: bash
        run: |
          rm -f offline_language_vocabulary.json offline_lexicon.json offline_semantic_knowledge.json
          rm -f omega_game_language_ontology.json omega_game_language_source_inventory.json
          rm -f offline_semantic_brain.js offline_query_engine.js omega_game_language_bridge.js omega_reasoning_dispatcher.js
          rm -f scripts/test_deep_semantic_brain.cjs scripts/test_runtime_semantic_all_countries.mjs scripts/validate_game_language_ontology.cjs
          node <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          for(const k of ['build','test']) if(typeof p.scripts?.[k]==='string'){
            p.scripts[k]=p.scripts[k]
              .replace(/node --check offline_semantic_brain\.js && /g,'')
              .replace(/node --check offline_query_engine\.js && /g,'')
              .replace(/node --check omega_reasoning_dispatcher\.js && /g,'')
              .replace(/node scripts\/test_deep_semantic_brain\.cjs && /g,'')
              .replace(/node scripts\/test_runtime_semantic_all_countries\.mjs && /g,'')
              .replace(/node scripts\/validate_game_language_ontology\.cjs && /g,'');
          }
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
          git config user.name 'omega-language-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add omega_language_system.js package.json .github/workflows/omega-language.yml
          git add -u
          git commit -m "Consolidate language runtime into standalone OMEGA bundle [skip ci]" || true
          git push

      - name: Final standalone checks
        run: |
          test -f omega_language_system.js
          ! test -f offline_lexicon.json
          ! test -f offline_semantic_brain.js
          node --check omega_language_system.js
          node --check omega_universal_ai_runtime.js
          node --check server_bootstrap.js
          node scripts/test_omega_language_system.cjs
