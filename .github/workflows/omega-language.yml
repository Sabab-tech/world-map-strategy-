name: OMEGA Canonical Migration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/omega-language.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Migrate data and source authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          # Country aliases belong in countries.json, not JavaScript.
          p=Path('countries.json'); data=json.loads(p.read_text(encoding='utf-8'))
          rows=data if isinstance(data,list) else data.get('countries',data.get('data',[]))
          if not isinstance(rows,list): raise SystemExit('countries.json is not an array/data registry')
          for row in rows:
            name=str(row.get('name','')).strip().lower()
            if name=='germany':
              row['iso2']=row.get('iso2') or row.get('code')
              row['iso3']=row.get('iso3') or 'DEU'
              row['aliases']=list(dict.fromkeys([*(row.get('aliases') or []),'Deutschland','Federal Republic of Germany','DEU']))
            elif name=='bangladesh':
              row['iso2']=row.get('iso2') or row.get('code')
              row['iso3']=row.get('iso3') or 'BGD'
              row['aliases']=list(dict.fromkeys([*(row.get('aliases') or []),'বাংলাদেশ','BGD']))
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Cognitive engine must never own authoritative country/resource data access.
          p=Path('omega_cognitive_engine.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("this.allEconomies[clean] || this.allEconomies['BANGLADESH'] || null","this.allEconomies[clean] || null")
          s=s.replace("this.allPopulations[clean] || this.allPopulations['BANGLADESH'] || null","this.allPopulations[clean] || null")
          s=s.replace('countryKey = "BANGLADESH"','countryKey = ""')
          s=s.replace("countryCode: countryDetails.countryCode || 'BGD',","countryCode: countryDetails.countryCode || undefined,")
          # Remove an obsolete direct ontology loader if present and remove stale export hooks.
          s=re.sub(r"\n  function loadExternalResourceOntologyMatrix\(\).*?(?=\n  // =+\n  // 4\. MULTI-DOMAIN)","\n  //",s,count=1,flags=re.S)
          s=s.replace('    loadExternalResourceOntologyMatrix,\n','')
          s=s.replace('    reloadOntology: () => loadExternalResourceOntologyMatrix(),\n','    reloadOntology: () => syncCanonicalResourceOntology(),\n')
          # Eliminate direct JSON file loading for resource ontology; bridge owns it.
          s=re.sub(r"\n\s*const ont = path\.resolve\(cwd, 'resource_ontology\.json'\);\n\s*if \(fs\.existsSync\(ont\)\) this\.datasets\.ontology = JSON\.parse\(fs\.readFileSync\(ont, 'utf8'\)\);","\n          const rb=globalScope.OmegaResourceSemanticBridge;\n          if (rb?.ontology) this.datasets.ontology = rb.ontology();",s,count=1)
          if "path.resolve(cwd, 'resource_ontology.json')" in s: raise SystemExit('cognitive resource ontology direct loader remains')
          if "path.resolve(cwd, 'countries.json')" in s: raise SystemExit('cognitive country registry direct loader remains')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add countries.json omega_cognitive_engine.js
          if ! git diff --cached --quiet; then git commit -m 'fix: complete country and resource authority migration [skip ci]'; git push; fi
      - name: Verify migrated HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/canonical-identity-full
          git checkout --force fix/canonical-identity-full
          npm install --ignore-scripts --no-audit
          npm run lint
          node scripts/test_canonical_ai_chain.cjs
          npm run test:data-finding
      - name: Lock this workflow to read-only verification
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/omega-language.yml <<'YAML'
          name: OMEGA Canonical AI Regression
          on:
            workflow_dispatch:
            push:
              paths:
                - 'countries.json'
                - 'omega_cognitive_engine.js'
                - 'omega_resource_semantic_bridge.js'
                - 'offline_query_engine.js'
                - 'offline_semantic_brain.js'
                - 'omega_production_semantic_runtime_v3.js'
                - 'omega_server_ai_gateway.js'
                - 'scripts/test_canonical_ai_chain.cjs'
                - 'package.json'
                - '.github/workflows/omega-language.yml'
          permissions:
            contents: read
          jobs:
            canonical:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                - name: Setup Node.js
                  uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
                  with:
                    node-version: 24
                - name: Install dependencies
                  run: npm install --ignore-scripts --no-audit
                - name: Syntax gate
                  run: npm run lint
                - name: Canonical authority runtime test
                  run: node scripts/test_canonical_ai_chain.cjs
                - name: Data finding regression
                  run: npm run test:data-finding
                - name: Semantic runtime regression
                  run: node scripts/test_semantic_runtime_v4.cjs
                - name: Deep semantic brain regression
                  run: node scripts/test_deep_semantic_brain.cjs
                - name: Reasoning dispatcher regression
                  run: node scripts/test_reasoning_dispatcher.cjs
                - name: Hybrid regression
                  run: node scripts/test_omega_language_hybrid.cjs
                - name: Batch 03 regression
                  run: node scripts/test_omega_language_batch03.cjs
                - name: Full test suite
                  run: npm test
          YAML
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/omega-language.yml
          git commit -m 'ci: lock canonical verification workflow to read-only [skip ci]' || true
          git push
