name: OMEGA Canonical AI Resource Repair
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/omega-language.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Patch resource resolver
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('omega_resource_semantic_bridge.js')
          s=p.read_text(encoding='utf-8')
          old="""  function resolveResource(q){const x=N(q);if(!x)return{id:null,type:'RESOURCE',confidence:0,source:'UNRESOLVED'};const direct=state.resourceAliases.get(x);if(direct&&state.resources.has(direct)){const r=state.resources.get(direct);return{id:r.id,type:'RESOURCE',confidence:1,source:'resource_ontology.json',surface:x,raw:C(r.raw)};}const compact=TOKEN(q);if(state.resources.has(compact)){const r=state.resources.get(compact);return{id:r.id,type:'RESOURCE',confidence:1,source:'RESOURCE_DATA',surface:x,raw:C(r.raw)};}let best=null;for(const[id,r]of state.resources)for(const a0 of r.names||[]){const a=N(a0);if(a&&x.includes(a)){const score=Math.min(.98,.70+a.length/Math.max(100,x.length*2));if(!best||score>best.confidence)best={id,type:'RESOURCE',confidence:score,source:'RESOURCE_DATA',surface:a,raw:C(r.raw)};}}return best||{id:null,type:'RESOURCE',confidence:0,source:'UNRESOLVED'};}"""
          new="""  function resolveResource(q){const x=N(q);if(!x)return{id:null,type:'RESOURCE',confidence:0,source:'UNRESOLVED'};const direct=state.resourceAliases.get(x);if(direct&&state.resources.has(direct)){const r=state.resources.get(direct);return{id:r.id,type:'RESOURCE',confidence:1,source:'resource_ontology.json',surface:x,raw:C(r.raw)};}const compact=TOKEN(q);if(state.resources.has(compact)){const r=state.resources.get(compact);return{id:r.id,type:'RESOURCE',confidence:1,source:'RESOURCE_DATA',surface:x,raw:C(r.raw)};}const qTokens=[...new Set(x.split(' ').filter(t=>t.length>=2))];let best=null;for(const[alias,id]of state.resourceAliases.entries()){if(!state.resources.has(id))continue;const aTokens=[...new Set(alias.split(' ').filter(t=>t.length>=2))];let matched=0;for(const at of aTokens){if(qTokens.some(qt=>qt===at||qt.startsWith(at)||at.startsWith(qt)))matched++;}if(!matched)continue;const aliasCoverage=matched/Math.max(1,aTokens.length),queryCoverage=matched/Math.max(1,qTokens.length);if(aliasCoverage<.5&&queryCoverage<.25)continue;const score=.48*aliasCoverage+.36*queryCoverage+.16*Math.min(1,alias.length/Math.max(alias.length,x.length));if(!best||score>best.confidence){const r=state.resources.get(id);best={id,type:'RESOURCE',confidence:Math.min(.97,score),source:'RESOURCE_DATA',surface:alias,raw:C(r.raw)};}}return best||{id:null,type:'RESOURCE',confidence:0,source:'UNRESOLVED'};}"""
          if old not in s: raise SystemExit('resource resolver anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add omega_resource_semantic_bridge.js
          git commit -m 'fix: resolve resource phrases through canonical registry [skip ci]'
          git push
      - name: Runtime verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/canonical-identity-full
          git reset --hard origin/fix/canonical-identity-full
          npm install --ignore-scripts --no-audit
          npm run lint
          node scripts/test_canonical_ai_chain.cjs
          node scripts/test_deep_semantic_brain.cjs