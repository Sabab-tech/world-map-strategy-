name: OMEGA Canonical AI Final Migration
on:
  push:
    paths:
      - '.github/workflows/omega-language.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Migrate canonical country identity and resource authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('omega_country_semantic_bridge.js')
          s=p.read_text(encoding='utf-8')
          old="function idOf(x,key=''){const i=O(x?.identity)?x.identity:(x||{});return S(i.iso2||i.countryCode||i.country_code||i.code||i.id||i.canonicalId||key).toUpperCase();}"
          new="function idOf(x,key=''){const i=O(x?.identity)?x.identity:(x||{});return S(i.canonicalId||i.iso3||i.iso3Code||i.countryCode3||i.iso2||i.countryCode||i.country_code||i.code||i.id||key).toUpperCase();}"
          if old not in s: raise SystemExit('canonical idOf anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          c=Path('countries.json')
          rows=json.loads(c.read_text(encoding='utf-8'))
          if not isinstance(rows,list): rows=rows.get('countries',rows.get('data',[]))
          changed=False
          for row in rows:
              if not isinstance(row,dict): continue
              cid=row.get('canonicalId') or row.get('iso3') or row.get('iso2') or row.get('code')
              if cid and row.get('canonicalId')!=cid:
                  row['canonicalId']=cid
                  changed=True
              aliases=row.get('aliases')
              if not isinstance(aliases,list): aliases=[]
              vals=[row.get('name'),row.get('iso2'),row.get('iso3'),row.get('code')]
              vals += [row.get('officialName'),row.get('shortName'),row.get('nativeName')]
              for v in vals:
                  if isinstance(v,str) and v.strip() and v not in aliases: aliases.append(v)
              aliases=[x for x in aliases if isinstance(x,str) and x.strip()]
              if row.get('aliases')!=aliases:
                  row['aliases']=aliases
                  changed=True
          if changed: c.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=Path('omega_cognitive_engine.js')
          s=p.read_text(encoding='utf-8')
          forbidden=['BANGLADESH','COUNTRY_ALIASES']
          for marker in forbidden:
              if marker in s: raise SystemExit(f'forbidden cognitive country marker remains: {marker}')
          if 'Object.freeze(_rawLoadedOntology || {' in s or 'const RESOURCE_ONTOLOGY_MATRIX = Object.freeze(_rawLoadedOntology || {' in s:
              import re
              s,n=re.subn(r"const RESOURCE_ONTOLOGY_MATRIX = Object\.freeze\(_rawLoadedOntology \|\| \{.*?\n\s*\}\);\n", "const RESOURCE_ONTOLOGY_MATRIX = {};\nfunction syncCanonicalResourceOntology() {\n    const b = globalScope.OmegaResourceSemanticBridge;\n    const loaded = b?.ontology?.();\n    const root = loaded?.COMMODITY_ONTOLOGIES || loaded || {};\n    if (!root || typeof root !== 'object') return RESOURCE_ONTOLOGY_MATRIX;\n    for (const [k,v] of Object.entries(root)) RESOURCE_ONTOLOGY_MATRIX[k] = v;\n    return RESOURCE_ONTOLOGY_MATRIX;\n  }\n", s, count=1, flags=re.S)
              if n!=1: raise SystemExit('static resource ontology block could not be removed')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add omega_country_semantic_bridge.js countries.json omega_cognitive_engine.js
          if ! git diff --cached --quiet; then git commit -m 'fix: finalize canonical identity and data authority migration [skip ci]'; git push; fi
      - name: Validate repaired source
        run: |
          set -euo pipefail
          git fetch origin fix/canonical-identity-full
          git checkout --force fix/canonical-identity-full
          npm install --ignore-scripts --no-audit
          npm run lint
          node scripts/test_canonical_ai_chain.cjs
      - name: Restore read-only verification workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/omega-language.yml <<'YAML'
          name: OMEGA Canonical AI Regression
          on:
            workflow_dispatch:
            push:
              paths:
                - 'countries.json'
                - 'omega_country_semantic_bridge.js'
                - 'omega_resource_semantic_bridge.js'
                - 'offline_semantic_brain.js'
                - 'offline_query_engine.js'
                - 'omega_cognitive_engine.js'
                - 'omega_production_semantic_runtime_v3.js'
                - 'omega_server_ai_gateway.js'
                - 'omega_ai_context_bridge.js'
                - 'scripts/test_canonical_ai_chain.cjs'
                - 'scripts/test_deep_semantic_brain.cjs'
                - 'package.json'
                - '.github/workflows/omega-language.yml'
          permissions:
            contents: read
          jobs:
            canonical:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
                  with:
                    node-version: 24
                - run: npm install --ignore-scripts --no-audit
                - run: npm run lint
                - run: node scripts/test_canonical_ai_chain.cjs
                - run: node scripts/test_deep_semantic_brain.cjs
                - run: npm run test:data-finding
                - run: node scripts/test_semantic_runtime_v4.cjs
                - run: node scripts/test_omega_language_hybrid.cjs
                - run: node scripts/test_omega_language_batch03.cjs
                - run: npm test
          YAML
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/omega-language.yml
          git commit -m 'ci: lock canonical verification workflow read-only [skip ci]' || true
          git push