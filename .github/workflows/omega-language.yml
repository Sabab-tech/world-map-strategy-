name: OMEGA Canonical Migration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/omega-language.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('countries.json'); rows=json.loads(p.read_text(encoding='utf-8'))
          for row in rows:
            name=str(row.get('name','')).strip().lower()
            if name=='germany':
              row['iso2']=row.get('iso2') or row.get('code'); row['iso3']=row.get('iso3') or 'DEU'
              row['aliases']=list(dict.fromkeys([*(row.get('aliases') or []),'Deutschland','Federal Republic of Germany','DEU']))
            if name=='bangladesh':
              row['iso2']=row.get('iso2') or row.get('code'); row['iso3']=row.get('iso3') or 'BGD'
              row['aliases']=list(dict.fromkeys([*(row.get('aliases') or []),'বাংলাদেশ','BGD']))
          p.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('omega_cognitive_engine.js'); s=p.read_text(encoding='utf-8')
          s=re.sub(r"\n  function loadExternalResourceOntologyMatrix\(\).*?\n  const _rawLoadedOntology = loadExternalResourceOntologyMatrix\(\);\n",'\n',s,count=1,flags=re.S)
          for old,new in [("this.allEconomies[clean] || this.allEconomies['BANGLADESH'] || null","this.allEconomies[clean] || null"),("this.allPopulations[clean] || this.allPopulations['BANGLADESH'] || null","this.allPopulations[clean] || null"),("countryKey = \"BANGLADESH\"","countryKey = \"\"")]: s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add countries.json omega_cognitive_engine.js
          if ! git diff --cached --quiet; then git commit -m 'fix: complete canonical identity data migration [skip ci]'; git push; fi
