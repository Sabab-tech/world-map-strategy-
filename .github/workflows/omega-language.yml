name: OMEGA Canonical AI Resource Repair
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/omega-language.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Ensure canonical country inflection resolver
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('omega_country_semantic_bridge.js')
          s=p.read_text(encoding='utf-8')
          if 'qTokens=q.split(/\\s+/).filter(Boolean)' not in s:
              pattern=r"function rankMatches\(text,map,contextCountryId=null\)\{.*?\nfunction resolveCountry"
              replacement="""function rankMatches(text,map,contextCountryId=null){const q=N(text);if(!q)return[];const qTokens=q.split(/\\s+/).filter(Boolean);const hits=[];for(const[alias,ids]of map.entries()){if(!alias||alias.length<2)continue;const exact=q===alias,boundary=(` ${q} `).includes(` ${alias} `)||q.startsWith(alias+' ')||q.endsWith(' '+alias);let tokenMatch=false;if(!exact&&!boundary){const aTokens=alias.split(/\\s+/).filter(Boolean);tokenMatch=aTokens.length>0&&aTokens.every(at=>at.length>=3&&qTokens.some(qt=>qt===at||qt.startsWith(at)));}if(!exact&&!boundary&&!tokenMatch)continue;for(const id of ids instanceof Set?[...ids]:[ids]){const sameContext=contextCountryId&&S(id).split(':')[0]===S(contextCountryId).toUpperCase();const base=exact?1:(boundary?.995:(.82+.12*(alias.length/Math.max(alias.length,q.length))));hits.push({id,alias,score:Math.min(1,base+(sameContext?.004:0))});}}hits.sort((a,b)=>b.score-a.score||b.alias.length-a.alias.length||String(a.id).localeCompare(String(b.id)));return hits;}\nfunction resolveCountry"""
              s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
              if n!=1: raise SystemExit('country resolver migration anchor not found')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add omega_country_semantic_bridge.js
          git commit -m 'fix: support inflected country aliases from canonical registry [skip ci]' || true
          git push
      - name: Ensure canonical resource alias ingestion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('omega_resource_semantic_bridge.js')
          s=p.read_text(encoding='utf-8')
          if "['aliases','alias_names','altNames','alternateNames','forms','names']" not in s:
              pattern=r"function registerResourceType\(raw,key=''\)\{.*?\n  function ingestOntology"
              replacement="""function registerResourceType(raw,key=''){if(raw==null)return null;const id=TOKEN(first(raw,['id','key','resource_id','resourceTypeId'])||key);if(!id)return null;const names=[];if(O(raw))for(const k of ['name','resourceName','canonicalName','displayName','label','name_en','name_bn'])if(typeof raw[k]==='string'&&raw[k].trim())names.push(raw[k]);if(O(raw))for(const k of ['aliases','alias_names','altNames','alternateNames','forms','names'])for(const x of A(raw[k]))if(typeof x==='string'&&x.trim())names.push(x);names.push(key,id);const old=state.resources.get(id);const entry={id,names:[...new Set([...(old?.names||[]),...names])],raw:O(raw)?C(raw):{id:key,name:raw}};state.resources.set(id,entry);for(const n of entry.names){addAlias(state.resourceAliases,n,id);addAlias(state.resourceAliases,String(n).replace(/_/g,' '),id);}return entry;}\n  function ingestOntology"""
              s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
              if n!=1: raise SystemExit('resource alias migration anchor not found')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add omega_resource_semantic_bridge.js
          git commit -m 'fix: ingest resource aliases from canonical data [skip ci]' || true
          git push
      - name: Validate current branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/canonical-identity-full
          git reset --hard origin/fix/canonical-identity-full
          npm install --ignore-scripts --no-audit
          npm run lint
          node scripts/test_canonical_ai_chain.cjs
          node scripts/test_deep_semantic_brain.cjs
      - name: Lock workflow read-only
        run: exit 0