plugins {
    id 'com.android.application'
}

def omegaRepoRoot = rootProject.projectDir.parentFile
// Give each CI-built APK a monotonically increasing versionCode so Android can recognize newer builds.
def omegaBuildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '2').toInteger()

android {
    namespace 'com.omega.globalsupremecommander'
    compileSdk 36

    defaultConfig {
        applicationId 'com.omega.globalsupremecommander'
        minSdk 24
        targetSdk 35
        versionCode omegaBuildNumber
        versionName "0.1.${omegaBuildNumber}"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }

    sourceSets {
        main {
            assets.srcDir("$buildDir/generated/omegaWebAssets")
        }
    }
}

tasks.register('syncOmegaWebAssets', Sync) {
    from(omegaRepoRoot) {
        include '*.html'
        include '*.js'
        include '*.json'
        include '*.css'
        include '*.png'
        include '*.jpg'
        include '*.jpeg'
        include '*.webp'
        include '*.svg'
        include 'assets/**'
        // UI v2 lives in a directory, so root-only globs do not package its modules.
        include 'omega_ui_v2/**'
        exclude 'android/**'
        exclude 'test/**'
        exclude 'reports/**'
        exclude '.github/**'
        exclude '.git/**'
        exclude 'node_modules/**'
        exclude '*.md'
        exclude 'package.json'
        exclude 'bun.lock'
        exclude 'server.js'
        exclude 'server_bootstrap.js'
        exclude 'omega_server_ai_gateway.js'
        exclude 'omega_resource_ai_decision_service.js'
        exclude '.env*'
    }
    into("$buildDir/generated/omegaWebAssets")
}

tasks.register('transpileOmegaAndroidWebAssets', Exec) {
    dependsOn(tasks.named('syncOmegaWebAssets'))
    commandLine 'node', new File(omegaRepoRoot, 'scripts/transpile_android_web_assets.mjs').absolutePath,
            new File(buildDir, 'generated/omegaWebAssets').absolutePath
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('transpileOmegaAndroidWebAssets'))
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
